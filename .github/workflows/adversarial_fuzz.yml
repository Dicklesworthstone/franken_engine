name: Adversarial Fuzz Targets

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  fuzz-adversarial:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: nightly
      FUZZ_TIME_SECONDS: "60"
      FUZZ_RSS_LIMIT_MB: "2048"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: adversarial-fuzz-targets

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Run deterministic corpus regression + fuzz smoke
        run: ./scripts/run_fuzz_adversarial_targets.sh ci

      - name: Upload fuzz artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-adversarial
          path: artifacts/fuzz_adversarial/

  prepare-native-spread:
    if: github.event_name == 'push' && github.repository == 'Dicklesworthstone/franken_engine' && github.ref == 'refs/heads/main' && github.event.before == '7c497f70358c48c70b7c220ece865600c9206d96'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      files: ${{ steps.prepare.outputs.files }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          clean: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: nightly
          components: rustfmt
      - name: Apply reviewed spread implementation and publish exact file blobs
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, json, os, pathlib, subprocess, urllib.request
          repo = 'Dicklesworthstone/franken_engine'
          expected = {
              'crates/franken-engine/src/baseline_interpreter.rs': 'ad693e1c5aa062726f35ee0a6b0d4f6ca3366894',
              'crates/franken-engine/tests/spread_operator_conformance.rs': '5b46586311df6d22c1e79e0a98b1147ec2e7762b',
          }
          def git(*args, data=None):
              return subprocess.run(['git', *args], input=data, stdout=subprocess.PIPE, check=True).stdout.decode().strip()
          def sha(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          def api(path, payload=None):
              req = urllib.request.Request('https://api.github.com/repos/' + repo + path,
                  data=None if payload is None else json.dumps(payload).encode(),
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                      'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json',
                      'User-Agent': 'OpenAI File Downloader, XaiImageApiFetch/1.0'})
              with urllib.request.urlopen(req, timeout=90) as response:
                  return json.load(response)
          if git('status', '--porcelain'):
              raise RuntimeError('Unexpected dirty checkout')
          for path, original in expected.items():
              if sha(pathlib.Path(path).read_bytes()) != original:
                  raise RuntimeError('Source changed since review: ' + path)
          patch_sha = 'f4963f7e15bf925a05278d04266031aa7235bb62'
          compressed = base64.b64decode(api('/git/blobs/' + patch_sha)['content'])
          if sha(compressed) != patch_sha:
              raise RuntimeError('Patch integrity mismatch')
          patch = gzip.decompress(compressed)
          git('apply', '--check', '--index', '--whitespace=error-all', data=patch)
          git('apply', '--index', '--whitespace=error-all', data=patch)
          source = 'crates/franken-engine/src/baseline_interpreter.rs'
          test = 'crates/franken-engine/tests/spread_operator_conformance.rs'
          subprocess.run(['rustfmt', '--edition', '2024', '--emit', 'stdout', source], stdout=subprocess.DEVNULL, check=True)
          subprocess.run(['rustfmt', '--edition', '2024', test], check=True)
          git('add', '--', test)
          git('diff', '--cached', '--check')
          if set(git('diff', '--cached', '--name-only').splitlines()) != set(expected):
              raise RuntimeError('Unexpected changed paths')
          files = []
          for path in expected:
              data = pathlib.Path(path).read_bytes()
              result = api('/git/blobs', {'content': base64.b64encode(data).decode(), 'encoding': 'base64'})
              if result['sha'] != sha(data):
                  raise RuntimeError('Published source integrity mismatch')
              files.append({'path': path, 'sha': result['sha'], 'bytes': len(data)})
          encoded = json.dumps(files, separators=(',', ':'))
          print('PREPARED_SPREAD_FILES=' + encoded, flush=True)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('files=' + encoded + '\n')
          pathlib.Path(os.environ['RUNNER_TEMP'], 'prepared-spread-files.json').write_text(encoded)
          print(git('diff', '--cached', '--stat'))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: prepared-spread-files
          path: ${{ runner.temp }}/prepared-spread-files.json
          retention-days: 2

  verify-native-spread:
    needs: prepare-native-spread
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          clean: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: nightly
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: execution-native-no-siblings
          cache-on-failure: true
      - name: Fetch hash-verified prepared files
        id: sources
        env:
          GH_TOKEN: ${{ github.token }}
          PREPARED_FILES: ${{ needs.prepare-native-spread.outputs.files }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, urllib.request
          entries = json.loads(os.environ['PREPARED_FILES'])
          if {entry['path'] for entry in entries} != {'crates/franken-engine/src/baseline_interpreter.rs', 'crates/franken-engine/tests/spread_operator_conformance.rs'}:
              raise RuntimeError('Unexpected file set')
          for entry in entries:
              request = urllib.request.Request('https://api.github.com/repos/Dicklesworthstone/franken_engine/git/blobs/' + entry['sha'], headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'User-Agent': 'OpenAI File Downloader, XaiImageApiFetch/1.0'})
              with urllib.request.urlopen(request, timeout=90) as response:
                  data = base64.b64decode(json.load(response)['content'])
              actual = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              if actual != entry['sha'] or len(data) != entry['bytes']:
                  raise RuntimeError('Source integrity mismatch')
              pathlib.Path(entry['path']).write_bytes(data)
          PY
      - name: Execute native spread and destructuring regression suites
        if: ${{ !cancelled() && steps.sources.outcome == 'success' }}
        run: |
          set -o pipefail
          cargo test --locked --no-default-features -p frankenengine-engine --test spread_operator_conformance --test call_spread_bd_hsv77 --test spread_member_call_regression --test bd_8xxcl_new_spread_regression --test destructuring_default_branch_regression --test destructuring_nested_rest_regression 2>&1 | tee "$RUNNER_TEMP/native-spread-tests.log"
      - name: Check all targets
        if: ${{ !cancelled() && steps.sources.outcome == 'success' }}
        run: |
          set -o pipefail
          cargo check --locked --all-targets 2>&1 | tee "$RUNNER_TEMP/native-spread-check.log"
      - name: Clippy all targets
        if: ${{ !cancelled() && steps.sources.outcome == 'success' }}
        run: |
          set -o pipefail
          cargo clippy --locked --all-targets -- -D warnings 2>&1 | tee "$RUNNER_TEMP/native-spread-clippy.log"
      - name: Check formatting
        if: ${{ !cancelled() && steps.sources.outcome == 'success' }}
        run: |
          set -o pipefail
          cargo fmt --check 2>&1 | tee "$RUNNER_TEMP/native-spread-fmt.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-spread-verification-logs
          path: ${{ runner.temp }}/native-spread-*.log
          retention-days: 2

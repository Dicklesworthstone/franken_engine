name: Adversarial Fuzz Targets

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  fuzz-adversarial:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: nightly
      FUZZ_TIME_SECONDS: "60"
      FUZZ_RSS_LIMIT_MB: "2048"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: adversarial-fuzz-targets

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Run deterministic corpus regression + fuzz smoke
        run: ./scripts/run_fuzz_adversarial_targets.sh ci

      - name: Upload fuzz artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-adversarial
          path: artifacts/fuzz_adversarial/

  prepare-property-key-repair:
    if: github.event_name == 'push' && github.repository == 'Dicklesworthstone/franken_engine' && github.ref == 'refs/heads/main' && github.event.before == 'e69e07cb6bc24904c4b0990ff03b341bc7b489df'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      files: ${{ steps.source.outputs.files }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          clean: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: nightly
          components: rustfmt
      - name: Apply reviewed patch and publish exact source blobs
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,os,pathlib,subprocess,urllib.request
          paths={'crates/franken-engine/src/lowering_pipeline.rs':'b78e457c8902f8b1175c2cec154cdab63aa6f963','crates/franken-engine/tests/function_prototype_invocation_regression.rs':'18319df193499f1a052c3e5da8708d92c4ae571a'}
          def digest(data):
              return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          def api(path,body=None):
              req=urllib.request.Request('https://api.github.com/repos/Dicklesworthstone/franken_engine'+path,data=None if body is None else json.dumps(body).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Content-Type':'application/json','User-Agent':'OpenAI File Downloader, XaiImageApiFetch/1.0'})
              with urllib.request.urlopen(req,timeout=90) as response:
                  return json.load(response)
          def git(*args,data=None):
              return subprocess.run(['git',*args],input=data,stdout=subprocess.PIPE,check=True).stdout.decode()
          assert not git('status','--porcelain')
          for path,sha in paths.items():
              assert digest(pathlib.Path(path).read_bytes())==sha,path
          sha='1b400969c8fa6637b8565737d9a98a9534b59811'
          blob=api('/git/blobs/'+sha)
          assert blob['encoding']=='base64'
          patch=base64.b64decode(blob['content'])
          assert digest(patch)==sha
          git('apply','--check','--index','--whitespace=error-all',data=patch)
          git('apply','--index','--whitespace=error-all',data=patch)
          assert set(git('diff','--cached','--name-only').splitlines())==set(paths)
          source='crates/franken-engine/src/lowering_pipeline.rs'
          test='crates/franken-engine/tests/function_prototype_invocation_regression.rs'
          assert digest(pathlib.Path(source).read_bytes())=='83504bfa69bd966ed95ac2a3f2bab91f227bd3c1'
          subprocess.run(['rustfmt','--edition','2024',test],check=True)
          subprocess.run(['rustfmt','--edition','2024','--config','skip_children=true','--emit','stdout',source],stdout=subprocess.DEVNULL,check=True)
          git('add','--',*paths)
          git('diff','--cached','--check')
          files=[]
          for path in paths:
              data=pathlib.Path(path).read_bytes()
              item=api('/git/blobs',{'content':base64.b64encode(data).decode(),'encoding':'base64'})
              assert item['sha']==digest(data)
              files.append({'path':path,'sha':item['sha'],'bytes':len(data)})
          encoded=json.dumps(files,separators=(',',':'))
          print('PREPARED_FILES='+encoded,flush=True)
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              output.write('files='+encoded+'\n')
          print(git('diff','--cached','--stat'))
          PY

  native-property-key-repair:
    needs: prepare-property-key-repair
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      CARGO_BUILD_JOBS: "1"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          clean: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: nightly
          components: rustfmt, clippy
      - name: Load exact prepared sources
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_FILES: ${{ needs.prepare-property-key-repair.outputs.files }}
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,os,pathlib,urllib.request
          files=json.loads(os.environ['SOURCE_FILES'])
          assert {x['path'] for x in files}=={'crates/franken-engine/src/lowering_pipeline.rs','crates/franken-engine/tests/function_prototype_invocation_regression.rs'}
          for item in files:
              req=urllib.request.Request('https://api.github.com/repos/Dicklesworthstone/franken_engine/git/blobs/'+item['sha'],headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'User-Agent':'OpenAI File Downloader, XaiImageApiFetch/1.0'})
              with urllib.request.urlopen(req,timeout=90) as response:
                  blob=json.load(response)
              assert blob['encoding']=='base64'
              data=base64.b64decode(blob['content'])
              assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==item['sha']
              assert len(data)==item['bytes']
              pathlib.Path(item['path']).write_bytes(data)
              print(item['path'],item['sha'])
          PY
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: native-iteration-validation
          cache-on-failure: true
      - name: Execute native conversion and exception regressions
        run: |
          set +e
          cargo test --locked -p frankenengine-engine --no-fail-fast --test function_prototype_invocation_regression --test exception_cross_boundary_bd_8enww_4_7 --test destructuring_default_branch_regression --test destructuring_nested_rest_regression > "$RUNNER_TEMP/property-key-tests.log" 2>&1
          status=$?
          tail -n 180 "$RUNNER_TEMP/property-key-tests.log"
          exit "$status"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: property-key-native-tests
          path: ${{ runner.temp }}/property-key-tests.log
          retention-days: 2
      - name: Compiler gate
        if: ${{ !cancelled() }}
        run: |
          set +e
          timeout 900 cargo check --locked --all-targets > "$RUNNER_TEMP/property-key-check.log" 2>&1
          status=$?
          tail -n 50 "$RUNNER_TEMP/property-key-check.log"
          exit "$status"
      - name: Clippy gate
        if: ${{ !cancelled() }}
        run: |
          set +e
          timeout 900 cargo clippy --locked --all-targets -- -D warnings > "$RUNNER_TEMP/property-key-clippy.log" 2>&1
          status=$?
          tail -n 50 "$RUNNER_TEMP/property-key-clippy.log"
          exit "$status"
      - name: Formatting gate
        if: ${{ !cancelled() }}
        run: |
          set +e
          cargo fmt --check > "$RUNNER_TEMP/property-key-fmt.log" 2>&1
          status=$?
          tail -n 30 "$RUNNER_TEMP/property-key-fmt.log"
          exit "$status"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: property-key-validation
          path: ${{ runner.temp }}/property-key-*.log
          retention-days: 2

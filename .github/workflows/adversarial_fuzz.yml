name: Adversarial Fuzz Targets

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  fuzz-adversarial:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: nightly
      FUZZ_TIME_SECONDS: "60"
      FUZZ_RSS_LIMIT_MB: "2048"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: adversarial-fuzz-targets

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Run deterministic corpus regression + fuzz smoke
        run: ./scripts/run_fuzz_adversarial_targets.sh ci

      - name: Upload fuzz artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-adversarial
          path: artifacts/fuzz_adversarial/

  prepare-destructuring-patches:
    if: github.event_name == 'push' && github.repository == 'Dicklesworthstone/franken_engine' && github.ref == 'refs/heads/main' && github.event.before == '861cdcae561d6c910982467311ccf73a4809ee41'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      versions: ${{ steps.publish.outputs.versions }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          clean: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: nightly
          components: rustfmt
      - name: Apply pinned patches and publish immutable blobs only
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess, urllib.request
          repo = 'Dicklesworthstone/franken_engine'
          target = 'crates/franken-engine/src/lowering_pipeline.rs'
          def api(path, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request('https://api.github.com/repos/' + repo + path, data=data, headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json',
                  'Content-Type': 'application/json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'OpenAI File Downloader, XaiImageApiFetch/1.0',
              })
              with urllib.request.urlopen(req, timeout=60) as response:
                  return json.load(response)
          def git(*args, data=None):
              return subprocess.run(['git', *args], input=data, stdout=subprocess.PIPE, check=True).stdout.decode().strip()
          def blob_hash(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          def publish(path):
              data = pathlib.Path(path).read_bytes()
              expected = blob_hash(data)
              result = api('/git/blobs', {'content': base64.b64encode(data).decode(), 'encoding': 'base64'})
              if result['sha'] != expected:
                  raise RuntimeError('Uploaded blob hash mismatch: ' + path)
              return {'path': path, 'sha': expected, 'bytes': len(data)}
          if git('rev-parse', 'HEAD') != os.environ['GITHUB_SHA'] or git('status', '--porcelain'):
              raise RuntimeError('Checkout is not the clean triggering revision')
          if git('hash-object', target) != '0f73409727d095286f9e768c78c6b58c3fedc3c6':
              raise RuntimeError('Source changed since patch review')
          patches = [
              ('e6df70462744892acfd9a79524e29cf85e112cc8', 'crates/franken-engine/tests/destructuring_default_branch_regression.rs'),
              ('40b320c87abf314489b88f6b0e0c6dfdbbd63e87', 'crates/franken-engine/tests/destructuring_nested_rest_regression.rs'),
          ]
          changed = {target}
          versions = []
          for patch_sha, test_path in patches:
              blob = api('/git/blobs/' + patch_sha)
              if blob['encoding'] != 'base64':
                  raise RuntimeError('Unexpected patch encoding')
              patch = base64.b64decode(blob['content'])
              if blob_hash(patch) != patch_sha or pathlib.Path(test_path).exists():
                  raise RuntimeError('Patch integrity or new-file precondition failed')
              git('apply', '--check', '--index', '--whitespace=error-all', data=patch)
              git('apply', '--index', '--whitespace=error-all', data=patch)
              subprocess.run(['rustfmt', '--edition', '2024', test_path], check=True)
              subprocess.run(['rustfmt', '--edition', '2024', '--emit', 'stdout', target], stdout=subprocess.DEVNULL, check=True)
              git('add', '--', test_path)
              git('diff', '--cached', '--check')
              changed.add(test_path)
              if set(git('diff', '--cached', '--name-only').splitlines()) != changed:
                  raise RuntimeError('Unexpected staged paths')
              versions.append({'patch': patch_sha, 'source': publish(target), 'test': publish(test_path)})
          result = json.dumps(versions, separators=(',', ':'))
          print('PATCH_BLOBS_JSON=' + result, flush=True)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('versions=' + result + '\n')
          print(git('diff', '--cached', '--stat'), flush=True)
          PY

  verify-destructuring-patches:
    needs: prepare-destructuring-patches
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          clean: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: nightly
          components: rustfmt, clippy
      - name: Fetch the exact prepared source and tests
        id: sources
        env:
          GH_TOKEN: ${{ github.token }}
          PATCH_VERSIONS: ${{ needs.prepare-destructuring-patches.outputs.versions }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, urllib.request
          versions = json.loads(os.environ['PATCH_VERSIONS'])
          entries = [versions[1]['source'], versions[0]['test'], versions[1]['test']]
          expected = {
              'crates/franken-engine/src/lowering_pipeline.rs',
              'crates/franken-engine/tests/destructuring_default_branch_regression.rs',
              'crates/franken-engine/tests/destructuring_nested_rest_regression.rs',
          }
          if {entry['path'] for entry in entries} != expected:
              raise RuntimeError('Unexpected verification paths')
          for entry in entries:
              req = urllib.request.Request('https://api.github.com/repos/Dicklesworthstone/franken_engine/git/blobs/' + entry['sha'], headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'OpenAI File Downloader, XaiImageApiFetch/1.0',
              })
              with urllib.request.urlopen(req, timeout=60) as response:
                  blob = json.load(response)
              if blob['encoding'] != 'base64':
                  raise RuntimeError('Unexpected source encoding')
              data = base64.b64decode(blob['content'])
              sha = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              if sha != entry['sha'] or len(data) != entry['bytes']:
                  raise RuntimeError('Source integrity check failed')
              pathlib.Path(entry['path']).write_bytes(data)
              print(entry['path'] + ' ' + sha)
          PY
      - name: Run both native regression suites
        if: ${{ !cancelled() && steps.sources.outcome == 'success' }}
        run: cargo test --locked -p frankenengine-engine --test destructuring_default_branch_regression --test destructuring_nested_rest_regression
      - name: Check all targets
        if: ${{ !cancelled() && steps.sources.outcome == 'success' }}
        run: cargo check --locked --all-targets
      - name: Clippy all targets
        if: ${{ !cancelled() && steps.sources.outcome == 'success' }}
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Check formatting
        if: ${{ !cancelled() && steps.sources.outcome == 'success' }}
        run: cargo fmt --check

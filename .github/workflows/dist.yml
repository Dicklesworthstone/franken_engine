name: dist

# Release pipeline for the `frankenctl` control-plane CLI.
#
# Produces the canonical fleet artifacts consumed by install.sh and by dsr:
#   frankenctl-<target-triple>.tar.xz
#   frankenctl-<target-triple>.tar.xz.sha256        (shasum -a 256 format)
#   frankenctl-<target-triple>.tar.xz.sigstore.json (cosign, keyless)
#
# Linux ships the gnu target (frankenctl links C deps — zstd-sys, mimalloc —
# so a musl static build is intentionally avoided). frankenctl builds in
# Standalone Mode (no sibling repos required).

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive_ext: tar.xz
            binary_name: frankenctl
          - os: macos-14
            target: aarch64-apple-darwin
            archive_ext: tar.xz
            binary_name: frankenctl
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive_ext: zip
            binary_name: frankenctl.exe

    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-09-21
          targets: ${{ matrix.target }}

      - name: Build frankenctl (Standalone Mode + asupersync)
        shell: bash
        env:
          RCH_CARGO_WRAPPER_BYPASS: "1"
        # --no-default-features --features asupersync-integration keeps the release
        # surface standalone (no /dp sibling checkout required) while preserving
        # deterministic asupersync kernel/decision/evidence integration.
        run: cargo build --release --no-default-features --features asupersync-integration -p frankenengine-engine --bin frankenctl --target ${{ matrix.target }}

      - name: Create release archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          ARCHIVE="frankenctl-${{ matrix.target }}.${{ matrix.archive_ext }}"
          binary="target/${{ matrix.target }}/release/${{ matrix.binary_name }}"
          [ -f "$binary" ] || { echo "::error::expected binary not found at $binary"; exit 1; }
          if [ "${{ matrix.archive_ext }}" = "zip" ]; then
            7z a -tzip "dist/$ARCHIVE" "./$binary"
          else
            tar -cJf "dist/$ARCHIVE" -C "target/${{ matrix.target }}/release" "${{ matrix.binary_name }}"
          fi
          (
            cd dist
            if command -v shasum >/dev/null 2>&1; then
              shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"
            else
              sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
            fi
          )

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -laR dist

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign release artifacts (sigstore bundle)
        run: |
          set -euo pipefail
          shopt -s nullglob
          cd dist
          for f in frankenctl-*.tar.xz frankenctl-*.zip; do
            cosign sign-blob --yes --bundle "${f}.sigstore.json" "$f"
          done

      - name: Copy + checksum install scripts
        run: |
          set -euo pipefail
          for script in install.sh install.ps1; do
            cp "$script" dist/ 2>/dev/null || echo "no $script"
            if [ -f "dist/$script" ]; then
              (cd dist && shasum -a 256 "$script" > "$script.sha256")
              cosign sign-blob --yes --bundle "dist/$script.sigstore.json" "dist/$script"
            fi
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Evidence Refresh

# ADR-0012 implementation note 1 (BRIDGE-19.18): schedule the evidence refresh,
# publishing per-claim pass/fail, sharded so expensive claims do not gate cheap ones.
#
# Cadence is derived from each tier's staleness window rather than picked: refreshing
# at about a quarter of the window means a claim is re-verified roughly three times
# before it could expire, so one missed run never makes it provisional.
#
#   volatile   30d window  -> weekly     (Mon 06:00 UTC)
#   standard   90d window  -> monthly    (1st 07:00 UTC)
#   frozen    180d window  -> quarterly  (1st of Jan/Apr/Jul/Oct 08:00 UTC)
#
# HOSTED-RUNNER SUPPORT. The sibling crates that once required `/dp` path checkouts
# are now published and resolved from the registry (bd-gw4cg). The obsolete checkout
# preflight was removed under bd-pa12f after three hosted runs showed it was the
# immediate reason the verifier never started. This workflow intentionally runs on
# `ubuntu-latest`; an unavailable registry or a build failure must reach the normal
# infrastructure-vs-regression classifier rather than being hidden as `skipped`.

on:
  schedule:
    - cron: "0 6 * * 1"          # volatile, weekly
    - cron: "0 7 1 * *"          # standard, monthly
    - cron: "0 8 1 1,4,7,10 *"   # frozen, quarterly
  workflow_dispatch:
    inputs:
      tier:
        description: "Freshness tier to refresh"
        required: true
        default: volatile
        type: choice
        options: [volatile, standard, frozen, all]
      only:
        description: "Optional comma-separated FE-CLAIM-xxx filter from the selected tier"
        required: false
        type: string

permissions:
  contents: read

jobs:
  refresh:
    name: refresh ${{ github.event.inputs.tier || 'scheduled tier' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: evidence-refresh

      # One cron cannot carry an input, so the tier is derived from which schedule
      # fired. A manual dispatch supplies it directly.
      - name: Resolve tier
        id: tier
        run: |
          case "${{ github.event.schedule }}" in
            "0 6 * * 1")        tier=volatile ;;
            "0 7 1 * *")        tier=standard ;;
            "0 8 1 1,4,7,10 *") tier=frozen ;;
            *)                  tier="${{ github.event.inputs.tier || 'volatile' }}" ;;
          esac
          echo "tier=${tier}" >>"$GITHUB_OUTPUT"
          echo "refreshing tier: ${tier}"

      # Exits non-zero only on a REGRESSION (failed verification or invalid verifier
      # configuration), never on staleness — ADR-0012 §5 keeps those separate.
      - name: Run evidence refresh
        env:
          EVIDENCE_REFRESH_ONLY: ${{ github.event.inputs.only || '' }}
        run: ./scripts/run_evidence_refresh_schedule.sh "${{ steps.tier.outputs.tier }}"

      # The runner checkout is ephemeral and this workflow has read-only repository
      # permissions. Preserve the exact tracked receipt edits as an apply-able patch
      # inside the uploaded bundle so a human can review, regenerate the
      # content-addressed indexes, and land them deliberately.
      - name: Bundle refreshed receipt changes
        if: always()
        run: |
          mkdir -p artifacts/evidence_refresh
          git diff --binary -- docs/evidence/ > artifacts/evidence_refresh/refreshed-receipts.patch
          git diff --stat -- docs/evidence/ > artifacts/evidence_refresh/refreshed-receipts.stat
          if [[ -s artifacts/evidence_refresh/refreshed-receipts.patch ]]; then
            echo "::notice::Refreshed receipts differ from the committed state; review refreshed-receipts.patch and regenerate the content-addressed evidence manifests before landing."
            cat artifacts/evidence_refresh/refreshed-receipts.stat
          else
            echo "No receipt changes."
          fi

      - name: Upload refresh bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-refresh-${{ steps.tier.outputs.tier }}-${{ github.run_id }}
          path: artifacts/evidence_refresh/
          if-no-files-found: warn
          retention-days: 90

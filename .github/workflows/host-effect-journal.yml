name: Host Effect Journal

on:
  push:
    branches: [main]
    paths:
      - 'crates/franken-extension-host/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/host-effect-journal.yml'
  pull_request:
    paths:
      - 'crates/franken-extension-host/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/host-effect-journal.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  journal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install nightly --profile minimal --component clippy --component rustfmt
      - name: Run production extension-host unit tests
        run: |
          status=0
          cargo +nightly test --locked -p frankenengine-extension-host --lib -- --nocapture > journal-unit-tests.log 2>&1 || status=$?
          tail -n 100 journal-unit-tests.log
          exit "$status"
      - name: Exercise real filesystem effects and replay
        run: |
          status=0
          cargo +nightly test --locked -p frankenengine-extension-host --test host_effect_journal_admission -- --nocapture > journal-provider-tests.log 2>&1 || status=$?
          tail -n 80 journal-provider-tests.log
          exit "$status"
      - name: Exercise real TCP and TLS framing and absolute deadlines
        run: |
          status=0
          cargo +nightly test --locked -p frankenengine-extension-host --test http_response_framing -- --nocapture > journal-http-provider-tests.log 2>&1 || status=$?
          tail -n 100 journal-http-provider-tests.log
          exit "$status"
      - name: Check extension-host library and tests
        run: |
          status=0
          cargo +nightly check --locked -p frankenengine-extension-host --all-targets > journal-check.log 2>&1 || status=$?
          tail -n 100 journal-check.log
          test "$status" -eq 0 || exit "$status"
          cargo +nightly clippy --locked -p frankenengine-extension-host --all-targets -- -D warnings > journal-clippy.log 2>&1 || status=$?
          tail -n 120 journal-clippy.log
          exit "$status"
      - name: Check touched Rust formatting
        if: always()
        run: |
          rustfmt +nightly --edition 2024 crates/franken-extension-host/src/host_effect_journal.rs crates/franken-extension-host/src/host_io.rs crates/franken-extension-host/tests/host_effect_journal_admission.rs crates/franken-extension-host/tests/http_response_framing.rs
          git diff --exit-code -- crates/franken-extension-host/src/host_effect_journal.rs crates/franken-extension-host/src/host_effect_journal/budget.rs crates/franken-extension-host/src/host_io.rs crates/franken-extension-host/src/host_io crates/franken-extension-host/tests/host_effect_journal_admission.rs crates/franken-extension-host/tests/http_response_framing.rs
      - name: Retain exact validation output and formatted sources
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: host-effect-journal-validation
          path: |
            journal-*.log
            crates/franken-extension-host/src/host_effect_journal.rs
            crates/franken-extension-host/src/host_effect_journal/budget.rs
            crates/franken-extension-host/src/host_io.rs
            crates/franken-extension-host/src/host_io/
            crates/franken-extension-host/tests/host_effect_journal_admission.rs
            crates/franken-extension-host/tests/http_response_framing.rs
          retention-days: 7

  # Temporary transport and validation for the six-file source candidate.
  # Removed by restoring the original workflow in the atomic feature commit.
  network-revocation-candidate:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'Dicklesworthstone/franken_engine'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Apply exact prepared source candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, subprocess, urllib.request
          base = '16bd61c0ae7a8ca817a38456cdcda2e609717123'
          parent = subprocess.check_output(['git', 'rev-parse', 'HEAD^'], text=True).strip()
          if parent != base:
              raise SystemExit('Candidate base moved; reconcile before applying')
          changed = subprocess.check_output(['git', 'diff', '--name-only', base, 'HEAD'], text=True).splitlines()
          if changed != ['.github/workflows/host-effect-journal.yml']:
              raise SystemExit('Unexpected changes since the reviewed source base')
          url = 'https://api.github.com/repos/Dicklesworthstone/franken_engine/git/blobs/aaf0451bac0de9a3fed604ca941c611c8c99f62c'
          request = urllib.request.Request(url, headers={
              'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'OpenAI File Downloader, XaiImageApiFetch/1.0',
          })
          with urllib.request.urlopen(request, timeout=30) as response:
              blob = json.load(response)
          patch = lzma.decompress(base64.b64decode(blob['content']))
          if hashlib.sha256(patch).hexdigest() != '439df368c41d23cca62edd363c8d3e74334a67cb5fef13a2d630487be7cfd502':
              raise SystemExit('Candidate patch digest mismatch')
          subprocess.run(['git', 'apply', '--check', '--whitespace=error', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '--whitespace=error', '-'], input=patch, check=True)
          print('Applied the digest-verified six-file network revocation candidate')
          PY
      - name: Install Rust
        run: rustup toolchain install nightly --profile minimal --component clippy --component rustfmt
      - name: Format candidate before compiling
        run: rustfmt +nightly --edition 2024 crates/franken-extension-host/src/host_io.rs crates/franken-extension-host/tests/http_response_framing.rs
      - name: Execute candidate unit tests
        run: |
          status=0
          cargo +nightly test --locked -p frankenengine-extension-host --lib -- --nocapture > candidate-unit-tests.log 2>&1 || status=$?
          tail -n 120 candidate-unit-tests.log
          exit "$status"
      - name: Execute candidate real-provider and replay tests
        run: |
          status=0
          cargo +nightly test --locked -p frankenengine-extension-host --test host_effect_journal_admission -- --nocapture > candidate-journal-tests.log 2>&1 || status=$?
          tail -n 100 candidate-journal-tests.log
          test "$status" -eq 0 || exit "$status"
          cargo +nightly test --locked -p frankenengine-extension-host --test http_response_framing -- --nocapture > candidate-network-tests.log 2>&1 || status=$?
          tail -n 120 candidate-network-tests.log
          exit "$status"
      - name: Check candidate targets lint and formatting
        run: |
          status=0
          cargo +nightly check --locked -p frankenengine-extension-host --all-targets > candidate-check.log 2>&1 || status=$?
          tail -n 120 candidate-check.log
          test "$status" -eq 0 || exit "$status"
          cargo +nightly clippy --locked -p frankenengine-extension-host --all-targets -- -D warnings > candidate-clippy.log 2>&1 || status=$?
          tail -n 120 candidate-clippy.log
          test "$status" -eq 0 || exit "$status"
          rustfmt +nightly --check --edition 2024 crates/franken-extension-host/src/host_io.rs crates/franken-extension-host/tests/http_response_framing.rs
      - name: Publish validated source blobs without moving any refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, urllib.request
          paths = [
              'crates/franken-extension-host/src/host_io.rs',
              'crates/franken-extension-host/src/host_io/network_deadline.rs',
              'crates/franken-extension-host/src/host_io/network_deadline/connection_race.rs',
              'crates/franken-extension-host/src/host_io/network_deadline/resolver.rs',
              'crates/franken-extension-host/src/host_io/network_deadline/revocation.rs',
              'crates/franken-extension-host/tests/http_response_framing.rs',
          ]
          manifest = {'base': '16bd61c0ae7a8ca817a38456cdcda2e609717123', 'validation_commit': os.environ['GITHUB_SHA'], 'files': []}
          for path in paths:
              data = pathlib.Path(path).read_bytes()
              expected = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              body = json.dumps({'content': base64.b64encode(data).decode(), 'encoding': 'base64'}).encode()
              request = urllib.request.Request(
                  'https://api.github.com/repos/Dicklesworthstone/franken_engine/git/blobs',
                  data=body, method='POST', headers={
                      'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                      'Accept': 'application/vnd.github+json',
                      'Content-Type': 'application/json',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'User-Agent': 'OpenAI File Downloader, XaiImageApiFetch/1.0',
                  })
              with urllib.request.urlopen(request, timeout=30) as response:
                  result = json.load(response)
              if result['sha'] != expected:
                  raise SystemExit('Source blob digest mismatch: ' + path)
              manifest['files'].append({'path': path, 'sha': expected, 'mode': '100644', 'type': 'blob'})
          text = json.dumps(manifest, indent=2)
          pathlib.Path('candidate-source-blobs.json').write_text(text + '\n')
          print(text)
          PY
      - name: Retain exact candidate sources and validation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: network-revocation-candidate-validation
          path: |
            candidate-*.log
            candidate-source-blobs.json
            crates/franken-extension-host/src/host_io.rs
            crates/franken-extension-host/src/host_io/
            crates/franken-extension-host/tests/http_response_framing.rs
          retention-days: 7

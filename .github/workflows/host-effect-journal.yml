name: Host Effect Journal

on:
  push:
    branches: [main]
    paths:
      - 'crates/franken-extension-host/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/host-effect-journal.yml'
  pull_request:
    paths:
      - 'crates/franken-extension-host/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/host-effect-journal.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  journal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install nightly --profile minimal --component clippy --component rustfmt
      - name: Run production extension-host unit tests
        run: |
          status=0
          cargo +nightly test --locked -p frankenengine-extension-host --lib -- --nocapture > journal-unit-tests.log 2>&1 || status=$?
          tail -n 100 journal-unit-tests.log
          exit "$status"
      - name: Exercise real filesystem effects and replay
        run: |
          status=0
          cargo +nightly test --locked -p frankenengine-extension-host --test host_effect_journal_admission -- --nocapture > journal-provider-tests.log 2>&1 || status=$?
          tail -n 80 journal-provider-tests.log
          exit "$status"
      - name: Exercise real TCP and TLS framing and absolute deadlines
        run: |
          status=0
          cargo +nightly test --locked -p frankenengine-extension-host --test http_response_framing -- --nocapture > journal-http-provider-tests.log 2>&1 || status=$?
          tail -n 100 journal-http-provider-tests.log
          exit "$status"
      - name: Check extension-host library and tests
        run: |
          status=0
          cargo +nightly check --locked -p frankenengine-extension-host --all-targets > journal-check.log 2>&1 || status=$?
          tail -n 100 journal-check.log
          test "$status" -eq 0 || exit "$status"
          cargo +nightly clippy --locked -p frankenengine-extension-host --all-targets -- -D warnings > journal-clippy.log 2>&1 || status=$?
          tail -n 120 journal-clippy.log
          exit "$status"
      - name: Check touched Rust formatting
        if: always()
        run: |
          rustfmt +nightly --edition 2024 crates/franken-extension-host/src/host_effect_journal.rs crates/franken-extension-host/src/host_io.rs crates/franken-extension-host/tests/host_effect_journal_admission.rs crates/franken-extension-host/tests/http_response_framing.rs
          git diff --exit-code -- crates/franken-extension-host/src/host_effect_journal.rs crates/franken-extension-host/src/host_effect_journal/budget.rs crates/franken-extension-host/src/host_io.rs crates/franken-extension-host/src/host_io crates/franken-extension-host/tests/host_effect_journal_admission.rs crates/franken-extension-host/tests/http_response_framing.rs
      - name: Retain exact validation output and formatted sources
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: host-effect-journal-validation
          path: |
            journal-*.log
            crates/franken-extension-host/src/host_effect_journal.rs
            crates/franken-extension-host/src/host_effect_journal/budget.rs
            crates/franken-extension-host/src/host_io.rs
            crates/franken-extension-host/src/host_io/
            crates/franken-extension-host/tests/host_effect_journal_admission.rs
            crates/franken-extension-host/tests/http_response_framing.rs
          retention-days: 7
  scoped-network-candidate:
    # Temporary executable validation for the cell-to-network cancellation gap.
    # Removed when the exact tested source blobs are committed atomically.
    strategy:
      fail-fast: false
      matrix:
        scope: [host, engine]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
          persist-credentials: false
      - name: Apply reviewed operation-control candidate on exact main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess, urllib.request
          base = '92e1fa526c1be0e73dda319c5fdc973a5f73b062'
          subprocess.run(['git', 'merge-base', '--is-ancestor', base, 'HEAD'], check=True)
          if subprocess.check_output(['git', 'diff', '--name-only', base, 'HEAD'], text=True).splitlines() != ['.github/workflows/host-effect-journal.yml']:
              raise SystemExit('Unexpected source changes before candidate')
          req = urllib.request.Request('https://api.github.com/repos/Dicklesworthstone/franken_engine/git/blobs/4dfadcbe3edff1159c01e7744c698af21c3d07d7', headers={
              'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
              'Accept': 'application/vnd.github+json',
              'User-Agent': 'OpenAI File Downloader, XaiImageApiFetch/1.0'})
          with urllib.request.urlopen(req, timeout=30) as response:
              patch = lzma.decompress(base64.b64decode(json.load(response)['content']))
          if hashlib.sha256(patch).hexdigest() != '5ec6ba774e30510565e3c2ab641e4c4bbd3a235731a33337d1eb3a261135dbf4':
              raise SystemExit('Patch digest mismatch')
          subprocess.run(['git', 'apply', '--check', '--whitespace=error', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '--whitespace=error', '-'], input=patch, check=True)
          followup_req = urllib.request.Request('https://api.github.com/repos/Dicklesworthstone/franken_engine/git/blobs/129dc3558c8020fdc771fc02f3d53672d51612bf', headers={
              'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
              'Accept': 'application/vnd.github+json',
              'User-Agent': 'OpenAI File Downloader, XaiImageApiFetch/1.0'})
          with urllib.request.urlopen(followup_req, timeout=30) as response:
              followup = base64.b64decode(json.load(response)['content'])
          if hashlib.sha1(b'blob ' + str(len(followup)).encode() + b'\0' + followup).hexdigest() != '129dc3558c8020fdc771fc02f3d53672d51612bf':
              raise SystemExit('Callback regression patch mismatch')
          subprocess.run(['git', 'apply', '--check', '-'], input=followup, check=True)
          subprocess.run(['git', 'apply', '-'], input=followup, check=True)
          pathlib.Path('candidate-base.txt').write_text(base + '\n')
          PY
      - name: Install Rust
        run: rustup toolchain install nightly --profile minimal --component clippy --component rustfmt
      - name: Format candidate without reformatting unrelated engine code
        run: |
          rustfmt +nightly --edition 2024 crates/franken-extension-host/src/host_io.rs crates/franken-extension-host/tests/http_response_framing.rs crates/franken-engine/tests/orchestrator_live_revocation.rs
          python3 - <<'PY'
          import json, pathlib, re, subprocess
          for name in ['baseline_interpreter', 'execution_orchestrator']:
              path = 'crates/franken-engine/src/' + name + '.rs'
              diff = subprocess.check_output(['git', 'diff', '--unified=0', '--', path], text=True)
              spans = [{'file': str(pathlib.Path(path).resolve()), 'range': [int(m[1]), int(m[1])+max(int(m[2] or '1'),1)-1]}
                       for m in re.finditer(r'^@@ -\d+(?:,\d+)? \+(\d+)(?:,(\d+))? @@', diff, re.M)]
              subprocess.run(['rustfmt', '+nightly', '--edition', '2024', '--unstable-features', '--config', 'skip_children=true', '--file-lines', json.dumps(spans), path], check=True)
          PY
      - name: Execute full extension-host unit and real-provider regressions
        if: matrix.scope == 'host'
        run: |
          set -o pipefail
          cargo +nightly test --locked -p frankenengine-extension-host --lib -- --nocapture 2>&1 | tee candidate-host-unit.log
          cargo +nightly test --locked -p frankenengine-extension-host --no-fail-fast --test host_effect_journal_admission --test http_response_framing -- --nocapture 2>&1 | tee candidate-host-integration.log
          cargo +nightly check --locked -p frankenengine-extension-host --all-targets 2>&1 | tee candidate-host-check.log
          cargo +nightly clippy --locked -p frankenengine-extension-host --all-targets -- -D warnings 2>&1 | tee candidate-host-clippy.log
          rustfmt +nightly --check --edition 2024 crates/franken-extension-host/src/host_io.rs crates/franken-extension-host/tests/http_response_framing.rs
      - name: Execute production engine cell and admission regressions
        if: matrix.scope == 'engine'
        run: |
          python3 - <<'PY'
          import pathlib, re
          p = pathlib.Path('crates/franken-engine/Cargo.toml')
          original = p.read_text()
          pathlib.Path('/tmp/scoped-original-engine-Cargo.toml').write_text(original)
          # Omit unrelated executable targets only. Compile the entire original
          # engine library with all of its modules and selected integration tests.
          selected = original.replace('[package]\n', '[package]\nautobins = false\n', 1)
          selected = re.sub(r'\[\[bin\]\][\s\S]*?(?=\n\[|\Z)', '', selected)
          p.write_text(selected)
          PY
          set -o pipefail
          cargo +nightly test --locked -p frankenengine-engine --no-default-features --no-fail-fast --test orchestrator_execution_budgets --test orchestrator_live_revocation --test work_scope_revocation -- --nocapture 2>&1 | tee candidate-engine-tests.log
          cargo +nightly check --locked -p frankenengine-engine --no-default-features --lib 2>&1 | tee candidate-engine-check.log
      - name: Report strict engine lint independently of test execution
        if: success() && matrix.scope == 'engine'
        continue-on-error: true
        run: |
          set -o pipefail
          cargo +nightly clippy --locked -p frankenengine-engine --no-default-features --lib -- -D warnings 2>&1 | tee candidate-engine-clippy.log
      - name: Publish exact tested source blobs without moving refs
        env:
          GH_TOKEN: ${{ github.token }}
          SCOPE: ${{ matrix.scope }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess, urllib.request
          host = ['crates/franken-extension-host/src/host_io.rs',
                  'crates/franken-extension-host/src/host_io/control.rs',
                  'crates/franken-extension-host/src/host_io/network_deadline.rs',
                  'crates/franken-extension-host/src/host_io/network_deadline/revocation.rs',
                  'crates/franken-extension-host/tests/http_response_framing.rs']
          engine = ['crates/franken-engine/src/baseline_interpreter.rs',
                    'crates/franken-engine/src/execution_orchestrator.rs',
                    'crates/franken-engine/tests/orchestrator_live_revocation.rs']
          manifest = {'base': '92e1fa526c1be0e73dda319c5fdc973a5f73b062', 'validation_commit': os.environ['GITHUB_SHA'], 'scope': os.environ['SCOPE'], 'files': []}
          for path in (host if os.environ['SCOPE'] == 'host' else engine):
              data = pathlib.Path(path).read_bytes()
              expected = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              body = json.dumps({'content': base64.b64encode(data).decode(), 'encoding': 'base64'}).encode()
              req = urllib.request.Request('https://api.github.com/repos/Dicklesworthstone/franken_engine/git/blobs', data=body, method='POST', headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json',
                  'User-Agent': 'OpenAI File Downloader, XaiImageApiFetch/1.0'})
              with urllib.request.urlopen(req, timeout=60) as response:
                  result = json.load(response)
              if result['sha'] != expected:
                  raise SystemExit('Source hash mismatch: ' + path)
              manifest['files'].append({'path':path, 'sha':expected, 'type':'blob', 'mode':'100644'})
          text = json.dumps(manifest, indent=2)
          pathlib.Path('candidate-source-blobs.json').write_text(text + '\n')
          print(text)
          PY
      - name: Restore local target selection and retain actual sources and logs
        if: always()
        run: |
          if test -f /tmp/scoped-original-engine-Cargo.toml; then cp /tmp/scoped-original-engine-Cargo.toml crates/franken-engine/Cargo.toml; fi
          git diff --stat > candidate-diff-stat.txt
          git diff -- crates/franken-engine > candidate-engine.patch
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scoped-network-${{ matrix.scope }}-validation
          path: |
            candidate-*.log
            candidate-*.json
            candidate-*.txt
            candidate-*.patch
            crates/franken-extension-host/src/host_io.rs
            crates/franken-extension-host/src/host_io/
            crates/franken-extension-host/tests/http_response_framing.rs
            crates/franken-engine/src/baseline_interpreter.rs
            crates/franken-engine/src/execution_orchestrator.rs
            crates/franken-engine/tests/orchestrator_live_revocation.rs
          retention-days: 7

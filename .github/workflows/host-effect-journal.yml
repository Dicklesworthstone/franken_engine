name: Host Effect Journal

on:
  push:
    branches: [main]
    paths:
      - 'crates/franken-extension-host/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/host-effect-journal.yml'
  pull_request:
    paths:
      - 'crates/franken-extension-host/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/host-effect-journal.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  journal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install nightly --profile minimal
      - name: Run production journal unit tests
        run: cargo +nightly test --locked -p frankenengine-extension-host --lib host_effect_journal:: -- --nocapture

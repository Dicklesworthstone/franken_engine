name: Native JSON Runtime

on:
  push:
    branches: [main]
    paths:
      - 'crates/franken-engine/src/baseline_interpreter*'
      - 'crates/franken-engine/src/baseline_interpreter/**'
      - 'crates/franken-engine/src/lowering_pipeline.rs'
      - 'crates/franken-engine/src/capability.rs'
      - 'crates/franken-engine/src/parser.rs'
      - 'crates/franken-engine/tests/json_*'
      - 'crates/franken-engine/tests/js_string_integration.rs'
      - '.github/workflows/json-runtime.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  json:
    strategy:
      fail-fast: false
      matrix:
        mode: [runtime-tests, full-engine-check]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Retain exact committed JSON sources
        run: |
          mkdir -p json-validation
          git rev-parse HEAD > json-validation/revision.txt
          python3 - <<'PY'
          import hashlib, json, pathlib
          paths = [
              'crates/franken-engine/src/baseline_interpreter.rs',
              'crates/franken-engine/src/baseline_interpreter/json_parse.rs',
              'crates/franken-engine/src/baseline_interpreter/json_stringify.rs',
              'crates/franken-engine/tests/js_string_integration.rs',
              'crates/franken-engine/tests/json_parse_execution.rs',
              'crates/franken-engine/tests/json_stringify_execution.rs',
              'crates/franken-engine/src/lowering_pipeline.rs',
              'crates/franken-engine/src/capability.rs',
              'crates/franken-engine/src/parser.rs',
          ]
          root = pathlib.Path('json-validation')
          (root / 'paths.json').write_text(json.dumps(paths))
          hashes = {}
          for path in paths:
              data = pathlib.Path(path).read_bytes()
              hashes[path] = hashlib.sha1(('blob ' + str(len(data)) + '\0').encode() + data).hexdigest()
              dest = root / 'source' / path
              dest.parent.mkdir(parents=True, exist_ok=True)
              dest.write_bytes(data)
          (root / 'source-hashes.json').write_text(json.dumps(hashes, indent=2))
          PY
      - name: Install Rust
        run: rustup toolchain install nightly --profile minimal --component rustfmt --component clippy
      - name: Check committed JSON module formatting
        run: |
          rustfmt +nightly --edition 2024 --check --config skip_children=true crates/franken-engine/src/baseline_interpreter/json_parse.rs crates/franken-engine/src/baseline_interpreter/json_stringify.rs crates/franken-engine/tests/json_parse_execution.rs crates/franken-engine/tests/json_stringify_execution.rs
      - name: Check complete native engine library
        if: matrix.mode == 'full-engine-check'
        run: |
          set -o pipefail
          cargo +nightly check --locked -p frankenengine-engine --no-default-features --lib 2>&1 | tee json-validation/full-engine-check.log
      - name: Select existing production runtime dependency closure
        if: matrix.mode == 'runtime-tests'
        run: |
          python3 - <<'PY'
          import pathlib, subprocess, textwrap
          text = pathlib.Path('.github/workflows/native-runtime.yml').read_text()
          step = text.split('      - name: Select native runtime dependency closure\n', 1)[1].split('\n      - name:', 1)[0]
          subprocess.run(['bash', '-e', '-c', textwrap.dedent(step.split('        run: |\n', 1)[1])], check=True)
          pathlib.Path('json-validation/runtime-modules.txt').write_bytes(pathlib.Path('async-generator-validation/runtime-modules.txt').read_bytes())
          PY
      - name: Run JSON and UTF-16 execution regressions
        if: matrix.mode == 'runtime-tests'
        run: |
          set -o pipefail
          cargo +nightly test --locked -p frankenengine-engine --no-default-features --no-fail-fast --test json_parse_execution --test json_stringify_execution --test js_string_integration -- --nocapture 2>&1 | tee json-validation/source-tests.log
      - name: Check full-engine strict lint
        if: matrix.mode == 'full-engine-check'
        run: |
          set -o pipefail
          cargo +nightly clippy --locked -p frankenengine-engine --no-default-features --lib -- -D warnings 2>&1 | tee json-validation/full-engine-clippy.log
      - name: Retain complete validation output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: json-validation-${{ matrix.mode }}
          path: json-validation/
          retention-days: 7
  array-from-integration:
    if: contains(github.event.head_commit.message, '[array-from-integration]')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    permissions:
      contents: write
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Apply exact patch sequence and retain both increments
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p array-from-validation
          git rev-parse HEAD > array-from-validation/revision.txt
          python3 - <<'PY'
          import base64, gzip, hashlib, json, os, pathlib, subprocess, urllib.request
          root = pathlib.Path('array-from-validation')
          paths = [
              'crates/franken-engine/src/baseline_interpreter.rs',
              'crates/franken-engine/src/baseline_interpreter/array_from.rs',
              'crates/franken-engine/tests/array_from_execution.rs',
          ]
          parent = pathlib.Path(paths[0])
          (root / 'original-baseline.rs').write_bytes(parent.read_bytes())
          def blob(sha):
              request = urllib.request.Request(
                  f'https://api.github.com/repos/{os.environ["GITHUB_REPOSITORY"]}/git/blobs/{sha}',
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                           'User-Agent': 'OpenAI File Downloader, XaiImageApiFetch/1.0'})
              with urllib.request.urlopen(request, timeout=60) as response:
                  data = base64.b64decode(json.load(response)['content'])
              actual = hashlib.sha1(f'blob {len(data)}\0'.encode() + data).hexdigest()
              assert actual == sha, (actual, sha)
              return data
          chunks = [
              '1f46195db2788173a49109f147aef4f3d2fe6506',
              '5f68aa8d321ab3ae6cae2532b0e6bccc4bf6ff3f',
              '6da615e9678342f60410054214d3ae9e6e779142',
              'f136adeea40434f2c128cc41f2d23081003e9aea',
              '9ef0882fde21d6bfe10263c0f1ad3298df2378f5',
          ]
          payload = b''.join(blob(sha) for sha in chunks)
          assert hashlib.sha1(f'blob {len(payload)}\0'.encode() + payload).hexdigest() == 'acb2684db41e53a5d026bf46b79e737513f60429'
          migration = root / 'unit-regression-migration.patch'
          migration.write_bytes(blob('96bd615441a7c3049b6dfff1c19e581686e4f558'))
          patches = json.loads(gzip.decompress(payload))
          for stage, name in enumerate(sorted(patches), 1):
              patch = root / name
              patch.write_text(patches[name])
              touched = [line.split(' b/', 1)[1] for line in patches[name].splitlines() if line.startswith('diff --git ')]
              assert set(touched) <= set(paths), touched
              subprocess.run(['git', 'apply', '--check', str(patch)], check=True)
              subprocess.run(['git', 'apply', str(patch)], check=True)
              if stage == 1:
                  subprocess.run(['git', 'apply', '--check', str(migration)], check=True)
                  subprocess.run(['git', 'apply', str(migration)], check=True)
              assert 'invoke_simple_array_from_callback' not in parent.read_text()
              for path in paths:
                  dest = root / f'stage{stage}' / path
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  dest.write_bytes(pathlib.Path(path).read_bytes())
              print(f'Stage {stage} applies cleanly', flush=True)
          (root / 'paths.json').write_text(json.dumps(paths))
          PY
      - name: Install pinned Rust
        run: |
          toolchain=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy
          echo "RUSTUP_TOOLCHAIN=$toolchain" >> "$GITHUB_ENV"
      - name: Format and publish source blobs without changing any ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess, textwrap, urllib.request
          root = pathlib.Path('array-from-validation')
          paths = json.loads((root / 'paths.json').read_text())
          output = {'base': (root / 'revision.txt').read_text().strip(), 'stages': {}}
          for stage in (1, 2):
              subprocess.run(['rustfmt', '--edition', '2024', '--config', 'skip_children=true',
                              *(str(root / f'stage{stage}' / p) for p in paths[1:])], check=True)
              parent = root / f'stage{stage}' / paths[0]
              text = parent.read_text()
              start = text.index('    fn callback_bigints_reserve_cumulative_locals_and_construction_peak_bd_aw8td()')
              end = text.index('\n    #[test]', start)
              body = textwrap.dedent(text[start:end]).rstrip()
              formatted = subprocess.run(['rustfmt', '--edition', '2024', '--emit', 'stdout'], input=body, text=True, capture_output=True, check=True).stdout
              text = text[:start] + textwrap.indent(formatted.rstrip(), '    ') + '\n' + text[end:]
              parent.write_text(text)
              entries = {}
              for path in paths:
                  data = (root / f'stage{stage}' / path).read_bytes()
                  expected = hashlib.sha1(f'blob {len(data)}\0'.encode() + data).hexdigest()
                  request = urllib.request.Request(
                      f'https://api.github.com/repos/{os.environ["GITHUB_REPOSITORY"]}/git/blobs',
                      data=json.dumps({'content': base64.b64encode(data).decode(), 'encoding': 'base64'}).encode(),
                      headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                               'Content-Type': 'application/json',
                               'User-Agent': 'OpenAI File Downloader, XaiImageApiFetch/1.0'}, method='POST')
                  with urllib.request.urlopen(request, timeout=60) as response:
                      actual = json.load(response)['sha']
                  assert actual == expected, (path, actual, expected)
                  entries[path] = actual
              output['stages'][str(stage)] = entries
          (root / 'source-blobs.json').write_text(json.dumps(output, indent=2))
          print(json.dumps(output, indent=2), flush=True)
          PY
      - name: Retain prepared source identities before compilation
        uses: actions/upload-artifact@v4
        with:
          name: array-from-sources
          path: array-from-validation/
          retention-days: 7
      - name: Select existing native runtime dependency closure
        run: |
          python3 - <<'PY'
          import pathlib, subprocess, textwrap
          text = pathlib.Path('.github/workflows/native-runtime.yml').read_text()
          step = text.split('      - name: Select native runtime dependency closure\n', 1)[1].split('\n      - name:', 1)[0]
          subprocess.run(['bash', '-e', '-c', textwrap.dedent(step.split('        run: |\n', 1)[1])], check=True)
          PY
      - name: Validate first implementation increment
        run: |
          python3 - <<'PY'
          import json, pathlib
          root = pathlib.Path('array-from-validation')
          for path in json.loads((root / 'paths.json').read_text()):
              pathlib.Path(path).write_bytes((root / 'stage1' / path).read_bytes())
          PY
          set -o pipefail
          cargo test --locked -p frankenengine-engine --no-default-features --test array_from_execution -- --nocapture 2>&1 | tee array-from-validation/stage1-tests.log
      - name: Validate iterator implementation increment
        if: always()
        run: |
          test -f array-from-validation/source-blobs.json
          python3 - <<'PY'
          import json, pathlib
          root = pathlib.Path('array-from-validation')
          for path in json.loads((root / 'paths.json').read_text()):
              pathlib.Path(path).write_bytes((root / 'stage2' / path).read_bytes())
          PY
          set -o pipefail
          cargo test --locked -p frankenengine-engine --no-default-features --test array_from_execution -- --nocapture 2>&1 | tee array-from-validation/stage2-tests.log
      - name: Reexecute migrated private unit assertions without unrelated test modules
        if: always()
        run: |
          test -f array-from-validation/source-blobs.json
          python3 - <<'PY'
          import hashlib, pathlib
          root = pathlib.Path('array-from-validation')
          parent = pathlib.Path('crates/franken-engine/src/baseline_interpreter.rs')
          text = parent.read_text()
          tests = text.split('\nmod tests {\n', 1)[1]
          names = ['test_module', 'test_module_with_functions', 'test_quickjs_config', 'quickjs_test_core', 'bigint_callback_fixture', 'bigint_callback_peak', 'callback_bigints_reserve_cumulative_locals_and_construction_peak_bd_aw8td']
          bodies = []
          for name in names:
              start = tests.index('    fn ' + name + '(')
              opening = tests.index('{', start)
              depth = 1
              end = opening + 1
              while depth:
                  if tests[end] == '{': depth += 1
                  if tests[end] == '}': depth -= 1
                  end += 1
              bodies.append(tests[start:end])
          body = '\n\n'.join(bodies)
          probe = 'use super::*;\nuse crate::ir_contract::{Ir3FunctionDesc, IrHeader, IrLevel, IrSchemaVersion};\n' + body + '\n\npub fn run() { callback_bigints_reserve_cumulative_locals_and_construction_peak_bd_aw8td(); }\n'
          (root / 'private-unit-bodies.rs').write_text(body)
          print('Exact selected unit-body SHA256:', hashlib.sha256(body.encode()).hexdigest())
          pathlib.Path('crates/franken-engine/src/baseline_interpreter/array_from_private_probe.rs').write_text(probe)
          parent.write_text(text + '\npub mod array_from_private_probe;\n')
          example = pathlib.Path('crates/franken-engine/examples/array_from_private_probe.rs')
          example.parent.mkdir(parents=True, exist_ok=True)
          example.write_text('fn main() { frankenengine_engine::baseline_interpreter::array_from_private_probe::run(); println!("Migrated BigInt unit assertions passed"); }\n')
          with pathlib.Path('crates/franken-engine/Cargo.toml').open('a') as file:
              file.write('\n[[example]]\nname = "array_from_private_probe"\npath = "examples/array_from_private_probe.rs"\n')
          PY
          set -o pipefail
          cargo run --locked -p frankenengine-engine --no-default-features --example array_from_private_probe 2>&1 | tee array-from-validation/private-unit.log
      - name: Check Array.from source formatting and strict lint
        if: always()
        run: |
          test -f array-from-validation/source-blobs.json
          cp array-from-validation/stage2/crates/franken-engine/src/baseline_interpreter.rs crates/franken-engine/src/baseline_interpreter.rs
          rustfmt --edition 2024 --check --config skip_children=true crates/franken-engine/src/baseline_interpreter/array_from.rs crates/franken-engine/tests/array_from_execution.rs
          set -o pipefail
          cargo clippy --locked -p frankenengine-engine --no-default-features --test array_from_execution -- -D warnings 2>&1 | tee array-from-validation/clippy.log
      - name: Retain complete Array.from integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: array-from-integration
          path: array-from-validation/
          retention-days: 7

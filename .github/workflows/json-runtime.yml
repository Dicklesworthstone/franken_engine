name: Native JSON Runtime

on:
  push:
    branches: [main]
    paths:
      - 'crates/franken-engine/src/baseline_interpreter*'
      - 'crates/franken-engine/src/baseline_interpreter/**'
      - 'crates/franken-engine/src/lowering_pipeline.rs'
      - 'crates/franken-engine/src/capability.rs'
      - 'crates/franken-engine/src/parser.rs'
      - 'crates/franken-engine/tests/json_*'
      - 'crates/franken-engine/tests/js_string_integration.rs'
      - '.github/workflows/json-runtime.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  json:
    strategy:
      fail-fast: false
      matrix:
        mode: [runtime-tests, full-engine-check]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Retain exact committed JSON sources
        run: |
          mkdir -p json-validation
          git rev-parse HEAD > json-validation/revision.txt
          python3 - <<'PY'
          import hashlib, json, pathlib
          paths = [
              'crates/franken-engine/src/baseline_interpreter.rs',
              'crates/franken-engine/src/baseline_interpreter/json_parse.rs',
              'crates/franken-engine/src/baseline_interpreter/json_stringify.rs',
              'crates/franken-engine/tests/js_string_integration.rs',
              'crates/franken-engine/tests/json_parse_execution.rs',
              'crates/franken-engine/tests/json_stringify_execution.rs',
              'crates/franken-engine/src/lowering_pipeline.rs',
              'crates/franken-engine/src/capability.rs',
              'crates/franken-engine/src/parser.rs',
          ]
          root = pathlib.Path('json-validation')
          (root / 'paths.json').write_text(json.dumps(paths))
          hashes = {}
          for path in paths:
              data = pathlib.Path(path).read_bytes()
              hashes[path] = hashlib.sha1(('blob ' + str(len(data)) + '\0').encode() + data).hexdigest()
              dest = root / 'source' / path
              dest.parent.mkdir(parents=True, exist_ok=True)
              dest.write_bytes(data)
          (root / 'source-hashes.json').write_text(json.dumps(hashes, indent=2))
          PY
      - name: Install Rust
        run: rustup toolchain install nightly --profile minimal --component rustfmt --component clippy
      - name: Check committed JSON module formatting
        run: |
          rustfmt +nightly --edition 2024 --check --config skip_children=true crates/franken-engine/src/baseline_interpreter/json_parse.rs crates/franken-engine/src/baseline_interpreter/json_stringify.rs crates/franken-engine/tests/json_parse_execution.rs crates/franken-engine/tests/json_stringify_execution.rs
      - name: Check complete native engine library
        if: matrix.mode == 'full-engine-check'
        run: |
          set -o pipefail
          cargo +nightly check --locked -p frankenengine-engine --no-default-features --lib 2>&1 | tee json-validation/full-engine-check.log
      - name: Select existing production runtime dependency closure
        if: matrix.mode == 'runtime-tests'
        run: |
          python3 - <<'PY'
          import pathlib, subprocess, textwrap
          text = pathlib.Path('.github/workflows/native-runtime.yml').read_text()
          step = text.split('      - name: Select native runtime dependency closure\n', 1)[1].split('\n      - name:', 1)[0]
          subprocess.run(['bash', '-e', '-c', textwrap.dedent(step.split('        run: |\n', 1)[1])], check=True)
          pathlib.Path('json-validation/runtime-modules.txt').write_bytes(pathlib.Path('async-generator-validation/runtime-modules.txt').read_bytes())
          PY
      - name: Run JSON and UTF-16 execution regressions
        if: matrix.mode == 'runtime-tests'
        run: |
          set -o pipefail
          cargo +nightly test --locked -p frankenengine-engine --no-default-features --no-fail-fast --test json_parse_execution --test json_stringify_execution --test js_string_integration -- --nocapture 2>&1 | tee json-validation/source-tests.log
      - name: Check full-engine strict lint
        if: matrix.mode == 'full-engine-check'
        run: |
          set -o pipefail
          cargo +nightly clippy --locked -p frankenengine-engine --no-default-features --lib -- -D warnings 2>&1 | tee json-validation/full-engine-clippy.log
      - name: Retain complete validation output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: json-validation-${{ matrix.mode }}
          path: json-validation/
          retention-days: 7
  array-from-integration:
    if: contains(github.event.head_commit.message, '[array-from-rebase]')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    permissions:
      contents: write
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Integrate exact reviewed sources without changing a ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p array-from-validation
          git rev-parse HEAD > array-from-validation/revision.txt
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, urllib.request
          root = pathlib.Path('array-from-validation')
          paths = [
              'crates/franken-engine/src/baseline_interpreter.rs',
              'crates/franken-engine/src/baseline_interpreter/array_from.rs',
              'crates/franken-engine/tests/array_from_execution.rs',
          ]
          api = f'https://api.github.com/repos/{os.environ["GITHUB_REPOSITORY"]}/git/blobs'
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                     'User-Agent': 'OpenAI File Downloader, XaiImageApiFetch/1.0',
                     'Content-Type': 'application/json'}
          def identity(data):
              return hashlib.sha1(f'blob {len(data)}\0'.encode() + data).hexdigest()
          def blob(sha):
              request = urllib.request.Request(api + '/' + sha, headers=headers)
              with urllib.request.urlopen(request, timeout=60) as response:
                  data = base64.b64decode(json.load(response)['content'])
              assert identity(data) == sha
              return data
          parent = pathlib.Path(paths[0])
          original = parent.read_bytes()
          assert identity(original) == '66e931228bbe203f7b2413599e82e2869da91291', 'parent changed; rebase required'
          (root / 'original-baseline.rs').write_bytes(original)
          prepared = blob('d9c82cd0e8653e03cd113a1a17858bc56399e308').decode()
          text = original.decode()
          assert text.count('mod async_generator;') == 1 and 'mod array_from;' not in text
          text = text.replace('mod async_generator;', 'mod array_from;\nmod async_generator;', 1)
          start = text.index('    fn invoke_simple_array_from_callback(')
          end = text.index('\n    fn invoke_inline_method_call(', start)
          assert hashlib.sha256(text[start:end].encode()).hexdigest() == 'ea02f94c143f32ef373790266ab42fb81408b7ff93877f14a3c21af2842e7be2'
          text = text[:start-1] + text[end:]
          start = text.index('            "builtin:ArrayFrom" =>')
          end = text.index('\n            "builtin:', start + 30)
          assert hashlib.sha256(text[start:end].encode()).hexdigest() == 'c511bd82dd43c0fa23c17a64dfc83062c1d472bb83e76617b17b49f0292f0b11'
          text = text[:start] + '            "builtin:ArrayFrom" => self.array_from_builtin(module, args),\n' + text[end:]
          needle = '    fn callback_bigints_reserve_cumulative_locals_and_construction_peak_bd_aw8td()'
          start = text.index(needle)
          end = text.index('\n    #[test]', start)
          assert hashlib.sha256(text[start:end].encode()).hexdigest() == '60701bfbea65e36d87140e704af0cd8aab957d3aa32d65e699ffd32dbd6f9f82'
          replacement_start = prepared.index(needle)
          replacement_end = prepared.index('\n    #[test]', replacement_start)
          text = text[:start] + prepared[replacement_start:replacement_end] + text[end:]
          assert 'invoke_simple_array_from_callback' not in text and 'apply_array_from_map_fn' not in text
          data = text.encode()
          assert identity(data) == 'da2d7d8bea3eff8b87ba4ba729170dd62f46ef67'
          parent.write_bytes(data)
          entries = {
              paths[0]: identity(data),
              paths[1]: '6ed58ea7a66f87be8ec5e549ac91c8b4aeb0d824',
              paths[2]: '2db55cecf7e6bb1e53efd95bc70c0ffb4da1aec2',
          }
          for path in paths[1:]:
              target = pathlib.Path(path)
              assert not target.exists(), 'do not replace concurrent implementation'
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(blob(entries[path]))
          request = urllib.request.Request(api,
              data=json.dumps({'content': base64.b64encode(data).decode(), 'encoding': 'base64'}).encode(),
              headers=headers, method='POST')
          with urllib.request.urlopen(request, timeout=60) as response:
              assert json.load(response)['sha'] == entries[paths[0]]
          for path in paths:
              dest = root / 'source' / path
              dest.parent.mkdir(parents=True, exist_ok=True)
              dest.write_bytes(pathlib.Path(path).read_bytes())
          output = {'base': (root / 'revision.txt').read_text().strip(), 'entries': entries}
          (root / 'source-blobs.json').write_text(json.dumps(output, indent=2))
          print(json.dumps(output, indent=2), flush=True)
          PY
          git diff --check
      - name: Install pinned Rust
        run: |
          toolchain=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy
          echo "RUSTUP_TOOLCHAIN=$toolchain" >> "$GITHUB_ENV"
      - name: Check prepared source formatting
        run: |
          rustfmt --edition 2024 --check --config skip_children=true crates/franken-engine/src/baseline_interpreter/array_from.rs crates/franken-engine/tests/array_from_execution.rs
      - name: Retain exact prepared source identities
        uses: actions/upload-artifact@v4
        with:
          name: array-from-rebased-sources
          path: array-from-validation/
          retention-days: 7
      - name: Select existing native runtime dependency closure
        run: |
          python3 - <<'PY'
          import pathlib, subprocess, textwrap
          text = pathlib.Path('.github/workflows/native-runtime.yml').read_text()
          step = text.split('      - name: Select native runtime dependency closure\n', 1)[1].split('\n      - name:', 1)[0]
          subprocess.run(['bash', '-e', '-c', textwrap.dedent(step.split('        run: |\n', 1)[1])], check=True)
          PY
      - name: Run all Array.from source and containment regressions
        run: |
          set -o pipefail
          cargo test --locked -p frankenengine-engine --no-default-features --test array_from_execution -- --nocapture 2>&1 | tee array-from-validation/array-from-tests.log
      - name: Run surrounding JSON and UTF-16 regressions
        if: always()
        run: |
          test -f array-from-validation/source-blobs.json
          set -o pipefail
          cargo test --locked -p frankenengine-engine --no-default-features --no-fail-fast --test json_parse_execution --test json_stringify_execution --test js_string_integration -- --nocapture 2>&1 | tee array-from-validation/surrounding-tests.log
      - name: Check strict runtime lint
        if: always()
        run: |
          test -f array-from-validation/source-blobs.json
          set -o pipefail
          cargo clippy --locked -p frankenengine-engine --no-default-features --lib --test array_from_execution -- -D warnings 2>&1 | tee array-from-validation/clippy.log
      - name: Retain validation output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: array-from-rebased-validation
          path: array-from-validation/
          retention-days: 7

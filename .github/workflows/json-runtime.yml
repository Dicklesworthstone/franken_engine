name: Native JSON Runtime

on:
  push:
    branches: [main]
    paths:
      - 'crates/franken-engine/src/baseline_interpreter*'
      - 'crates/franken-engine/src/baseline_interpreter/**'
      - 'crates/franken-engine/src/lowering_pipeline.rs'
      - 'crates/franken-engine/tests/json_*'
      - 'crates/franken-engine/tests/js_string_integration.rs'
      - '.github/workflows/json-runtime.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  json:
    strategy:
      fail-fast: false
      matrix:
        mode: [runtime-tests, full-engine-check]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # One-time candidate transport. Only immutable blobs are written; main
      # is advanced by the connector after inspecting the validation results.
      - name: Materialize exact JSON candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p json-validation
          git rev-parse HEAD > json-validation/revision.txt
          python3 - <<'PY'
          import base64, gzip, hashlib, json, os, pathlib, subprocess, urllib.request
          root = pathlib.Path('json-validation')
          files = {
              'crates/franken-engine/src/baseline_interpreter.rs': 'd7b998f6319ceeb2d8d6dfa0fa4c750acf77d3bc',
              'crates/franken-engine/src/baseline_interpreter/json_parse.rs': '44b68afb447a57a356e2fd5d8a12c1c7b823e46b',
              'crates/franken-engine/tests/js_string_integration.rs': 'ab76255200a4771563b4607addc743fbfdc8fced',
              'crates/franken-engine/tests/json_parse_execution.rs': '267a3daf74a74e70e9cf50e396d29682d65483b7',
          }
          def blob(sha):
              req = urllib.request.Request('https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY'] + '/git/blobs/' + sha, headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json',
                  'User-Agent': 'OpenAI File Downloader, XaiImageApiFetch/1.0',
              })
              with urllib.request.urlopen(req, timeout=60) as response:
                  content = base64.b64decode(json.load(response)['content'])
              assert hashlib.sha1(('blob ' + str(len(content)) + '\0').encode() + content).hexdigest() == sha
              return content
          if not pathlib.Path('crates/franken-engine/src/baseline_interpreter/json_parse.rs').exists():
              for path, expected in {
                  'crates/franken-engine/src/baseline_interpreter.rs': '210386e53da790764e1075d17c19f18930ebc917',
                  'crates/franken-engine/src/lowering_pipeline.rs': '10aea81b8e465ec3bc9bad8cdcbaa84596974b9b',
              }.items():
                  actual = subprocess.check_output(['git', 'rev-parse', 'HEAD:' + path], text=True).strip()
                  assert actual == expected, path + ' changed; review required'
              for path, sha in files.items():
                  file = pathlib.Path(path)
                  file.parent.mkdir(parents=True, exist_ok=True)
                  file.write_bytes(blob(sha))
              path = pathlib.Path('crates/franken-engine/src/baseline_interpreter/json_parse.rs')
              text = path.read_text()
              for name in ['json_parse_builtin', 'json_charge_work', 'json_store_parsed_property']:
                  before = '    fn ' + name + '('
                  assert text.count(before) == 1
                  text = text.replace(before, '    pub(super) fn ' + name + '(', 1)
              path.write_text(text)
              raw = blob('40c34f0ed83786a56f7ebfb2cbcc7625dcb43bf6')
              assert hashlib.sha256(raw).hexdigest() == 'a74f7f372137e62c9901eeb4d80438a729f90fdba4e6cba2158946fda5063f3f'
              patch = root / 'intrinsic.patch'
              patch.write_bytes(gzip.decompress(raw))
              subprocess.run(['git', 'apply', '--check', str(patch)], check=True)
              subprocess.run(['git', 'apply', str(patch)], check=True)
          paths = list(files) + ['crates/franken-engine/src/lowering_pipeline.rs']
          (root / 'paths.json').write_text(json.dumps(paths))
          PY
      - name: Install Rust and format candidate
        run: |
          rustup toolchain install nightly --profile minimal --component rustfmt --component clippy
          python3 - <<'PY'
          import json, pathlib, subprocess
          paths = json.loads(pathlib.Path('json-validation/paths.json').read_text())
          subprocess.run(['rustfmt', '+nightly', '--edition', '2024', '--config', 'skip_children=true'] + paths, check=True)
          PY
      - name: Check complete native engine library
        if: matrix.mode == 'full-engine-check'
        run: |
          set -o pipefail
          cargo +nightly check --locked -p frankenengine-engine --no-default-features --lib 2>&1 | tee json-validation/full-engine-check.log
      - name: Select existing production runtime dependency closure
        if: matrix.mode == 'runtime-tests'
        run: |
          python3 - <<'PY'
          import pathlib, subprocess, textwrap
          # Reuse the existing native-runtime.yml target selection verbatim.
          # This does not substitute implementations or weaken the full check.
          text = pathlib.Path('.github/workflows/native-runtime.yml').read_text()
          step = text.split('      - name: Select native runtime dependency closure\n', 1)[1].split('\n      - name:', 1)[0]
          script = textwrap.dedent(step.split('        run: |\n', 1)[1])
          subprocess.run(['bash', '-e', '-c', script], check=True)
          pathlib.Path('json-validation/runtime-modules.txt').write_bytes(pathlib.Path('async-generator-validation/runtime-modules.txt').read_bytes())
          PY
      - name: Run JSON and UTF-16 source execution regressions
        if: matrix.mode == 'runtime-tests'
        run: |
          set -o pipefail
          cargo +nightly test --locked -p frankenengine-engine --no-default-features --no-fail-fast --test json_parse_execution --test js_string_integration -- --nocapture 2>&1 | tee json-validation/source-tests.log
      - name: Save exact candidate blobs without moving refs
        if: always() && matrix.mode == 'runtime-tests'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, urllib.request
          root = pathlib.Path('json-validation')
          result = {'base_commit': os.environ['GITHUB_SHA'], 'files': []}
          for path in json.loads((root / 'paths.json').read_text()):
              file = pathlib.Path(path)
              assert file.is_file() and not file.is_symlink()
              content = file.read_bytes()
              body = json.dumps({'content': base64.b64encode(content).decode(), 'encoding': 'base64'}).encode()
              req = urllib.request.Request('https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY'] + '/git/blobs', data=body, headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json',
                  'Content-Type': 'application/json',
                  'User-Agent': 'OpenAI File Downloader, XaiImageApiFetch/1.0',
              })
              with urllib.request.urlopen(req, timeout=60) as response:
                  sha = json.load(response)['sha']
              assert sha == hashlib.sha1(('blob ' + str(len(content)) + '\0').encode() + content).hexdigest()
              result['files'].append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': sha})
              dest = root / 'source' / path
              dest.parent.mkdir(parents=True, exist_ok=True)
              dest.write_bytes(content)
          (root / 'result.json').write_text(json.dumps(result, indent=2))
          PY
      - name: Retain complete validation output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: json-validation-${{ matrix.mode }}
          path: json-validation/
          retention-days: 7

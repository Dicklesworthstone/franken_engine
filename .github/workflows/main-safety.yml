name: Main Safety

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: main-safety-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-contracts:
    name: agent routes and receipt-bound comparator
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile Python contract tools
        run: |
          python3 -m py_compile scripts/agent_route.py
          python3 -m py_compile scripts/red_team_compromise_rate_metric.py
          python3 -m py_compile scripts/red_team_trial_common.py
          python3 -m py_compile scripts/red_team_trial_reader.py
          python3 -m py_compile scripts/aggregate_red_team_trials.py

      - name: Validate architectural change routing
        run: bash scripts/e2e/agent_change_route_smoke.sh

      - name: Execute comparator positive and ambiguity drills
        run: bash scripts/e2e/red_team_compromise_rate_metric_comparator_smoke.sh

      - name: Execute repeated-trial aggregation and tamper drills
        run: bash scripts/e2e/red_team_repeated_trial_harness_smoke.sh

  live-scope-validation:
    name: Live work-scope execution regressions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b75fa2255bce342cdffbb6d421e3de392fa1a459
          persist-credentials: false
      - name: Apply exact reviewed native patch
        run: |
          mkdir -p scope-validation
          python3 - <<'PY'
          import base64, hashlib, pathlib, subprocess, zlib
          encoded = ''
          patch = zlib.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(patch).hexdigest() == '9e95b98a15be59e54d60b20289a0bfbf58be51391c75f412539db113cb3eae7f'
          pathlib.Path('scope-validation/source.patch').write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', 'scope-validation/source.patch'], check=True)
          subprocess.run(['git', 'apply', 'scope-validation/source.patch'], check=True)
          PY
      - name: Export exact source blobs without moving any ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, pathlib, subprocess
          expected = {'crates/franken-core/src/execution_orchestrator.rs':'4c231d0e398e06eddc1428bf900ccbdbb1b9a365','crates/franken-core/src/execution_work_budget.rs':'28a154c791585a29dea64da09ba2b79ebf54d742','crates/franken-core/src/execution_work_budget/revocation.rs':'e66730d1148a1afe9a0cc1f0da7f42f28b87bc55','crates/franken-core/tests/orchestrator_execution_budgets.rs':'5a6e6045677971b8dd9f97e34e1a4c7edd1f456b'}
          for path, sha in expected.items():
              assert subprocess.check_output(['git','hash-object',path], text=True).strip() == sha
              body = json.dumps({'content':pathlib.Path(path).read_text(),'encoding':'utf-8'})
              reply = subprocess.check_output(['gh','api','repos/Dicklesworthstone/franken_engine/git/blobs','--method','POST','-H','User-Agent: OpenAI File Downloader, XaiImageApiFetch/1.0','--input','-'],input=body,text=True)
              assert json.loads(reply)['sha'] == sha
              print('SOURCE_BLOB', path, sha, flush=True)
          pathlib.Path('scope-validation/blobs.json').write_text(json.dumps(expected,indent=2))
          PY
      - name: Install Rust
        run: rustup toolchain install nightly --profile minimal --component clippy --component rustfmt
      - name: Test real native dispatch and shared-scope semantics
        run: |
          set -o pipefail
          cargo +nightly test --locked -p frankenengine-core --lib execution_work_budget -- --nocapture 2>&1 | tee scope-validation/work-pool.log
          cargo +nightly test --locked -p frankenengine-core --lib ordinary_lane_router_observes_revocation -- --nocapture 2>&1 | tee scope-validation/native-revocation.log
          cargo +nightly test --locked -p frankenengine-core --test orchestrator_execution_budgets -- --nocapture 2>&1 | tee scope-validation/public-orchestrator.log
      - name: Retain exact patch and full test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-scope-validation
          path: scope-validation/
          retention-days: 7

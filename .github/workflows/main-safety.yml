          import json, pathlib, subprocess
          deps = pathlib.Path('target/debug/deps')
          artifacts = {}
          for line in pathlib.Path('scope-validation/build-artifacts.jsonl').read_text().splitlines():
              record = json.loads(line)
              if record.get('reason') == 'compiler-artifact':
                  for name in record['filenames']:
                      if name.endswith('.rlib'):
                          artifacts[record['target']['name']] = name
          def run_test(source, output, names):
              command = ['rustup','run','nightly','rustc','--edition=2024','--test',source,'-C','debuginfo=0','-L','dependency='+str(deps),'-o',output]
              for name in names:
                  library = artifacts.get(name)
                  if library is None:
                      found = list(deps.glob('lib'+name+'-*.rlib'))
                      assert len(found) == 1, (name, found)
                      library = str(found[0])
                  command += ['--extern',name+'='+library]
              subprocess.run(command,check=True)
              subprocess.run([output,'--nocapture'],check=True)

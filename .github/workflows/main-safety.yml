name: Main Safety

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: scope-validation-${{ github.sha }}
  cancel-in-progress: false

jobs:
  fast-contracts:
    name: agent routes and receipt-bound comparator
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Compile Python contract tools
        run: |
          python3 -m py_compile scripts/agent_route.py
          python3 -m py_compile scripts/red_team_compromise_rate_metric.py
          python3 -m py_compile scripts/red_team_trial_common.py
          python3 -m py_compile scripts/red_team_trial_reader.py
          python3 -m py_compile scripts/aggregate_red_team_trials.py
      - name: Validate architectural change routing
        run: bash scripts/e2e/agent_change_route_smoke.sh
      - name: Execute comparator positive and ambiguity drills
        run: bash scripts/e2e/red_team_compromise_rate_metric_comparator_smoke.sh
      - name: Execute repeated-trial aggregation and tamper drills
        run: bash scripts/e2e/red_team_repeated_trial_harness_smoke.sh

  live-scope-validation:
    name: Core and engine live work-scope regressions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b75fa2255bce342cdffbb6d421e3de392fa1a459
          persist-credentials: false
      - name: Retrieve previously checksum-verified source blobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p scope-validation
          python3 - <<'PY'
          import base64, json, pathlib, subprocess
          blobs = {'crates/franken-core/src/execution_orchestrator.rs':'4c231d0e398e06eddc1428bf900ccbdbb1b9a365','crates/franken-core/src/execution_work_budget.rs':'28a154c791585a29dea64da09ba2b79ebf54d742','crates/franken-core/src/execution_work_budget/revocation.rs':'e66730d1148a1afe9a0cc1f0da7f42f28b87bc55','crates/franken-core/tests/orchestrator_execution_budgets.rs':'5a6e6045677971b8dd9f97e34e1a4c7edd1f456b'}
          for path, sha in blobs.items():
              reply = json.loads(subprocess.check_output(['gh','api','repos/Dicklesworthstone/franken_engine/git/blobs/'+sha,'-H','User-Agent: OpenAI File Downloader, XaiImageApiFetch/1.0'],text=True))
              assert reply['encoding'] == 'base64'
              pathlib.Path(path).write_bytes(base64.b64decode(reply['content']))
              assert subprocess.check_output(['git','hash-object',path],text=True).strip() == sha
          PY

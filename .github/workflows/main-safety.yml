name: Main Safety

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: main-safety-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-contracts:
    name: agent routes and receipt-bound comparator
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile Python contract tools
        run: |
          python3 -m py_compile scripts/agent_route.py
          python3 -m py_compile scripts/red_team_compromise_rate_metric.py
          python3 -m py_compile scripts/red_team_trial_common.py
          python3 -m py_compile scripts/red_team_trial_reader.py
          python3 -m py_compile scripts/aggregate_red_team_trials.py

      - name: Validate architectural change routing
        run: bash scripts/e2e/agent_change_route_smoke.sh

      - name: Execute comparator positive and ambiguity drills
        run: bash scripts/e2e/red_team_compromise_rate_metric_comparator_smoke.sh

      - name: Execute repeated-trial aggregation and tamper drills
        run: bash scripts/e2e/red_team_repeated_trial_harness_smoke.sh

  runtime-source-snapshot:
    if: contains(github.event.head_commit.message, 'source snapshot')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Preserve exact runtime sources for targeted repair
        run: |
          set -euo pipefail
          git rev-parse HEAD > "$RUNNER_TEMP/source-revision.txt"
          git archive --format=tar.gz --output="$RUNNER_TEMP/runtime-source.tar.gz" HEAD \
            AGENTS.md README.md CHANGELOG.md Cargo.toml Cargo.lock .cargo .beads \
            crates/franken-core crates/franken-engine/Cargo.toml \
            crates/franken-engine/src crates/franken-engine/tests \
            .github/workflows docs scripts/agent_bead_ops.py
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-source-snapshot
          path: |
            ${{ runner.temp }}/source-revision.txt
            ${{ runner.temp }}/runtime-source.tar.gz
          retention-days: 3
          if-no-files-found: error

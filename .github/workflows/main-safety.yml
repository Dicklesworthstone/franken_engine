          expected = {'crates/franken-core/src/execution_orchestrator.rs':'4c231d0e398e06eddc1428bf900ccbdbb1b9a365','crates/franken-core/src/execution_work_budget.rs':'28a154c791585a29dea64da09ba2b79ebf54d742','crates/franken-core/src/execution_work_budget/revocation.rs':'e66730d1148a1afe9a0cc1f0da7f42f28b87bc55','crates/franken-core/tests/orchestrator_execution_budgets.rs':'5a6e6045677971b8dd9f97e34e1a4c7edd1f456b'}

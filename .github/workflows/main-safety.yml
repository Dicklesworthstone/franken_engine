          +                &LoweringContext::new("revocation", "revocation", "revocation"),
          +            )
          +            .unwrap()
          +            .ir3;
          +            let _admission = tenant.reserve(100_000).unwrap();
          +            let mut router = orchestrator.lane_router_for_execution(&package, &ir3).unwrap();
          +            let hook = Arc::new(RevokeOnAllocation {
          +                root,
          +                calls: AtomicUsize::new(0),
          +            });
          +            let result = router.execute_with_hook(
          +                &ir3,
          +                "live-revocation",
          +                Some(lane),
          +                Some(hook.clone()),
          +            );
          +            assert!(matches!(result, Err(InterpreterError::Cancelled)), "{result:?}");
          +            assert!(hook.calls.load(Ordering::Relaxed) > 0);
          +            assert_eq!(tenant.remaining(), 100_000);
          +        }
          +    }
          +
               fn simple_package() -> ExtensionPackage {
                   ExtensionPackage {
                       extension_id: "test-ext-1".to_string(),
          diff --git a/crates/franken-core/src/execution_work_budget.rs b/crates/franken-core/src/execution_work_budget.rs
          index 4727908..28a154c 100644
          --- a/crates/franken-core/src/execution_work_budget.rs
          +++ b/crates/franken-core/src/execution_work_budget.rs
          @@ -27,7 +27,7 @@ use crate::ir_contract::Ir3Module;
           
           mod revocation;
           mod scheduling;
          -pub use revocation::MAX_WORK_POOL_DEPTH;
          +pub use revocation::{MAX_WORK_POOL_DEPTH, WorkScopeRevocation};
           pub use scheduling::ExecutionAdmission;
           
           #[derive(Debug)]
          diff --git a/crates/franken-core/src/execution_work_budget/revocation.rs b/crates/franken-core/src/execution_work_budget/revocation.rs
          index 55300f8..e66730d 100644
          --- a/crates/franken-core/src/execution_work_budget/revocation.rs
          +++ b/crates/franken-core/src/execution_work_budget/revocation.rs
          @@ -11,7 +11,40 @@ use crate::checkpoint::CancellationToken;
           /// This bounds the pool-owned part of checkpoint polling and retained signals.
           pub const MAX_WORK_POOL_DEPTH: usize = 64;
           
          +/// Read-only, live cancellation of a work scope and its ancestors.
          +///
          +/// This is not an admission or a capability grant. It lets other runtime
          +/// consumers observe the same irreversible signal without gaining access to
          +/// `CancellationToken::reset` or the ability to cancel a parent or sibling.
          +/// It deliberately cannot be serialized: a snapshot is not a live binding.
          +#[derive(Debug, Clone)]
          +pub struct WorkScopeRevocation {
          +    scope: CancellationToken,
          +}
          +
          +impl WorkScopeRevocation {
          +    pub fn is_revoked(&self) -> bool {
          +        self.scope.is_cancelled()
          +    }
          +}
          +
           impl ExecutionWorkPool {
          +    /// Observe revocation without granting execution or mutable token access.
          +    /// The signal remains live even after the pool and its other owners drop.
          +    pub fn revocation_signal(&self) -> WorkScopeRevocation {
          +        WorkScopeRevocation {
          +            scope: self.state.cancellation.clone(),
          +        }
          +    }
          +
          +    /// The ordinary core orchestrator has already charged its selected lane.
          +    /// Bind that run to the pool without charging again or replacing any
          +    /// caller cancellation. The engine crate uses the read-only signal above
          +    /// at its execution-cell authority boundary instead.
          +    pub(crate) fn bind_interpreter_cancellation(&self, config: &mut InterpreterConfig) {
          +        bind_cancellation(&self.state.cancellation, config);
          +    }

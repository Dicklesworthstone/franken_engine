name: Main Safety

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: main-safety-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  fast-contracts:
    name: agent routes and receipt-bound comparator
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile Python contract tools
        run: |
          python3 -m py_compile scripts/agent_route.py
          python3 -m py_compile scripts/red_team_compromise_rate_metric.py
          python3 -m py_compile scripts/red_team_trial_common.py
          python3 -m py_compile scripts/red_team_trial_reader.py
          python3 -m py_compile scripts/aggregate_red_team_trials.py

      - name: Validate architectural change routing
        run: bash scripts/e2e/agent_change_route_smoke.sh

      - name: Execute comparator positive and ambiguity drills
        run: bash scripts/e2e/red_team_compromise_rate_metric_comparator_smoke.sh

      - name: Execute repeated-trial aggregation and tamper drills
        run: bash scripts/e2e/red_team_repeated_trial_harness_smoke.sh

  promise-runtime-repair:
    if: "startsWith(github.event.head_commit.message, 'fix(runtime): apply scoped Promise IFC repair')"
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
      - name: Apply the reviewed runtime patch and publish the code plus tests
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git ls-remote origin refs/heads/main | cut -f1)" == "$GITHUB_SHA" ]]
          [[ "$(git rev-parse HEAD:crates/franken-engine/src/promise_model.rs)" == '67c4e89f6ba3a7b75304f8c8b21a6b5ebf5b9831' ]]
          [[ "$(git rev-parse HEAD:crates/franken-engine/tests/promise_reaction_label_conformance.rs)" == 'c449c005c8668b88a88ccbb9f2663b12ed81511d' ]]
          cat > "$RUNNER_TEMP/promise-ifc.patch" <<'PATCH'
          diff --git a/crates/franken-engine/src/promise_model.rs b/crates/franken-engine/src/promise_model.rs
          --- a/crates/franken-engine/src/promise_model.rs
          +++ b/crates/franken-engine/src/promise_model.rs
          @@ -518,6 +518,7 @@
                   let record = self.get(handle)?;
                   let mut next_store_bytes = self.projected_create_memory_bytes();
                   let mut next_queue_bytes = queue.estimated_memory_bytes();
          +        let effective_label = std::cmp::max(label, &record.label);
                   match &record.state {
                       PromiseState::Pending => {
                           next_store_bytes = next_store_bytes
          @@ -531,13 +532,13 @@
                       PromiseState::Fulfilled(value) => {
                           next_queue_bytes = queue.projected_enqueue_payload_memory_bytes(
                               estimate_js_value_memory_bytes(value),
          -                    estimate_label_memory_bytes(label),
          +                    estimate_label_memory_bytes(effective_label),
                           );
                       }
                       PromiseState::Rejected(reason) => {
                           next_queue_bytes = queue.projected_enqueue_payload_memory_bytes(
                               estimate_js_value_memory_bytes(reason),
          -                    estimate_label_memory_bytes(label),
          +                    estimate_label_memory_bytes(effective_label),
                           );
                       }
                   }
          @@ -607,11 +608,11 @@
                       .reactions
                       .iter()
                       .filter(|reaction| reaction.kind == selected_kind)
          -            .fold(queue.estimated_memory_bytes(), |bytes, _| {
          +            .fold(queue.estimated_memory_bytes(), |bytes, reaction| {
                           bytes
                               .saturating_add(std::mem::size_of::<Option<Microtask>>() as u64)
                               .saturating_add(payload_bytes)
          -                    .saturating_add(label_bytes)
          +                    .saturating_add(estimate_label_memory_bytes(std::cmp::max(
          +                        &reaction.label,
          +                        label,
          +                    )))
                               .saturating_add(2u64.saturating_mul(std::mem::size_of::<WitnessEvent>() as u64))
                       });
                   Ok((next_store_bytes, next_queue_bytes))
          @@ -742,7 +743,7 @@
                               handler: reaction.handler,
                               argument: value.clone(),
                               result_promise: reaction.result_promise,
          -                    label: label.clone(),
          +                    label: reaction.label.join(&label),
                           });
                       }
                   }
          @@ -782,17 +783,18 @@
                   // Enqueue only the reject reactions for a rejected promise.
                   for reaction in reactions {
                       if reaction.kind == ReactionKind::Reject {
          +                let effective_label = reaction.label.join(&label);
                           if reaction.handler.is_some() {
                               queue.enqueue(Microtask::PromiseReaction {
                                   handler: reaction.handler,
                                   argument: reason.clone(),
                                   result_promise: reaction.result_promise,
          -                        label: label.clone(),
          +                        label: effective_label,
                               });
                           } else {
                               queue.enqueue(Microtask::PromiseRejection {
                                   reason: reason.clone(),
                                   result_promise: reaction.result_promise,
          -                        label: label.clone(),
          +                        label: effective_label,
                               });
                           }
                       }
          @@ -920,6 +922,7 @@
               ) -> Result<PromiseHandle, PromiseError> {
                   let record = self.get(handle)?;
                   let state = record.state.clone();
          +        let effective_label = label.join(&record.label);
                   let result_promise = self.create();
           
                   match state {
          @@ -945,7 +948,7 @@
                               handler: on_fulfilled,
                               argument: value,
                               result_promise,
          -                    label,
          +                    label: effective_label,
                           });
                       }
                       PromiseState::Rejected(reason) => {
          @@ -954,13 +957,13 @@
                                   handler: on_rejected,
                                   argument: reason,
                                   result_promise,
          -                        label,
          +                        label: effective_label,
                               });
                           } else {
                               queue.enqueue(Microtask::PromiseRejection {
                                   reason,
                                   result_promise,
          -                        label,
          +                        label: effective_label,
                               });
                           }
                       }
          @@ -1045,7 +1048,9 @@
                   label: Label,
                   queue: &mut MicrotaskQueue,
               ) -> Result<PromiseHandle, PromiseError> {
          -        let state = self.get(handle)?.state.clone();
          +        let record = self.get(handle)?;
          +        let state = record.state.clone();
          +        let effective_label = label.join(&record.label);
                   let result_promise = self.create();
           
                   match state {
          @@ -1070,7 +1075,7 @@
                               handler: None,
                               argument: value,
                               result_promise,
          -                    label,
          +                    label: effective_label,
                           });
                       }
                       PromiseState::Rejected(reason) => {
          @@ -1078,7 +1083,7 @@
                           queue.enqueue(Microtask::PromiseRejection {
                               reason,
                               result_promise,
          -                    label,
          +                    label: effective_label,
                           });
                       }
                   }
          @@ -1151,6 +1151,112 @@
           impl Default for PromiseStore {
               fn default() -> Self {
                   Self::new()
               }
           }
           
          +#[cfg(test)]
          +mod reaction_label_memory_tests {
          +    use super::*;
          +
          +    fn labels() -> Vec<Label> {
          +        let mut labels = Label::all_builtin().to_vec();
          +        labels.extend([
          +            Label::Custom { name: "alpha-with-longer-storage".into(), level: 3 },
          +            Label::Custom { name: "z".into(), level: 3 },
          +            Label::Custom { name: "higher-than-builtins".into(), level: 7 },
          +        ]);
          +        labels
          +    }
          +
          +    #[test]
          +    fn joined_label_memory_uses_the_canonical_order_without_cloning() {
          +        for left in labels() {
          +            for right in labels() {
          +                assert_eq!(
          +                    estimate_label_memory_bytes(std::cmp::max(&left, &right)),
          +                    estimate_label_memory_bytes(&left.join(&right)),
          +                );
          +            }
          +        }
          +    }
          +
          +    #[test]
          +    fn settlement_projection_matches_retained_joined_reaction_labels() {
          +        for context in labels() {
          +            for settlement in labels() {
          +                for rejected in [false, true] {
          +                    let mut store = PromiseStore::new();
          +                    let mut queue = MicrotaskQueue::new();
          +                    let source = store.create();
          +                    store.then(source, Some(ClosureHandle(7)), Some(ClosureHandle(8)), context.clone(), &mut queue).unwrap();
          +                    store.then(source, None, None, Label::Public, &mut queue).unwrap();
          +                    store.then_for_await(source, context.clone(), &mut queue).unwrap();
          +                    let target = store.create();
          +                    store.register_native_adoption(source, target, context.clone()).unwrap();
          +                    let before = (serde_json::to_value(&store).unwrap(), serde_json::to_value(&queue).unwrap());
          +                    let payload = JsValue::Int(42);
          +                    let projected = if rejected {
          +                        store.projected_reject_memory_bytes(source, &payload, &settlement, &queue)
          +                    } else {
          +                        store.projected_fulfill_memory_bytes(source, &payload, &settlement, &queue)
          +                    }.unwrap();
          +                    assert_eq!(before, (serde_json::to_value(&store).unwrap(), serde_json::to_value(&queue).unwrap()));
          +                    if rejected {
          +                        store.reject(source, payload, settlement.clone(), &mut queue)
          +                    } else {
          +                        store.fulfill(source, payload, settlement.clone(), &mut queue)
          +                    }.unwrap();
          +                    assert_eq!(projected, (store.estimated_memory_bytes(), queue.estimated_memory_bytes()), "context={context:?}, settlement={settlement:?}, rejected={rejected}");
          +                }
          +            }
          +        }
          +    }
          +
          +    #[test]
          +    fn settled_registration_projection_matches_then_and_await() {
          +        for context in labels() {
          +            for settlement in labels() {
          +                for rejected in [false, true] {
          +                    for awaiting in [false, true] {
          +                        let mut store = PromiseStore::new();
          +                        let mut queue = MicrotaskQueue::new();
          +                        let source = if rejected {
          +                            store.reject_with(JsValue::Int(42), settlement.clone(), &mut queue)
          +                        } else {
          +                            store.resolve(JsValue::Int(42), settlement.clone(), &mut queue)
          +                        };
          +                        let before = (serde_json::to_value(&store).unwrap(), serde_json::to_value(&queue).unwrap());
          +                        let projected = store.projected_then_memory_bytes(source, &context, &queue).unwrap();
          +                        assert_eq!(before, (serde_json::to_value(&store).unwrap(), serde_json::to_value(&queue).unwrap()));
          +                        if awaiting {
          +                            store.then_for_await(source, context.clone(), &mut queue)
          +                        } else {
          +                            store.then(source, None, None, context.clone(), &mut queue)
          +                        }.unwrap();
          +                        assert_eq!(projected, (store.estimated_memory_bytes(), queue.estimated_memory_bytes()), "context={context:?}, settlement={settlement:?}, rejected={rejected}, awaiting={awaiting}");
          +                    }
          +                }
          +            }
          +        }
          +    }
          +}
          +
           // ---------------------------------------------------------------------------
           // Microtask queue
           // ---------------------------------------------------------------------------
          PATCH
          git apply --recount --check "$RUNNER_TEMP/promise-ifc.patch"
          git apply --recount "$RUNNER_TEMP/promise-ifc.patch"
          rustfmt --edition 2024 crates/franken-engine/src/promise_model.rs crates/franken-engine/tests/promise_reaction_label_conformance.rs
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/franken-engine/src/promise_model.rs crates/franken-engine/tests/promise_reaction_label_conformance.rs
          git commit -m 'fix(runtime): preserve Promise reaction labels and budget projections' -m 'Join registration and settlement labels on all then/await and native-adoption reaction paths. Keep allocation-free memory projections exact using the canonical label order. Add shared engine/core timing and label regressions plus engine-private projection checks. Rustfmt and patch preconditions pass before publication; Cargo execution follows at this exact commit, and no runtime bead is closed by this commit.'
          git push origin HEAD:main
          git rev-parse HEAD > "$RUNNER_TEMP/source-revision.txt"
          git archive --format=tar.gz --output="$RUNNER_TEMP/runtime-source.tar.gz" HEAD AGENTS.md README.md CHANGELOG.md Cargo.toml Cargo.lock .cargo .beads crates docs .github/workflows scripts

      - name: Export exact patched source for independent inspection
        uses: actions/upload-artifact@v4
        with:
          name: promise-runtime-source
          path: |
            ${{ runner.temp }}/source-revision.txt
            ${{ runner.temp }}/runtime-source.tar.gz
          if-no-files-found: error
          retention-days: 3
      - name: Execute actual Promise tests and repository compiler gates
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/promise-validation"
          git rev-parse HEAD > "$RUNNER_TEMP/promise-validation/revision.txt"
          status=0
          run_check() {
            local name="$1"; shift
            printf '%s\n' "$*" > "$RUNNER_TEMP/promise-validation/$name.command.txt"
            "$@" 2>&1 | tee "$RUNNER_TEMP/promise-validation/$name.log"
            local result=${PIPESTATUS[0]}
            printf '%s\n' "$result" > "$RUNNER_TEMP/promise-validation/$name.exit-code.txt"
            if (( result != 0 )); then status=1; fi
          }
          run_check core-promise cargo test --locked -p frankenengine-core --lib promise_model::
          run_check engine-promise cargo test --locked -p frankenengine-engine --no-default-features --lib promise_model::
          run_check reaction-conformance cargo test --locked -p frankenengine-engine --no-default-features --test promise_reaction_label_conformance
          run_check check cargo check --locked --all-targets
          run_check clippy cargo clippy --locked --all-targets -- -D warnings
          run_check fmt cargo fmt --check
          exit "$status"
      - name: Preserve compiler and test output even when a gate fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: promise-runtime-validation
          path: ${{ runner.temp }}/promise-validation/
          if-no-files-found: warn
          retention-days: 7

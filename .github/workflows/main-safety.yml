name: Main Safety

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: main-safety-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-contracts:
    name: agent routes and receipt-bound comparator
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile Python contract tools
        run: |
          python3 -m py_compile scripts/agent_route.py
          python3 -m py_compile scripts/red_team_compromise_rate_metric.py
          python3 -m py_compile scripts/red_team_trial_common.py
          python3 -m py_compile scripts/red_team_trial_reader.py
          python3 -m py_compile scripts/aggregate_red_team_trials.py

      - name: Validate architectural change routing
        run: bash scripts/e2e/agent_change_route_smoke.sh

      - name: Execute comparator positive and ambiguity drills
        run: bash scripts/e2e/red_team_compromise_rate_metric_comparator_smoke.sh

      - name: Execute repeated-trial aggregation and tamper drills
        run: bash scripts/e2e/red_team_repeated_trial_harness_smoke.sh

  live-scope-validation:
    name: Live work-scope execution regressions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b75fa2255bce342cdffbb6d421e3de392fa1a459
          persist-credentials: false
      - name: Apply exact reviewed native patch
        run: |
          mkdir -p scope-validation
          cat > scope-validation/source.patch <<'PATCH'
          diff --git a/crates/franken-core/src/execution_orchestrator.rs b/crates/franken-core/src/execution_orchestrator.rs
          index 26a66cd..4c231d0 100644
          --- a/crates/franken-core/src/execution_orchestrator.rs
          +++ b/crates/franken-core/src/execution_orchestrator.rs
          @@ -1732,6 +1732,14 @@ impl ExecutionOrchestrator {
                       .and_then(|path| std::path::Path::new(path).parent())
                       .map(|path| path.display().to_string());
           
          +        // Admission alone only prevents future runs. Both configurations must
          +        // retain the live scope signal so a tenant/ancestor revoked after the
          +        // reservation interrupts this run at native checkpoints as well.
          +        if let Some(pool) = self.config.work_pool.as_ref() {
          +            pool.bind_interpreter_cancellation(&mut quickjs_config);
          +            pool.bind_interpreter_cancellation(&mut v8_config);
          +        }
          +
                   Ok(LaneRouter::with_configs(quickjs_config, v8_config))
               }
           
          @@ -3455,6 +3463,84 @@ mod tests {
               use crate::ifc_artifacts::{DeclassificationDecision, IfcSchemaVersion};
               use crate::signature_preimage::{SIGNATURE_SENTINEL, Signature, SigningKey};
           
          +    #[test]
          +    fn ordinary_lane_router_observes_revocation_from_native_allocation() {
          +        use crate::baseline_interpreter::{
          +            AllocKind, FunctionRef, HookContext, ObjectRef, PropertyKey, Value,
          +        };
          +        use std::sync::atomic::{AtomicUsize, Ordering};
          +
          +        struct RevokeOnAllocation {
          +            root: ExecutionWorkPool,
          +            calls: AtomicUsize,

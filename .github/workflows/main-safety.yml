          diff --git a/crates/franken-engine/tests/orchestrator_execution_budgets.rs b/crates/franken-engine/tests/orchestrator_execution_budgets.rs
          --- a/crates/franken-engine/tests/orchestrator_execution_budgets.rs
          +++ b/crates/franken-engine/tests/orchestrator_execution_budgets.rs
          @@ -710,3 +710,116 @@
               assert_eq!(core.execution_count(), 0);

name: Native Runtime

on:
  push:
    branches: [main]
    paths:
      - 'crates/franken-core/**'
      - 'crates/franken-engine/src/checkpoint.rs'
      - 'crates/franken-engine/src/execution_orchestrator.rs'
      - 'crates/franken-engine/src/guardplane_adapter.rs'
      - 'crates/franken-engine/src/ir_contract.rs'
      - 'crates/franken-engine/src/bin/franken_shipped_path_parity.rs'
      - 'crates/franken-engine/tests/orchestrator_execution_budgets.rs'
      - 'crates/franken-engine/tests/execution_orchestrator.rs'
      - 'crates/franken-engine/tests/guardplane_adapter_integration.rs'
      - 'crates/franken-engine/tests/ir_contract_integration.rs'
      - 'crates/franken-engine/tests/orchestrator_live_revocation.rs'
      - 'crates/franken-engine/tests/work_scope_revocation.rs'
      - 'crates/franken-engine/src/baseline_interpreter*'
      - 'crates/franken-engine/src/baseline_interpreter/**'
      - 'crates/franken-engine/src/lowering_pipeline.rs'
      - 'crates/franken-engine/src/promise_model*.rs'
      - 'crates/franken-engine/tests/async_generator_execution.rs'
      - 'crates/franken-engine/tests/generator_next_bd_v6cv1_regression.rs'
      - 'crates/franken-engine/tests/array_species_bd_9vouw_94.rs'
      - 'crates/franken-engine/tests/proxy_descriptor_traps_bd_9vouw_147.rs'
      - 'crates/franken-engine/tests/promise_subclass_bd_9vouw_137.rs'
      - 'crates/franken-engine/tests/promise_reaction_label_conformance.rs'
      - 'crates/franken-engine/tests/gc_reclaim_bd_9vouw_57.rs'
      - 'crates/franken-engine/tests/reflect_*.rs'
      - 'crates/franken-engine/tests/querystring_os_builtin_bd_qmy52.rs'
      - 'crates/franken-engine/tests/js_string*.rs'
      - 'crates/franken-engine/tests/fixtures/string_hotpaths/**'
      - 'crates/franken-engine/tests/environment_hostcalls.rs'
      - 'crates/franken-extension-host/src/host_io.rs'
      - 'crates/franken-extension-host/src/host_io/**'
      - 'crates/franken-extension-host/tests/environment_snapshot.rs'
      - '.github/workflows/native-runtime.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  boundary-regressions:
    name: Native runtime boundary regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-09-21
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - name: Execute querystring and OS regressions
        run: |
          set -o pipefail
          cargo test --locked -p frankenengine-engine --no-default-features \
            --test querystring_os_builtin_bd_qmy52 \
            -- --nocapture --test-threads=1 2>&1 | tee boundary-querystring-tests.log
      - name: Execute shared string metadata and search regressions
        if: always()
        run: |
          set -o pipefail
          cargo test --locked --no-fail-fast -p frankenengine-core \
            --test js_string_hotpaths --test js_string_native_fastpaths \
            -- --nocapture --test-threads=1 2>&1 | tee boundary-shared-string-tests.log
      - name: Execute string source-to-runtime regressions
        if: always()
        run: |
          set -o pipefail
          cargo test --locked --no-fail-fast -p frankenengine-engine --no-default-features \
            --test js_string_integration --test js_string_hotpath_integration \
            -- --nocapture --test-threads=1 2>&1 | tee boundary-string-runtime-tests.log
      - name: Execute environment snapshot provider regressions
        if: always()
        run: |
          set -o pipefail
          cargo test --locked -p frankenengine-extension-host \
            --test environment_snapshot \
            -- --nocapture --test-threads=1 2>&1 | tee boundary-environment-snapshot-tests.log
      - name: Execute environment hostcall and replay regressions
        if: always()
        run: |
          set -o pipefail
          cargo test --locked --no-fail-fast -p frankenengine-engine --no-default-features \
            --test environment_hostcalls --test package_intake_integration \
            -- --nocapture --test-threads=1 2>&1 | tee boundary-environment-hostcall-tests.log
      - name: Execute live guardplane containment regressions
        if: always()
        run: |
          set -o pipefail
          cargo test --locked --no-fail-fast -p frankenengine-engine --no-default-features \
            --test guardplane_adapter_integration --test execution_orchestrator \
            --test ir_contract_integration \
            bd_9vouw_7 -- --nocapture --test-threads=1 2>&1 | tee boundary-guardplane-tests.log
      - name: Retain complete boundary test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-boundary-regressions
          path: boundary-*-tests.log
          retention-days: 7
  reflection:
    name: Native reflection and confidentiality
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Execute production reflection boundaries
        run: |
          set -o pipefail
          cargo +stable test --locked -p frankenengine-engine --no-default-features \
            --test reflect_invocation_execution --test reflect_property_execution \
            --test reflect_failure_confidentiality --test orchestrator_execution_budgets \
            --test orchestrator_live_revocation --test work_scope_revocation \
            -- --nocapture 2>&1 | tee reflection-tests.log
      - name: Retain reflection results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reflection-validation
          path: reflection-tests.log
          retention-days: 7
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
      - name: Capture exact native-runtime source inputs
        run: |
          git rev-parse HEAD > native-runtime-revision.txt
          git archive --format=tar.gz --output=native-runtime-sources.tar.gz HEAD
      - name: Retain reproducible source inputs
        uses: actions/upload-artifact@v4
        with:
          name: native-runtime-sources
          path: |
            native-runtime-sources.tar.gz
            native-runtime-revision.txt
          retention-days: 7
      - name: Install Rust
        run: rustup toolchain install nightly --profile minimal --component clippy --component rustfmt
      - name: Run native-core unit tests
        run: |
          status=0
          cargo +nightly test --locked -p frankenengine-core --lib -- --nocapture > native-runtime-tests.log 2>&1 || status=$?
          tail -n 160 native-runtime-tests.log
          exit "$status"
      - name: Run public native-core execution budget regressions
        if: always()
        run: |
          set -o pipefail
          cargo +nightly test --locked -p frankenengine-core --test orchestrator_execution_budgets \
            -- --nocapture 2>&1 | tee native-runtime-orchestrator.log
      - name: Retain complete test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-runtime-validation
          path: native-runtime-*.log
          retention-days: 7
  # Compile the production runtime dependency closure without the unrelated
  # publication binaries. This is additional source-level coverage, not a
  # substitute for the unchanged full-engine gates or native-core unit tests.
  async-generators:
    name: Native runtime semantics
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install nightly-2026-09-21 --profile minimal --component rustfmt
      - name: Select native runtime dependency closure
        run: |
          mkdir -p async-generator-validation
          git rev-parse HEAD > async-generator-validation/revision.txt
          python3 - <<'PY'
          import pathlib, re
          src = pathlib.Path('crates/franken-engine/src')
          root = (src / 'lib.rs').read_text()
          names = set(re.findall(r'^pub mod (\w+);', root, re.M))
          # These roots include production dependencies declared after embedded
          # test modules and the public parse_script integration-test helper.
          todo = ['lib', 'baseline_interpreter', 'parser', 'lowering_pipeline',
                  'ir_contract', 'security_e2e', 'tls_x509_metadata',
                  'crypto_kdf_zeroized', 'profiling', 'ts_normalization',
                  'static_semantics', 'parser_api_stability']
          seen = set()
          def production(text):
              return re.split(r'#\[cfg\(test\)\]\s*(?:pub\s+)?mod\s+\w+', text)[0]
          while todo:
              name = todo.pop()
              if name in seen:
                  continue
              seen.add(name)
              path = src / (name + '.rs')
              text = production(path.read_text() if path.exists() else (src / name / 'mod.rs').read_text())
              for child in (src / name).rglob('*.rs'):
                  if child.name != 'mod.rs':
                      text += '\n' + production(child.read_text())
              dependencies = set(re.findall(r'(?:crate|frankenengine_engine)::(\w+)', text)) & names
              if name == 'lib':
                  dependencies |= set(re.findall(r'\b(\w+)::', text)) & names
              for group in re.findall(r'use crate::\{([^;]+)\};', text):
                  dependencies |= set(re.findall(r'\b(\w+)::', group)) & names
              todo.extend(dependencies - seen)
          # Temporary target selection only. No implementation, assertion,
          # golden output, or production feature flag is rewritten.
          selected = re.sub(r'^pub mod (\w+);', lambda m: m[0] if m[1] in seen else '#[cfg(any())]\n' + m[0], root, flags=re.M)
          (src / 'runtime_validation_lib.rs').write_text(selected)
          manifest_path = src.parent / 'Cargo.toml'
          manifest = manifest_path.read_text().replace('[package]\n', '[package]\nautobins = false\n', 1)
          manifest = manifest.replace('path = "src/lib.rs"', 'path = "src/runtime_validation_lib.rs"', 1)
          manifest = re.sub(r'\[\[bin\]\][\s\S]*?(?=\n\[|\Z)', '', manifest)
          manifest_path.write_text(manifest)
          pathlib.Path('async-generator-validation/runtime-modules.txt').write_text('\n'.join(sorted(seen)))
          print('Focused runtime module count:', len(seen))
          PY
      - name: Run generator, array, Proxy, and Promise source regressions
        run: |
          status=0
          cargo +nightly-2026-09-21 test --locked -p frankenengine-engine --no-default-features --no-fail-fast \
            --test async_generator_execution --test generator_next_bd_v6cv1_regression \
            --test array_species_bd_9vouw_94 --test proxy_descriptor_traps_bd_9vouw_147 \
            --test promise_subclass_bd_9vouw_137 --test promise_reaction_label_conformance \
            --test gc_reclaim_bd_9vouw_57 \
            -- --nocapture > async-generator-validation/tests.log 2>&1 || status=$?
          tail -n 220 async-generator-validation/tests.log
          exit "$status"
      - name: Check runtime implementation and regression formatting
        run: |
          rustfmt +nightly-2026-09-21 --edition 2024 --check \
            crates/franken-engine/src/baseline_interpreter/async_generator.rs \
            crates/franken-engine/src/baseline_interpreter/array_generic.rs \
            crates/franken-engine/src/baseline_interpreter/object_integrity.rs \
            crates/franken-engine/src/baseline_interpreter/promise_capability.rs \
            crates/franken-engine/src/promise_model.rs \
            crates/franken-engine/tests/async_generator_execution.rs \
            crates/franken-engine/tests/array_species_bd_9vouw_94.rs \
            crates/franken-engine/tests/proxy_descriptor_traps_bd_9vouw_147.rs \
            crates/franken-engine/tests/promise_subclass_bd_9vouw_137.rs \
            crates/franken-engine/tests/gc_reclaim_bd_9vouw_57.rs
      - name: Retain exact revision and complete validation output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: async-generator-validation
          path: async-generator-validation/
          retention-days: 7

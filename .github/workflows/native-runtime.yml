name: Native Runtime

on:
  push:
    branches: [main]
    paths:
      - 'crates/franken-core/**'
      - 'crates/franken-engine/src/baseline_interpreter*'
      - 'crates/franken-engine/src/baseline_interpreter/**'
      - 'crates/franken-engine/src/lowering_pipeline.rs'
      - 'crates/franken-engine/tests/async_generator_execution.rs'
      - '.github/workflows/native-runtime.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
      - name: Capture exact native-runtime source inputs
        run: |
          git rev-parse HEAD > native-runtime-revision.txt
          git archive --format=tar.gz --output=native-runtime-sources.tar.gz HEAD
      - name: Retain reproducible source inputs
        uses: actions/upload-artifact@v4
        with:
          name: native-runtime-sources
          path: |
            native-runtime-sources.tar.gz
            native-runtime-revision.txt
          retention-days: 7
      - name: Install Rust
        run: rustup toolchain install nightly --profile minimal --component clippy --component rustfmt
      - name: Run native-core unit tests
        run: |
          status=0
          cargo +nightly test --locked -p frankenengine-core --lib -- --nocapture > native-runtime-tests.log 2>&1 || status=$?
          tail -n 160 native-runtime-tests.log
          exit "$status"
      - name: Retain complete test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-runtime-validation
          path: native-runtime-*.log
          retention-days: 7
  # Focused compilation of the production runtime dependency closure. This is
  # additional source-level coverage, not a substitute for full engine gates.
  async-generators:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install nightly --profile minimal --component rustfmt
      # One-shot immutable-blob transport. No branch/ref writes are performed;
      # the reviewed result is committed separately through the GitHub connector.
      - name: Materialize exact async-delegation candidate
        if: github.event_name == 'push' && github.event.before == 'd28226f1c2168a201e95f07ba7ded99b35319e96'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess, urllib.request
          output = pathlib.Path('async-generator-validation')
          output.mkdir(exist_ok=True)
          api = 'https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY']
          def request(path, data=None):
              body = None if data is None else json.dumps(data).encode()
              req = urllib.request.Request(api + path, data=body, headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json',
                  'User-Agent': 'OpenAI File Downloader, XaiImageApiFetch/1.0',
                  'Content-Type': 'application/json',
              })
              with urllib.request.urlopen(req, timeout=60) as response:
                  return json.load(response)
          def blob(sha):
              content = base64.b64decode(request('/git/blobs/' + sha)['content'])
              assert hashlib.sha1(('blob ' + str(len(content)) + '\0').encode() + content).hexdigest() == sha
              return content
          bases = {
              'crates/franken-engine/src/baseline_interpreter.rs': 'bcc39458a695ada12eb08afe6e23edd01236601b',
              'crates/franken-engine/src/baseline_interpreter/async_generator.rs': '523795dd763123e956853bcf4dcc9162d3caf307',
              'crates/franken-engine/tests/async_generator_execution.rs': 'd3acbdd77a674c55d3bb559277d107b4cdb02dfd',
          }
          for path, expected in bases.items():
              assert subprocess.check_output(['git', 'rev-parse', 'HEAD:' + path], text=True).strip() == expected
          patch = blob('47a451109bd83f5c33cf75077d75bd9c1ed8c8e2') + blob('40acf179577bbb50dfedc72280a041613fef5e65')
          patch_path = output / 'candidate.patch'
          patch_path.write_bytes(patch)
          stats = subprocess.check_output(['git', 'apply', '--numstat', str(patch_path)], text=True)
          assert sorted(line.split('\t', 2)[2] for line in stats.splitlines()) == sorted(bases)
          subprocess.run(['git', 'apply', '--check', str(patch_path)], check=True)
          subprocess.run(['git', 'apply', str(patch_path)], check=True)
          child = pathlib.Path('crates/franken-engine/src/baseline_interpreter/async_generator/delegation.rs')
          assert not child.exists()
          child.parent.mkdir(exist_ok=True)
          child.write_bytes(blob('470b58a4eabee60a5362aa0cba5dd3d3042bddcc'))
          subprocess.run(['rustfmt', '+nightly', '--edition', '2024', 'crates/franken-engine/src/baseline_interpreter/async_generator.rs', 'crates/franken-engine/tests/async_generator_execution.rs'], check=True)
          result = {'base_commit': os.environ['GITHUB_SHA'], 'files': []}
          for path in [*bases, str(child)]:
              content = pathlib.Path(path).read_bytes()
              sha = request('/git/blobs', {'content': base64.b64encode(content).decode(), 'encoding': 'base64'})['sha']
              assert hashlib.sha1(('blob ' + str(len(content)) + '\0').encode() + content).hexdigest() == sha
              result['files'].append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': sha})
              (output / pathlib.Path(path).name).write_bytes(content)
          (output / 'result.json').write_text(json.dumps(result, indent=2))
          PY
      - name: Select native runtime dependency closure
        run: |
          mkdir -p async-generator-validation
          git rev-parse HEAD > async-generator-validation/revision.txt
          python3 - <<'PY'
          import pathlib, re
          src = pathlib.Path('crates/franken-engine/src')
          root = (src / 'lib.rs').read_text()
          names = set(re.findall(r'^pub mod (\w+);', root, re.M))
          # These modules also have production items after embedded test
          # modules; explicitly root them rather than mistaking the first
          # cfg(test) block for the end of production code.
          todo = ['lib', 'baseline_interpreter', 'parser', 'lowering_pipeline',
                  'ir_contract', 'security_e2e', 'tls_x509_metadata',
                  'crypto_kdf_zeroized', 'profiling', 'ts_normalization',
                  'static_semantics']
          seen = set()
          def production(text):
              return re.split(r'#\[cfg\(test\)\]\s*(?:pub\s+)?mod\s+\w+', text)[0]
          while todo:
              name = todo.pop()
              if name in seen:
                  continue
              seen.add(name)
              path = src / (name + '.rs')
              text = production(path.read_text() if path.exists() else (src / name / 'mod.rs').read_text())
              for child in (src / name).rglob('*.rs'):
                  if child.name != 'mod.rs':
                      text += '\n' + production(child.read_text())
              dependencies = set(re.findall(r'(?:crate|frankenengine_engine)::(\w+)', text)) & names
              if name == 'lib':
                  dependencies |= set(re.findall(r'\b(\w+)::', text)) & names
              for group in re.findall(r'use crate::\{([^;]+)\};', text):
                  dependencies |= set(re.findall(r'\b(\w+)::', group)) & names
              todo.extend(dependencies - seen)
          # Only the temporary root/manifest select modules and targets. All
          # production implementation files and regression assertions are intact.
          selected = re.sub(r'^pub mod (\w+);', lambda m: m[0] if m[1] in seen else '#[cfg(any())]\n' + m[0], root, flags=re.M)
          (src / 'runtime_validation_lib.rs').write_text(selected)
          manifest_path = src.parent / 'Cargo.toml'
          manifest = manifest_path.read_text().replace('[package]\n', '[package]\nautobins = false\n', 1)
          manifest = manifest.replace('path = "src/lib.rs"', 'path = "src/runtime_validation_lib.rs"', 1)
          manifest = re.sub(r'\[\[bin\]\][\s\S]*?(?=\n\[|\Z)', '', manifest)
          manifest_path.write_text(manifest)
          pathlib.Path('async-generator-validation/runtime-modules.txt').write_text('\n'.join(sorted(seen)))
          print('Focused runtime module count:', len(seen))
          PY
      - name: Run source regressions in both execution profiles
        run: |
          status=0
          cargo +nightly test --locked -p frankenengine-engine --no-default-features --test async_generator_execution -- --nocapture > async-generator-validation/tests.log 2>&1 || status=$?
          tail -n 180 async-generator-validation/tests.log
          exit "$status"
      - name: Retain exact revision and complete validation output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: async-generator-validation
          path: async-generator-validation/
          retention-days: 7

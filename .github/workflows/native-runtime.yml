name: Native Runtime

on:
  push:
    branches: [main]
    paths:
      - 'crates/franken-core/**'
      - '.github/workflows/native-runtime.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
      - name: Capture exact native-runtime source inputs
        run: |
          git rev-parse HEAD > native-runtime-revision.txt
          git archive --format=tar.gz --output=native-runtime-sources.tar.gz HEAD
      - name: Retain reproducible source inputs
        uses: actions/upload-artifact@v4
        with:
          name: native-runtime-sources
          path: |
            native-runtime-sources.tar.gz
            native-runtime-revision.txt
          retention-days: 7
      - name: Install Rust
        run: rustup toolchain install nightly --profile minimal --component clippy --component rustfmt
      # One-time recovery of the missing local Rust toolchain and public
      # dependency sources. No credentials or Cargo configuration are included.
      # Remove this export when the editing environment supplies Cargo itself.
      - name: Prepare offline execution inputs
        if: github.event_name == 'push' && github.event.before == 'e1e2bb7abb38c0889cbc9a9769eba0853f95343b'
        run: |
          status=0
          cargo +nightly fetch --locked > native-runtime-fetch.log 2>&1 || status=$?
          tail -n 80 native-runtime-fetch.log
          exit "$status"
      - name: Archive offline execution inputs
        if: github.event_name == 'push' && github.event.before == 'e1e2bb7abb38c0889cbc9a9769eba0853f95343b'
        run: |
          tar -czf native-runtime-build-inputs.tar.gz -C "$HOME" .rustup/toolchains/nightly-x86_64-unknown-linux-gnu .cargo/registry .cargo/git
      - name: Retain offline execution inputs
        if: github.event_name == 'push' && github.event.before == 'e1e2bb7abb38c0889cbc9a9769eba0853f95343b'
        uses: actions/upload-artifact@v4
        with:
          name: native-runtime-build-inputs
          path: native-runtime-build-inputs.tar.gz
          compression-level: 0
          retention-days: 1
      - name: Run native-core unit tests
        run: |
          status=0
          cargo +nightly test --locked -p frankenengine-core --lib -- --nocapture > native-runtime-tests.log 2>&1 || status=$?
          tail -n 160 native-runtime-tests.log
          exit "$status"
      - name: Retain complete test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-runtime-validation
          path: native-runtime-*.log
          retention-days: 7

name: Native Runtime

on:
  push:
    branches: [main]
    paths:
      - 'crates/franken-core/**'
      - 'crates/franken-engine/src/baseline_interpreter*'
      - 'crates/franken-engine/src/baseline_interpreter/**'
      - 'crates/franken-engine/tests/async_generator_execution.rs'
      - '.github/workflows/native-runtime.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
      - name: Capture exact native-runtime source inputs
        run: |
          git rev-parse HEAD > native-runtime-revision.txt
          git archive --format=tar.gz --output=native-runtime-sources.tar.gz HEAD
      - name: Retain reproducible source inputs
        uses: actions/upload-artifact@v4
        with:
          name: native-runtime-sources
          path: |
            native-runtime-sources.tar.gz
            native-runtime-revision.txt
          retention-days: 7
      - name: Install Rust
        run: rustup toolchain install nightly --profile minimal --component clippy --component rustfmt
      - name: Run native-core unit tests
        run: |
          status=0
          cargo +nightly test --locked -p frankenengine-core --lib -- --nocapture > native-runtime-tests.log 2>&1 || status=$?
          tail -n 160 native-runtime-tests.log
          exit "$status"
      - name: Retain complete test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-runtime-validation
          path: native-runtime-*.log
          retention-days: 7
  # One-time transport for an interpreter file larger than the connector's
  # contents limit. This only creates immutable blobs; main is updated through
  # the GitHub connector after reviewing the candidate and running its tests.
  # Remove after the candidate has been committed.
  candidate:
    if: github.event_name == 'push' && github.event.before == 'e6dc49d6d494e2fca36a31228f79142f8b675a9e'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Materialize verified runtime candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, json, os, pathlib, subprocess, urllib.request
          root = pathlib.Path('candidate-output')
          root.mkdir()
          api = 'https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY']
          def request(path, data=None):
              body = None if data is None else json.dumps(data).encode()
              req = urllib.request.Request(api + path, data=body, headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json',
                  'User-Agent': 'OpenAI File Downloader, XaiImageApiFetch/1.0',
                  'Content-Type': 'application/json',
              })
              with urllib.request.urlopen(req, timeout=60) as response:
                  return json.load(response)
          raw = base64.b64decode(request('/git/blobs/dd6b6b4febc95a1ea642513af1b95788aedfdcf0')['content'])
          (root / 'candidate.raw').write_bytes(raw)
          assert hashlib.sha256(raw).hexdigest() == '6f7e44824c32568533493fcbfc165679ed221e0e5d3504be22bf1bd7f7630423', 'candidate transport checksum mismatch'
          patch = gzip.decompress(raw)
          (root / 'candidate.patch').write_bytes(patch)
          paths = [
              'crates/franken-engine/src/baseline_interpreter.rs',
              'crates/franken-engine/src/baseline_interpreter/async_generator.rs',
              'crates/franken-engine/tests/async_generator_execution.rs',
          ]
          actual = subprocess.check_output(['git', 'rev-parse', 'HEAD:' + paths[0]], text=True).strip()
          assert actual == 'e51ff0ac1dea56a636e2b7b50ab7bab8706f78e6', 'interpreter base changed'
          stats = subprocess.check_output(['git', 'apply', '--numstat', str(root / 'candidate.patch')], text=True)
          assert sorted(line.split('\t', 2)[2] for line in stats.splitlines()) == sorted(paths), 'unexpected patch paths'
          subprocess.run(['git', 'apply', '--check', str(root / 'candidate.patch')], check=True)
          subprocess.run(['git', 'apply', str(root / 'candidate.patch')], check=True)
          result = {'base_commit': os.environ['GITHUB_SHA'], 'files': []}
          for path in paths:
              file = pathlib.Path(path)
              assert file.is_file() and not file.is_symlink()
              content = file.read_bytes()
              sha = request('/git/blobs', {'content': base64.b64encode(content).decode(), 'encoding': 'base64'})['sha']
              expected = hashlib.sha1(('blob ' + str(len(content)) + '\0').encode() + content).hexdigest()
              assert sha == expected
              result['files'].append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': sha})
          (root / 'result.json').write_text(json.dumps(result, indent=2))
          PY
      - name: Retain candidate transport and blob identities
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-runtime-candidate
          path: candidate-output/
          retention-days: 7

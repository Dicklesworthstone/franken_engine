name: Native Primitive Conversions

on:
  push:
    branches: [main]
    paths:
      - 'crates/franken-engine/src/baseline_interpreter*'
      - 'crates/franken-engine/src/baseline_interpreter/**'
      - 'crates/franken-engine/src/lowering_pipeline.rs'
      - 'crates/franken-engine/tests/primitive_conversion_execution.rs'
      - '.github/workflows/primitive-conversions.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  conversions:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Capture committed conversion source identities
        run: |
          mkdir conversion-validation
          git rev-parse HEAD > conversion-validation/revision.txt
          python3 - <<'PY'
          import hashlib, json, pathlib
          paths = [
              'crates/franken-engine/src/baseline_interpreter.rs',
              'crates/franken-engine/src/baseline_interpreter/primitive_conversion.rs',
              'crates/franken-engine/src/lowering_pipeline.rs',
              'crates/franken-engine/tests/primitive_conversion_execution.rs',
          ]
          root = pathlib.Path('conversion-validation'); hashes = {}
          for path in paths:
              data = pathlib.Path(path).read_bytes()
              hashes[path] = hashlib.sha1(('blob ' + str(len(data)) + '\0').encode() + data).hexdigest()
              dest = root / 'source' / path
              dest.parent.mkdir(parents=True, exist_ok=True)
              dest.write_bytes(data)
          (root / 'source-hashes.json').write_text(json.dumps(hashes, indent=2))
          PY
      - name: Install Rust
        run: rustup toolchain install nightly --profile minimal --component rustfmt
      - name: Check committed conversion formatting
        run: |
          rustfmt +nightly --edition 2024 --check --config skip_children=true crates/franken-engine/src/baseline_interpreter.rs crates/franken-engine/src/baseline_interpreter/primitive_conversion.rs crates/franken-engine/src/lowering_pipeline.rs crates/franken-engine/tests/primitive_conversion_execution.rs
      - name: Select existing production runtime dependency closure
        run: |
          python3 - <<'PY'
          import pathlib, subprocess, textwrap
          text = pathlib.Path('.github/workflows/native-runtime.yml').read_text()
          step = text.split('      - name: Select native runtime dependency closure\n', 1)[1].split('\n      - name:', 1)[0]
          subprocess.run(['bash', '-e', '-c', textwrap.dedent(step.split('        run: |\n', 1)[1])], check=True)
          pathlib.Path('conversion-validation/runtime-modules.txt').write_bytes(pathlib.Path('async-generator-validation/runtime-modules.txt').read_bytes())
          PY
      - name: Run native primitive conversion regressions
        run: |
          set -o pipefail
          cargo +nightly test --locked -p frankenengine-engine --no-default-features --test primitive_conversion_execution -- --nocapture 2>&1 | tee conversion-validation/tests.log
      - name: Check production runtime dependency closure
        run: |
          set -o pipefail
          cargo +nightly check --locked -p frankenengine-engine --no-default-features --lib 2>&1 | tee conversion-validation/check.log
      - name: Retain complete validation output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: primitive-conversion-validation
          path: conversion-validation/
          retention-days: 7

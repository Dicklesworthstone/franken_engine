name: Quality Gates

on:
  pull_request:

jobs:
  frankenengine-engine:
    name: frankenengine-engine quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: quality-gates-frankenengine-engine

      - name: Cargo check
        run: cargo check -p frankenengine-engine

      - name: Cargo clippy
        run: cargo clippy -p frankenengine-engine --all-targets -- -D warnings

      - name: Cargo fmt
        run: cargo fmt --check

      - name: Cargo test
        run: cargo test -p frankenengine-engine

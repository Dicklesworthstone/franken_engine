name: Quality Gates

on:
  pull_request:

jobs:
  workspace-policy:
    name: workspace policy (franken-core re-exclude guard)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # bd-cixqu.10.8 (Track J): the root Cargo.toml must never silently
      # re-exclude crates/franken-core. `check` fails the build if the live
      # workspace state regresses; `negative` proves the guard still detects
      # a re-excluded fixture, so the guard itself cannot rot.
      - name: franken-core status-truth gate (check + negative)
        run: |
          bash scripts/e2e/franken_core_status_truth_gate_smoke.sh check
          bash scripts/e2e/franken_core_status_truth_gate_smoke.sh negative

      # BRIDGE-00.8 item 3: the claim-to-proof matrix governs capability *wording*;
      # nothing governed inventory *counts*, so the README architecture tables drifted
      # for two months (495 modules against a real 615, baseline_interpreter.rs
      # described at a third of its real size, three named modules that do not exist).
      # Regenerating once fixes the symptom; this fixes the cause. Needs no cargo and
      # no /dp siblings, so it runs anywhere.
      #
      # On failure: `python3 scripts/check_readme_inventory.py --fix` corrects the
      # numbers in place, line-count neutral so the matrix's pinned README claim spans
      # do not shift.
      - name: README structural-inventory gate
        run: python3 scripts/check_readme_inventory.py

      # bd-h5cl7: no [patch.*] entry may substitute a crate whose version differs from
      # what its consumers declare, and the guard saying so must itself be able to fail.
      - name: patch version consistency (check + negative drill)
        run: |
          python3 scripts/check_patch_version_consistency.py
          bash scripts/e2e/patch_version_consistency_drift.sh

  frankenengine-engine:
    name: frankenengine-engine quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: quality-gates-frankenengine-engine

      - name: Cargo check
        run: cargo check -p frankenengine-engine

      - name: Cargo clippy
        run: cargo clippy -p frankenengine-engine --all-targets -- -D warnings

      - name: Cargo fmt
        run: cargo fmt --check

      - name: Cargo test
        run: cargo test -p frankenengine-engine

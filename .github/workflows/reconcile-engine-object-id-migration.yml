name: UTF16 RegExp String Index Publication

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/reconcile-engine-object-id-migration.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: nightly
      CARGO_INCREMENTAL: 0
      CARGO_BUILD_JOBS: 1
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: utf16-regexp-string-indices
      - name: Publish JavaScript UTF-16 indices for match/search
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d | gzip -d > /tmp/utf16_regex_index_patch.py
          python3 /tmp/utf16_regex_index_patch.py
          rustfmt --edition 2024 crates/franken-engine/src/baseline_interpreter.rs crates/franken-engine/tests/string_regex_utf16_index_regression.rs
          cargo test --no-default-features -p frankenengine-engine --test string_regex_utf16_index_regression -- --nocapture
          cargo check --no-default-features -p frankenengine-engine --lib
          git diff --check
          git config user.name 'Jeff Emanuel'
          git config user.email '35050222+Dicklesworthstone@users.noreply.github.com'
          git add crates/franken-engine/src/baseline_interpreter.rs crates/franken-engine/tests/string_regex_utf16_index_regression.rs
          git commit -m 'fix(strings): report RegExp match/search indices in UTF-16 units'
          git fetch origin main
          if [[ "$(git rev-parse HEAD^)" != "$(git rev-parse origin/main)" ]]; then
            git rebase origin/main
            cargo test --no-default-features -p frankenengine-engine --test string_regex_utf16_index_regression -- --nocapture
            cargo check --no-default-features -p frankenengine-engine --lib
          fi
          git push origin HEAD:main

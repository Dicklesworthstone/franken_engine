name: EngineObjectId Migration Reconciliation

on:
  push:
    branches: [main]
    paths: [.github/workflows/reconcile-engine-object-id-migration.yml]

permissions:
  contents: write

jobs:
  containment:
    if: >-
      contains(github.event.head_commit.message, 'work(yield-star): validate delegation containment')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: nightly
      CARGO_INCREMENTAL: 0
      CARGO_BUILD_JOBS: 1
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6021fce391cc3417150ada61a75dcf4709eea813
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt,clippy
      - name: Prepare exact containment tests and locked dependency harness
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,gzip,hashlib,json,os,pathlib,shutil,subprocess,tarfile,tomllib,urllib.request
          root=pathlib.Path.cwd()
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'containment-prepared'
          out.mkdir()
          prefix='https://api.github.com/repos/Dicklesworthstone/franken_engine/git/blobs'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'User-Agent':'OpenAI File Downloader, XaiImageApiFetch/1.0','Content-Type':'application/json'}
          def api(url,data=None):
              req=urllib.request.Request(url,data=None if data is None else json.dumps(data).encode(),headers=headers)
              with urllib.request.urlopen(req,timeout=90) as response:
                  return json.load(response)
          def sha(data):
              return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          name='crates/franken-engine/tests/generator_next_bd_v6cv1_regression.rs'
          assert sha((root/name).read_bytes())=='bc18d006c047b2dfebd306efe390efaff8ca0f13'
          assert sha((root/'crates/franken-engine/src/baseline_interpreter.rs').read_bytes())=='4398746293ccd2db5fe34c48f80934b317bc6516'
          packed=base64.b64decode(api(prefix+'/f33b3bf8bc2185ab441360698b28c3db2fe38dc9')['content'])
          assert sha(packed)=='f33b3bf8bc2185ab441360698b28c3db2fe38dc9'
          patch=gzip.decompress(packed)
          subprocess.run(['git','apply','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','-'],input=patch,check=True)
          assert sha((root/name).read_bytes())=='35c9507332e1903d7db09c2959c972db8bafe0b5'
          subprocess.run(['rustfmt','--edition','2024',name],check=True)
          subprocess.run(['git','diff','--check'],check=True)
          data=(root/name).read_bytes()
          result=api(prefix,{'content':base64.b64encode(data).decode(),'encoding':'base64'})
          assert result['sha']==sha(data)
          files=[{'path':name,'sha':result['sha'],'bytes':len(data)}]
          (out/'files.json').write_text(json.dumps(files,indent=2))
          (out/'generator_next_bd_v6cv1_regression.rs').write_bytes(data)
          print(json.dumps(files,indent=2))
          harness=pathlib.Path(os.environ['RUNNER_TEMP'])/'native-runtime-probes'
          harness.mkdir()
          tests=['generator_next_bd_v6cv1_regression','iterator_destructuring_regression','destructuring_default_branch_regression','destructuring_nested_rest_regression','destructuring_assignment_bd_umee4','for_of_destructuring_lowering_conformance','for_of_iterator_throw_regression']
          manifest='[package]\nname="franken-native-runtime-probes"\nversion="0.0.0"\nedition="2024"\npublish=false\n[workspace]\nresolver="2"\n[dependencies]\nfrankenengine-engine={path='+json.dumps(str(root/'crates/franken-engine'))+',default-features=false}\n'
          for test in tests:
              source=root/'crates/franken-engine/tests'/f'{test}.rs'
              assert source.is_file()
              manifest+='\n[[test]]\nname='+json.dumps(test)+'\npath='+json.dumps(str(source))+'\n'
          (harness/'Cargo.toml').write_text(manifest)
          shutil.copyfile(root/'Cargo.lock',harness/'Cargo.lock')
          with (harness/'metadata.json').open('w') as output:
              subprocess.run(['cargo','metadata','--format-version','1','--manifest-path',str(harness/'Cargo.toml')],stdout=output,check=True)
          def identities(path):
              return {(p['name'],p['version'],p.get('source'),p.get('checksum')) for p in tomllib.loads(path.read_text())['package']}
          assert identities(harness/'Cargo.lock')-identities(root/'Cargo.lock') <= {('franken-native-runtime-probes','0.0.0',None,None)}
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: containment-prepared
          path: ${{ runner.temp }}/containment-prepared
          retention-days: 2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: native-iterator-standalone
          cache-on-failure: true
      - name: Execute generator protocol containment and replay tests
        run: |
          set +e
          timeout 1500 cargo test --locked --manifest-path "$RUNNER_TEMP/native-runtime-probes/Cargo.toml" --test generator_next_bd_v6cv1_regression > "$RUNNER_TEMP/containment-tests.log" 2>&1
          status=$?
          tail -n 260 "$RUNNER_TEMP/containment-tests.log"
          exit "$status"
      - name: Run surrounding native regressions and all workspace gates
        if: ${{ !cancelled() }}
        run: |
          set +e
          timeout 450 cargo test --locked --manifest-path "$RUNNER_TEMP/native-runtime-probes/Cargo.toml" --no-fail-fast > "$RUNNER_TEMP/containment-surrounding.log" 2>&1
          tests=$?
          timeout 180 cargo check --locked --all-targets > "$RUNNER_TEMP/containment-check.log" 2>&1
          check=$?
          timeout 180 cargo clippy --locked --all-targets -- -D warnings > "$RUNNER_TEMP/containment-clippy.log" 2>&1
          clippy=$?
          cargo fmt --check > "$RUNNER_TEMP/containment-fmt.log" 2>&1
          fmt=$?
          printf 'tests=%s check=%s clippy=%s fmt=%s\n' "$tests" "$check" "$clippy" "$fmt"
          tail -n 50 "$RUNNER_TEMP/containment-surrounding.log" "$RUNNER_TEMP/containment-check.log" "$RUNNER_TEMP/containment-clippy.log" "$RUNNER_TEMP/containment-fmt.log"
          test "$tests" = 0 && test "$check" = 0 && test "$clippy" = 0 && test "$fmt" = 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: containment-native-results
          path: ${{ runner.temp }}/containment-*.log
          retention-days: 2

name: EngineObjectId Migration Reconciliation

on:
  push:
    branches: [main]
    paths: [.github/workflows/reconcile-engine-object-id-migration.yml]

permissions:
  contents: read

jobs:
  source:
    if: >-
      contains(github.event.head_commit.message, 'work(runtime): capture exact current sources')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Export exact checkout
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/runtime-source
          git rev-parse HEAD > /tmp/runtime-source/revision.txt
          git ls-tree -r HEAD > /tmp/runtime-source/tree.txt
          git archive --format=tar.gz HEAD AGENTS.md README.md Cargo.toml Cargo.lock crates .beads docs scripts .github .cargo > /tmp/runtime-source/source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-crash-source
          path: /tmp/runtime-source
          retention-days: 2
          if-no-files-found: error

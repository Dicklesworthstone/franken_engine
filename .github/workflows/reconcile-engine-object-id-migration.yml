name: EngineObjectId Migration Reconciliation

on:
  push:
    branches: [main]
    paths: [.github/workflows/reconcile-engine-object-id-migration.yml]

permissions:
  contents: read

jobs:
  prepare:
    if: >-
      github.repository == 'Dicklesworthstone/franken_engine' && github.event.head_commit.message == 'work(iterator): validate callback label ownership and protocol callability fixes'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      files: ${{ steps.patch.outputs.files }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          clean: false
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: nightly
          components: rustfmt
      - name: Apply exact protocol correction and prepare source blobs
        id: patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64,gzip,hashlib,json,os,pathlib,subprocess,tarfile,urllib.request
          root='https://api.github.com/repos/Dicklesworthstone/franken_engine'
          def api(path,body=None):
              req=urllib.request.Request(root+path,data=None if body is None else json.dumps(body).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Content-Type':'application/json','User-Agent':'OpenAI File Downloader, XaiImageApiFetch/1.0'})
              with urllib.request.urlopen(req,timeout=90) as response:
                  return json.load(response)
          def digest(data):
              return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          def git(*args,data=None):
              return subprocess.run(['git',*args],input=data,stdout=subprocess.PIPE,check=True).stdout.decode()
          paths={'crates/franken-engine/src/baseline_interpreter.rs':'93931c6b2c99c8590d72a9c8f6fd48bf819aabfb','crates/franken-engine/tests/generator_next_bd_v6cv1_regression.rs':'f0b240f2037b89bf23ed5f30e6c7dadd67dbffd0','crates/franken-engine/tests/iterator_destructuring_regression.rs':'b39c86e8b86946c39b2e0d0d5c11ea0b3f0bdc59'}
          assert not git('status','--porcelain')
          for path,sha in paths.items():
              assert digest(pathlib.Path(path).read_bytes())==sha,path
          chunk=base64.b64decode(api('/git/blobs/8f45c75ae6e98e36e7a01b826ee3cd23c070725d')['content'])
          assert digest(chunk)=='8f45c75ae6e98e36e7a01b826ee3cd23c070725d'
          patch=gzip.decompress(chunk)
          assert digest(patch)=='2e1134b2e2f8957b482068cb6ae6b7c6aae50292'
          git('apply','--check','--index','--whitespace=error-all',data=patch)
          git('apply','--index','--whitespace=error-all',data=patch)
          assert set(git('diff','--cached','--name-only').splitlines())==set(paths)
          for path in paths:
              if '/tests/' in path:
                  subprocess.run(['rustfmt','--edition','2024',path],check=True)
              else:
                  subprocess.run(['rustfmt','--edition','2024','--config','skip_children=true','--emit','stdout',path],stdout=subprocess.DEVNULL,check=True)
          git('add','--',*paths)
          git('diff','--cached','--check')
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'protocol-prepared'
          out.mkdir()
          (out/'implementation.patch').write_text(git('diff','--cached','--binary'))
          files=[]
          for path in paths:
              data=pathlib.Path(path).read_bytes()
              item=api('/git/blobs',{'content':base64.b64encode(data).decode(),'encoding':'base64'})
              assert item['sha']==digest(data)
              files.append({'path':path,'sha':item['sha'],'bytes':len(data)})
          manifest={'base':os.environ['GITHUB_SHA'],'files':files}
          (out/'prepared.json').write_text(json.dumps(manifest))
          with tarfile.open(out/'prepared.tar.gz','w:gz') as archive:
              for path in paths:
                  archive.add(path,arcname=path)
          print('PREPARED_FILES='+json.dumps(manifest),flush=True)
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              output.write('files='+json.dumps(files,separators=(',',':'))+'\n')
          print(git('diff','--cached','--stat'))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: protocol-prepared
          path: ${{ runner.temp }}/protocol-prepared
          retention-days: 2

  native:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          clean: false
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: nightly
          components: rustfmt,clippy
      - name: Load exact prepared source files
        env:
          GH_TOKEN: ${{ github.token }}
          FILES: ${{ needs.prepare.outputs.files }}
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,os,pathlib,urllib.request
          files=json.loads(os.environ['FILES'])
          allowed={'crates/franken-engine/src/baseline_interpreter.rs','crates/franken-engine/tests/generator_next_bd_v6cv1_regression.rs','crates/franken-engine/tests/iterator_destructuring_regression.rs'}
          assert {item['path'] for item in files}==allowed
          for item in files:
              req=urllib.request.Request('https://api.github.com/repos/Dicklesworthstone/franken_engine/git/blobs/'+item['sha'],headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'User-Agent':'OpenAI File Downloader, XaiImageApiFetch/1.0'})
              with urllib.request.urlopen(req,timeout=90) as response:
                  blob=json.load(response)
              data=base64.b64decode(blob['content'])
              assert len(data)==item['bytes']
              assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==item['sha']
              pathlib.Path(item['path']).write_bytes(data)
              print(item['path'],item['sha'])
          PY
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: native-iterator-standalone
          cache-on-failure: true
      - name: Native tests
        run: |
          set +e
          timeout 1500 cargo test --locked --no-default-features -p frankenengine-engine --no-fail-fast --test generator_next_bd_v6cv1_regression --test iterator_destructuring_regression --test destructuring_default_branch_regression --test destructuring_nested_rest_regression --test destructuring_assignment_bd_umee4 --test for_of_destructuring_lowering_conformance --test for_of_iterator_throw_regression > "$RUNNER_TEMP/protocol-tests.log" 2>&1
          status=$?
          tail -n 200 "$RUNNER_TEMP/protocol-tests.log"
          exit "$status"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: protocol-tests
          path: ${{ runner.temp }}/protocol-tests.log
          retention-days: 2
      - name: Compiler lint and formatting gates
        if: ${{ !cancelled() }}
        run: |
          set +e
          timeout 600 cargo check --locked --all-targets > "$RUNNER_TEMP/protocol-check.log" 2>&1
          check=$?
          timeout 600 cargo clippy --locked --all-targets -- -D warnings > "$RUNNER_TEMP/protocol-clippy.log" 2>&1
          clippy=$?
          cargo fmt --check > "$RUNNER_TEMP/protocol-fmt.log" 2>&1
          fmt=$?
          printf 'check=%s clippy=%s fmt=%s\n' "$check" "$clippy" "$fmt"
          tail -n 30 "$RUNNER_TEMP/protocol-check.log" "$RUNNER_TEMP/protocol-clippy.log" "$RUNNER_TEMP/protocol-fmt.log"
          test "$check" = 0 && test "$clippy" = 0 && test "$fmt" = 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: protocol-gates
          path: ${{ runner.temp }}/protocol-*.log
          retention-days: 2

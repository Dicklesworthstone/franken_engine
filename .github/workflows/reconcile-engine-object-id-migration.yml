name: CommonJS Package Graph Integration

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/reconcile-engine-object-id-migration.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: nightly
      CARGO_INCREMENTAL: 0
      CARGO_BUILD_JOBS: 1
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: package-intake-cjs-graph
          cache-on-failure: true
      - name: Wire literal CommonJS require edges into package intake
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('crates/franken-engine/src/package_intake.rs')
          s = p.read_text()

          def replace_once(old: str, new: str, label: str) -> None:
              global s
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              s = s.replace(old, new, 1)

          replace_once(
              'use crate::ast::{ExportKind, ParseGoal, Statement};',
              'use crate::ast::{ExportKind, Expression, ParseGoal, Statement};',
              'ast import',
          )

          replace_once(
              '''//! **Honest boundaries (v1).** Only ES `import` declarations are followed as
//! graph edges; CommonJS `require(...)` and dynamic `import(...)` are *not* yet
//! followed as edges (they still surface in each module's per-file footprint as
//! ambient-authority findings — they are never silently dropped). External
//! (bare / npm) specifiers are reported, never analyzed. Re-export sources
''',
              '''//! **Honest boundaries (v1).** ES `import` declarations and static CommonJS
//! `require("literal")` calls are followed as graph edges. Non-literal or otherwise
//! dynamic `require(...)` calls are explicitly surfaced as bounded coverage rather
//! than silently ignored. Dynamic `import(...)` remains a per-file analyzed surface,
//! but is not followed as a package-graph edge. External (bare / npm) specifiers are
//! reported, never analyzed. Re-export sources
''',
              'module boundary docs',
          )

          replace_once(
              '''pub const PACKAGE_INTAKE_DISCLAIMER: &str = "inferred package authority footprint over the SUPPORTED ES-module graph reachable from the entry; \\
not a proof of noninterference for arbitrary JS/TS. External packages, CommonJS/dynamic edges, and unanalyzable modules are reported, never silently covered.";''',
              '''pub const PACKAGE_INTAKE_DISCLAIMER: &str = "inferred package authority footprint over the SUPPORTED static module graph reachable from the entry; \\
not a proof of noninterference for arbitrary JS/TS. External packages, dynamic CommonJS/dynamic-import edges, and unanalyzable modules are reported, never silently covered.";''',
              'disclaimer',
          )

          old_structs = '''/// An ES `import` declaration projected to (specifier, location).
struct ImportEdge {
    specifier: String,
    location: SourceLocation,
}

/// What a single file contributes to the graph: its detected syntax and the ES
/// import declarations it carries (the graph edges to follow).
struct ExtractedModule {
    syntax: ModuleSyntax,
    imports: Vec<ImportEdge>,
}

'''
          new_structs = '''/// A statically analyzable module edge projected to resolver style + source site.
struct ImportEdge {
    specifier: String,
    style: ImportStyle,
    location: SourceLocation,
}

/// What a single file contributes to the graph: detected syntax, static edges,
/// and the count of dynamic CommonJS edges that cannot be followed safely.
struct ExtractedModule {
    syntax: ModuleSyntax,
    imports: Vec<ImportEdge>,
    dynamic_require_count: usize,
}

fn collect_require_edges_from_pattern(
    pattern: &crate::ast::BindingPattern,
    fallback_span: &crate::ast::SourceSpan,
    imports: &mut Vec<ImportEdge>,
    dynamic_require_count: &mut usize,
) {
    match pattern {
        crate::ast::BindingPattern::Identifier(_) => {}
        crate::ast::BindingPattern::ObjectPattern(properties) => {
            for property in properties {
                if property.computed {
                    collect_require_edges_from_expression(
                        &property.key,
                        fallback_span,
                        imports,
                        dynamic_require_count,
                    );
                }
                collect_require_edges_from_pattern(
                    &property.value,
                    fallback_span,
                    imports,
                    dynamic_require_count,
                );
            }
        }
        crate::ast::BindingPattern::ArrayPattern(elements) => {
            for element in elements.iter().flatten() {
                collect_require_edges_from_pattern(
                    element,
                    fallback_span,
                    imports,
                    dynamic_require_count,
                );
            }
        }
        crate::ast::BindingPattern::Rest(inner) => collect_require_edges_from_pattern(
            inner,
            fallback_span,
            imports,
            dynamic_require_count,
        ),
        crate::ast::BindingPattern::AssignmentPattern { left, right } => {
            collect_require_edges_from_pattern(
                left,
                fallback_span,
                imports,
                dynamic_require_count,
            );
            collect_require_edges_from_expression(
                right,
                fallback_span,
                imports,
                dynamic_require_count,
            );
        }
    }
}

fn collect_require_edges_from_expression(
    expression: &Expression,
    fallback_span: &crate::ast::SourceSpan,
    imports: &mut Vec<ImportEdge>,
    dynamic_require_count: &mut usize,
) {
    match expression {
        Expression::Await(inner) | Expression::SpreadElement(inner) => {
            collect_require_edges_from_expression(
                inner,
                fallback_span,
                imports,
                dynamic_require_count,
            );
        }
        Expression::Yield { argument, .. } => {
            if let Some(argument) = argument {
                collect_require_edges_from_expression(
                    argument,
                    fallback_span,
                    imports,
                    dynamic_require_count,
                );
            }
        }
        Expression::Binary { left, right, .. }
        | Expression::Assignment { left, right, .. } => {
            collect_require_edges_from_expression(
                left,
                fallback_span,
                imports,
                dynamic_require_count,
            );
            collect_require_edges_from_expression(
                right,
                fallback_span,
                imports,
                dynamic_require_count,
            );
        }
        Expression::Unary { argument, .. } => collect_require_edges_from_expression(
            argument,
            fallback_span,
            imports,
            dynamic_require_count,
        ),
        Expression::Conditional {
            test,
            consequent,
            alternate,
        } => {
            collect_require_edges_from_expression(
                test,
                fallback_span,
                imports,
                dynamic_require_count,
            );
            collect_require_edges_from_expression(
                consequent,
                fallback_span,
                imports,
                dynamic_require_count,
            );
            collect_require_edges_from_expression(
                alternate,
                fallback_span,
                imports,
                dynamic_require_count,
            );
        }
        Expression::Call {
            callee,
            arguments,
            span,
        } => {
            if matches!(callee.as_ref(), Expression::Identifier(name) if name == "require") {
                let location = SourceLocation::from(
                    span.clone().unwrap_or_else(|| fallback_span.clone()),
                );
                match arguments.as_slice() {
                    [Expression::StringLiteral(specifier)] => {
                        if let Some(specifier) = specifier.as_str() {
                            imports.push(ImportEdge {
                                specifier: specifier.to_string(),
                                style: ImportStyle::Require,
                                location,
                            });
                        } else {
                            *dynamic_require_count = dynamic_require_count.saturating_add(1);
                        }
                    }
                    _ => {
                        *dynamic_require_count = dynamic_require_count.saturating_add(1);
                    }
                }
            }
            collect_require_edges_from_expression(
                callee,
                fallback_span,
                imports,
                dynamic_require_count,
            );
            for argument in arguments {
                collect_require_edges_from_expression(
                    argument,
                    fallback_span,
                    imports,
                    dynamic_require_count,
                );
            }
        }
        Expression::OptionalCall {
            callee, arguments, ..
        }
        | Expression::New { callee, arguments } => {
            collect_require_edges_from_expression(
                callee,
                fallback_span,
                imports,
                dynamic_require_count,
            );
            for argument in arguments {
                collect_require_edges_from_expression(
                    argument,
                    fallback_span,
                    imports,
                    dynamic_require_count,
                );
            }
        }
        Expression::Member {
            object,
            property,
            computed,
            ..
        }
        | Expression::OptionalMember {
            object,
            property,
            computed,
            ..
        } => {
            collect_require_edges_from_expression(
                object,
                fallback_span,
                imports,
                dynamic_require_count,
            );
            if *computed {
                collect_require_edges_from_expression(
                    property,
                    fallback_span,
                    imports,
                    dynamic_require_count,
                );
            }
        }
        Expression::ArrayLiteral(elements) => {
            for element in elements.iter().flatten() {
                collect_require_edges_from_expression(
                    element,
                    fallback_span,
                    imports,
                    dynamic_require_count,
                );
            }
        }
        Expression::ObjectLiteral(properties) => {
            for property in properties {
                if property.computed {
                    collect_require_edges_from_expression(
                        &property.key,
                        fallback_span,
                        imports,
                        dynamic_require_count,
                    );
                }
                collect_require_edges_from_expression(
                    &property.value,
                    fallback_span,
                    imports,
                    dynamic_require_count,
                );
            }
        }
        Expression::ArrowFunction { params, body, .. } => {
            for param in params {
                collect_require_edges_from_pattern(
                    &param.pattern,
                    &param.span,
                    imports,
                    dynamic_require_count,
                );
            }
            match body {
                crate::ast::ArrowBody::Expression(expression) => {
                    collect_require_edges_from_expression(
                        expression,
                        fallback_span,
                        imports,
                        dynamic_require_count,
                    );
                }
                crate::ast::ArrowBody::Block(block) => {
                    for statement in &block.body {
                        collect_require_edges_from_statement(
                            statement,
                            imports,
                            dynamic_require_count,
                        );
                    }
                }
            }
        }
        Expression::TemplateLiteral { expressions, .. } => {
            for expression in expressions {
                collect_require_edges_from_expression(
                    expression,
                    fallback_span,
                    imports,
                    dynamic_require_count,
                );
            }
        }
        Expression::Function {
            params, body, ..
        } => {
            for param in params {
                collect_require_edges_from_pattern(
                    &param.pattern,
                    &param.span,
                    imports,
                    dynamic_require_count,
                );
            }
            for statement in &body.body {
                collect_require_edges_from_statement(statement, imports, dynamic_require_count);
            }
        }
        Expression::ClassExpression {
            super_class, body, ..
        } => {
            if let Some(super_class) = super_class {
                collect_require_edges_from_expression(
                    super_class,
                    fallback_span,
                    imports,
                    dynamic_require_count,
                );
            }
            for method in body {
                if method.computed {
                    collect_require_edges_from_expression(
                        &method.key,
                        &method.span,
                        imports,
                        dynamic_require_count,
                    );
                }
                for param in &method.params {
                    collect_require_edges_from_pattern(
                        &param.pattern,
                        &param.span,
                        imports,
                        dynamic_require_count,
                    );
                }
                for statement in &method.body.body {
                    collect_require_edges_from_statement(
                        statement,
                        imports,
                        dynamic_require_count,
                    );
                }
            }
        }
        Expression::Identifier(_)
        | Expression::StringLiteral(_)
        | Expression::NumericLiteral(_)
        | Expression::BigIntLiteral(_)
        | Expression::FloatLiteral(_)
        | Expression::BooleanLiteral(_)
        | Expression::NullLiteral
        | Expression::UndefinedLiteral
        | Expression::This
        | Expression::NewTarget
        | Expression::ImportMeta
        | Expression::Raw(_)
        | Expression::RegExpLiteral { .. }
        | Expression::Super => {}
    }
}

fn collect_require_edges_from_statement(
    statement: &Statement,
    imports: &mut Vec<ImportEdge>,
    dynamic_require_count: &mut usize,
) {
    match statement {
        Statement::Import(_) | Statement::Break(_) | Statement::Continue(_) => {}
        Statement::Export(declaration) => {
            if let ExportKind::Default(expression) = &declaration.kind {
                collect_require_edges_from_expression(
                    expression,
                    &declaration.span,
                    imports,
                    dynamic_require_count,
                );
            }
        }
        Statement::VariableDeclaration(declaration) => {
            for declarator in &declaration.declarations {
                collect_require_edges_from_pattern(
                    &declarator.pattern,
                    &declarator.span,
                    imports,
                    dynamic_require_count,
                );
                if let Some(initializer) = &declarator.initializer {
                    collect_require_edges_from_expression(
                        initializer,
                        &declarator.span,
                        imports,
                        dynamic_require_count,
                    );
                }
            }
        }
        Statement::Expression(expression) => collect_require_edges_from_expression(
            &expression.expression,
            &expression.span,
            imports,
            dynamic_require_count,
        ),
        Statement::Block(block) => {
            for statement in &block.body {
                collect_require_edges_from_statement(statement, imports, dynamic_require_count);
            }
        }
        Statement::If(if_statement) => {
            collect_require_edges_from_expression(
                &if_statement.condition,
                &if_statement.span,
                imports,
                dynamic_require_count,
            );
            collect_require_edges_from_statement(
                &if_statement.consequent,
                imports,
                dynamic_require_count,
            );
            if let Some(alternate) = &if_statement.alternate {
                collect_require_edges_from_statement(alternate, imports, dynamic_require_count);
            }
        }
        Statement::For(for_statement) => {
            if let Some(init) = &for_statement.init {
                collect_require_edges_from_statement(init, imports, dynamic_require_count);
            }
            if let Some(condition) = &for_statement.condition {
                collect_require_edges_from_expression(
                    condition,
                    &for_statement.span,
                    imports,
                    dynamic_require_count,
                );
            }
            if let Some(update) = &for_statement.update {
                collect_require_edges_from_expression(
                    update,
                    &for_statement.span,
                    imports,
                    dynamic_require_count,
                );
            }
            collect_require_edges_from_statement(
                &for_statement.body,
                imports,
                dynamic_require_count,
            );
        }
        Statement::While(while_statement) => {
            collect_require_edges_from_expression(
                &while_statement.condition,
                &while_statement.span,
                imports,
                dynamic_require_count,
            );
            collect_require_edges_from_statement(
                &while_statement.body,
                imports,
                dynamic_require_count,
            );
        }
        Statement::With(with_statement) => {
            collect_require_edges_from_expression(
                &with_statement.object,
                &with_statement.span,
                imports,
                dynamic_require_count,
            );
            collect_require_edges_from_statement(
                &with_statement.body,
                imports,
                dynamic_require_count,
            );
        }
        Statement::DoWhile(do_while) => {
            collect_require_edges_from_statement(
                &do_while.body,
                imports,
                dynamic_require_count,
            );
            collect_require_edges_from_expression(
                &do_while.condition,
                &do_while.span,
                imports,
                dynamic_require_count,
            );
        }
        Statement::Return(return_statement) => {
            if let Some(argument) = &return_statement.argument {
                collect_require_edges_from_expression(
                    argument,
                    &return_statement.span,
                    imports,
                    dynamic_require_count,
                );
            }
        }
        Statement::Throw(throw_statement) => collect_require_edges_from_expression(
            &throw_statement.argument,
            &throw_statement.span,
            imports,
            dynamic_require_count,
        ),
        Statement::TryCatch(try_statement) => {
            for statement in &try_statement.block.body {
                collect_require_edges_from_statement(statement, imports, dynamic_require_count);
            }
            if let Some(handler) = &try_statement.handler {
                for statement in &handler.body.body {
                    collect_require_edges_from_statement(
                        statement,
                        imports,
                        dynamic_require_count,
                    );
                }
            }
            if let Some(finalizer) = &try_statement.finalizer {
                for statement in &finalizer.body {
                    collect_require_edges_from_statement(
                        statement,
                        imports,
                        dynamic_require_count,
                    );
                }
            }
        }
        Statement::Switch(switch_statement) => {
            collect_require_edges_from_expression(
                &switch_statement.discriminant,
                &switch_statement.span,
                imports,
                dynamic_require_count,
            );
            for case in &switch_statement.cases {
                if let Some(test) = &case.test {
                    collect_require_edges_from_expression(
                        test,
                        &case.span,
                        imports,
                        dynamic_require_count,
                    );
                }
                for statement in &case.consequent {
                    collect_require_edges_from_statement(
                        statement,
                        imports,
                        dynamic_require_count,
                    );
                }
            }
        }
        Statement::FunctionDeclaration(function) => {
            for param in &function.params {
                collect_require_edges_from_pattern(
                    &param.pattern,
                    &param.span,
                    imports,
                    dynamic_require_count,
                );
            }
            for statement in &function.body.body {
                collect_require_edges_from_statement(statement, imports, dynamic_require_count);
            }
        }
        Statement::ClassDeclaration(class) => {
            if let Some(super_class) = &class.super_class {
                collect_require_edges_from_expression(
                    super_class,
                    &class.span,
                    imports,
                    dynamic_require_count,
                );
            }
            for method in &class.body {
                if method.computed {
                    collect_require_edges_from_expression(
                        &method.key,
                        &method.span,
                        imports,
                        dynamic_require_count,
                    );
                }
                for param in &method.params {
                    collect_require_edges_from_pattern(
                        &param.pattern,
                        &param.span,
                        imports,
                        dynamic_require_count,
                    );
                }
                for statement in &method.body.body {
                    collect_require_edges_from_statement(
                        statement,
                        imports,
                        dynamic_require_count,
                    );
                }
            }
        }
        Statement::ForIn(for_in) => {
            collect_require_edges_from_pattern(
                &for_in.binding,
                &for_in.span,
                imports,
                dynamic_require_count,
            );
            collect_require_edges_from_expression(
                &for_in.object,
                &for_in.span,
                imports,
                dynamic_require_count,
            );
            collect_require_edges_from_statement(&for_in.body, imports, dynamic_require_count);
        }
        Statement::ForOf(for_of) => {
            collect_require_edges_from_pattern(
                &for_of.binding,
                &for_of.span,
                imports,
                dynamic_require_count,
            );
            collect_require_edges_from_expression(
                &for_of.iterable,
                &for_of.span,
                imports,
                dynamic_require_count,
            );
            collect_require_edges_from_statement(&for_of.body, imports, dynamic_require_count);
        }
        Statement::Labeled(labeled) => {
            collect_require_edges_from_statement(&labeled.body, imports, dynamic_require_count);
        }
    }
}


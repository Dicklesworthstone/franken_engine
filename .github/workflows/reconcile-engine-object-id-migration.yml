name: EngineObjectId Migration Reconciliation

on:
  push:
    branches: [main]
    paths: [.github/workflows/reconcile-engine-object-id-migration.yml]

permissions:
  contents: write

jobs:
  depth-repair:
    if: >-
      contains(github.event.head_commit.message, 'work(runtime): verify shared callback depth')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: nightly
      CARGO_INCREMENTAL: 0
      CARGO_BUILD_JOBS: 1
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8ef701b2eac4772d270ad9686cc349b2e7fb9d44
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt,clippy
      - name: Prepare exact source and locked native harness
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,hashlib,json,os,pathlib,subprocess,urllib.request
          expected='0a8d3f24333a6e2b257cf5d0f2aacbf4914e2a2c'
          url='https://api.github.com/repos/Dicklesworthstone/franken_engine/git/blobs/'+expected
          req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'User-Agent':'OpenAI File Downloader, XaiImageApiFetch/1.0'})
          with urllib.request.urlopen(req,timeout=90) as r:data=base64.b64decode(json.load(r)['content'])
          assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==expected
          script=pathlib.Path(os.environ['RUNNER_TEMP'])/'depth-driver.py'
          script.write_bytes(data)
          subprocess.run(['python3',str(script),'prepare'],check=True)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: depth-repair-prepared
          path: |
            ${{ runner.temp }}/depth-repair/files.json
            ${{ runner.temp }}/depth-repair/repair.patch
          retention-days: 2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: native-iterator-standalone
          cache-on-failure: true
      - name: Execute unchanged stack abort and small-stack regression probes
        run: python3 "$RUNNER_TEMP/depth-driver.py" test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: depth-repair-native-results
          path: |
            ${{ runner.temp }}/depth-repair/*.log
            ${{ runner.temp }}/depth-repair/status.json
          retention-days: 2

name: RegExp Exec Live Source Inspection

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/reconcile-engine-object-id-migration.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Print RegExp execution seams
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/franken-engine/src/baseline_interpreter.rs')
          lines = path.read_text().splitlines()
          needles = [
              'RegExpPrototypeTest',
              'fn regexp_test_value',
              'fn alloc_match_result_array',
              'fn compile_regexp_pattern',
              'REGEXP_TYPE_NAME',
              'BuiltinId::RegExpPrototypeTest',
          ]
          emitted = set()
          for needle in needles:
              for idx, line in enumerate(lines):
                  if needle in line:
                      start = max(0, idx - 45)
                      end = min(len(lines), idx + 130)
                      key = (start, end)
                      if key in emitted:
                          continue
                      emitted.add(key)
                      print(f'===== {needle} @ line {idx + 1} =====')
                      for n in range(start, end):
                          print(f'{n + 1:06d}: {lines[n]}')
                      break
          PY

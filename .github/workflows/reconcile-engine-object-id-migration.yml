name: CommonJS Package Graph Integration Retry

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/reconcile-engine-object-id-migration.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: nightly
      CARGO_INCREMENTAL: 0
      CARGO_BUILD_JOBS: 1
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: package-intake-cjs-graph
          cache-on-failure: true
      - name: Wire static CommonJS require edges into package intake
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d | gzip -d > /tmp/cjs_patch.py
          python3 /tmp/cjs_patch.py
          rustfmt --edition 2024 crates/franken-engine/src/package_intake.rs
          cargo test --no-default-features -p frankenengine-engine --lib package_intake::tests::commonjs_literal_require_is_followed_as_a_real_graph_edge -- --nocapture
          cargo test --no-default-features -p frankenengine-engine --lib package_intake::tests::commonjs_bare_literal_require_is_reported_as_external_dependency -- --nocapture
          cargo test --no-default-features -p frankenengine-engine --lib package_intake::tests::dynamic_commonjs_require_bounds_coverage_without_inventing_an_edge -- --nocapture
          cargo test --no-default-features -p frankenengine-engine --lib package_intake::tests::clean_two_module_package_has_empty_footprint_and_resolves_in_all_modes -- --nocapture
          cargo check --no-default-features -p frankenengine-engine --lib
          git diff --check
          git config user.name 'Jeff Emanuel'
          git config user.email '35050222+Dicklesworthstone@users.noreply.github.com'
          git add crates/franken-engine/src/package_intake.rs
          git commit -m 'feat(modules): follow static CommonJS require edges in package intake'
          git fetch origin main
          if [[ "$(git rev-parse HEAD^)" != "$(git rev-parse origin/main)" ]]; then
            git rebase origin/main
            cargo test --no-default-features -p frankenengine-engine --lib package_intake::tests::commonjs_literal_require_is_followed_as_a_real_graph_edge -- --nocapture
            cargo test --no-default-features -p frankenengine-engine --lib package_intake::tests::dynamic_commonjs_require_bounds_coverage_without_inventing_an_edge -- --nocapture
            cargo check --no-default-features -p frankenengine-engine --lib
          fi
          git push origin HEAD:main

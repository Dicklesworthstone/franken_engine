name: EngineObjectId Migration Reconciliation

on:
  push:
    branches: [main]
    paths: [.github/workflows/reconcile-engine-object-id-migration.yml]

permissions:
  contents: read

jobs:
  prepare:
    if: >-
      github.repository == 'Dicklesworthstone/franken_engine' && github.event.head_commit.message == 'work(iterator): validate lazy iterator-backed array pattern lowering'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          clean: false
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: nightly
          components: rustfmt, clippy
      - name: Apply exact lowering patch and publish immutable source blobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64,gzip,hashlib,json,os,pathlib,subprocess,urllib.request
          root='https://api.github.com/repos/Dicklesworthstone/franken_engine'
          def api(path,body=None):
              request=urllib.request.Request(root+path,data=None if body is None else json.dumps(body).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Content-Type':'application/json','User-Agent':'OpenAI File Downloader, XaiImageApiFetch/1.0'})
              with urllib.request.urlopen(request,timeout=90) as response:
                  return json.load(response)
          def digest(data):
              return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          source='crates/franken-engine/src/lowering_pipeline.rs'
          test='crates/franken-engine/tests/iterator_destructuring_regression.rs'
          assert digest(pathlib.Path(source).read_bytes())=='83504bfa69bd966ed95ac2a3f2bab91f227bd3c1'
          assert not pathlib.Path(test).exists()
          blob=api('/git/blobs/8d2375bfe67e52c27b3ab975cc1d950a9fff23e0')
          compressed=base64.b64decode(blob['content'])
          assert digest(compressed)=='8d2375bfe67e52c27b3ab975cc1d950a9fff23e0'
          patch=gzip.decompress(compressed)
          assert digest(patch)=='fbe423e4ad021eb2d808251a76f8bf95467c7ff5'
          paths=[source,test]
          subprocess.run(['git','apply','--check','--index','--whitespace=error-all'],input=patch,check=True)
          subprocess.run(['git','apply','--index','--whitespace=error-all'],input=patch,check=True)
          actual=subprocess.check_output(['git','diff','--cached','--name-only']).decode().splitlines()
          assert set(actual)==set(paths),actual
          subprocess.run(['rustfmt','--edition','2024','--config','skip_children=true','--emit','stdout',source],stdout=subprocess.DEVNULL,check=True)
          subprocess.run(['rustfmt','--edition','2024',test],check=True)
          subprocess.run(['git','add','--',test],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          files=[]
          for path in paths:
              data=pathlib.Path(path).read_bytes()
              result=api('/git/blobs',{'encoding':'base64','content':base64.b64encode(data).decode()})
              assert result['sha']==digest(data)
              files.append({'path':path,'sha':result['sha']})
          manifest={'base':os.environ['GITHUB_SHA'],'files':files}
          pathlib.Path(os.environ['RUNNER_TEMP'],'iterator-lowering-prepared.json').write_text(json.dumps(manifest))
          print('PREPARED_FILES='+json.dumps(manifest),flush=True)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: iterator-lowering-prepared
          path: ${{ runner.temp }}/iterator-lowering-prepared.json
          retention-days: 2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: native-iteration-validation
          cache-on-failure: true
      - name: Execute native destructuring and loop regressions
        run: |
          set +e
          cargo test --locked -p frankenengine-engine --no-fail-fast --test iterator_destructuring_regression --test destructuring_default_branch_regression --test destructuring_nested_rest_regression --test destructuring_assignment_bd_umee4 --test for_of_destructuring_lowering_conformance --test for_of_iterator_throw_regression > "$RUNNER_TEMP/iterator-lowering-tests.log" 2>&1
          status=$?
          tail -n 200 "$RUNNER_TEMP/iterator-lowering-tests.log"
          exit "$status"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: iterator-lowering-tests
          path: ${{ runner.temp }}/iterator-lowering-tests.log
          retention-days: 2
      - name: Compiler gate
        if: ${{ !cancelled() }}
        run: |
          set +e
          timeout 900 cargo check --locked --all-targets > "$RUNNER_TEMP/iterator-lowering-check.log" 2>&1
          status=$?
          tail -n 60 "$RUNNER_TEMP/iterator-lowering-check.log"
          exit "$status"
      - name: Clippy gate
        if: ${{ !cancelled() }}
        run: |
          set +e
          timeout 900 cargo clippy --locked --all-targets -- -D warnings > "$RUNNER_TEMP/iterator-lowering-clippy.log" 2>&1
          status=$?
          tail -n 60 "$RUNNER_TEMP/iterator-lowering-clippy.log"
          exit "$status"
      - name: Formatting gate
        if: ${{ !cancelled() }}
        run: |
          set +e
          cargo fmt --check > "$RUNNER_TEMP/iterator-lowering-fmt.log" 2>&1
          status=$?
          tail -n 30 "$RUNNER_TEMP/iterator-lowering-fmt.log"
          exit "$status"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: iterator-lowering-gates
          path: ${{ runner.temp }}/iterator-lowering-*.log
          retention-days: 2

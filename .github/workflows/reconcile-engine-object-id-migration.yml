name: React Runtime Graph Verification Integration

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/reconcile-engine-object-id-migration.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: nightly
      CARGO_INCREMENTAL: 0
      CARGO_BUILD_JOBS: 1
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: react-runtime-graph-verification
          cache-on-failure: true
      - name: Wire deterministic React graph receipts into compatibility validation
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d | gzip -d > /tmp/react_graph_patch.py
          python3 /tmp/react_graph_patch.py
          rustfmt --edition 2024 crates/franken-engine/src/react_ecosystem_compatibility.rs crates/franken-engine/tests/react_ecosystem_compatibility_integration.rs
          cargo test --no-default-features -p frankenengine-engine --test react_ecosystem_compatibility_integration validator_emits_ssr_module_graph_receipt_for_server_pattern -- --nocapture
          cargo test --no-default-features -p frankenengine-engine --test react_ecosystem_compatibility_integration validator_emits_both_graph_receipts_for_hybrid_pattern -- --nocapture
          cargo test --no-default-features -p frankenengine-engine react_ecosystem_compatibility::tests --lib -- --nocapture
          cargo check --no-default-features -p frankenengine-engine --lib
          git diff --check
          git config user.name 'Jeff Emanuel'
          git config user.email '35050222+Dicklesworthstone@users.noreply.github.com'
          git add crates/franken-engine/src/react_ecosystem_compatibility.rs crates/franken-engine/tests/react_ecosystem_compatibility_integration.rs
          git commit -m 'feat(react): verify runtime module graphs in ecosystem gate'
          git fetch origin main
          if [[ "$(git rev-parse HEAD^)" != "$(git rev-parse origin/main)" ]]; then
            git rebase origin/main
            cargo test --no-default-features -p frankenengine-engine --test react_ecosystem_compatibility_integration validator_emits_ssr_module_graph_receipt_for_server_pattern -- --nocapture
            cargo test --no-default-features -p frankenengine-engine --test react_ecosystem_compatibility_integration validator_emits_both_graph_receipts_for_hybrid_pattern -- --nocapture
            cargo check --no-default-features -p frankenengine-engine --lib
          fi
          git push origin HEAD:main

name: Recursive Generator Consumer Diagnostic

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/reconcile-engine-object-id-migration.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: nightly
      CARGO_INCREMENTAL: 0
      CARGO_BUILD_JOBS: 1
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: native-iterator-standalone
          cache-on-failure: true
      - name: Instrument exact recursive-consumer result
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('crates/franken-engine/tests/generator_next_bd_v6cv1_regression.rs')
          s=p.read_text()
          old='''                assert!(matches!(\n                    core.execute(&module),\n                    Err(InterpreterError::StackOverflow { max: 8, .. })\n                ));'''
          new='''                let outcome = core.execute(&module);\n                assert!(\n                    matches!(outcome, Err(InterpreterError::StackOverflow { max: 8, .. })),\n                    "unexpected recursive iterator-consumer outcome: {outcome:?}"\n                );'''
          if s.count(old) != 1:
              raise SystemExit(f'expected one assertion block, found {s.count(old)}')
          p.write_text(s.replace(old,new,1))
          PY
          cargo test --no-default-features -p frankenengine-engine --test generator_next_bd_v6cv1_regression iterator_consumers_refuse_recursive_generators_without_native_stack_abort -- --nocapture

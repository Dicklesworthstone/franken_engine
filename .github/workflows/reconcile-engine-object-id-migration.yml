name: EngineObjectId Migration Reconciliation

on:
  push:
    branches: [main]
    paths: [.github/workflows/reconcile-engine-object-id-migration.yml]

permissions:
  contents: read

jobs:
  iterator-source:
    if: >-
      contains(github.event.head_commit.message, 'work(iterator): obtain complete native sources')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Export exact sources for iterator implementation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/iterator-source
          git rev-parse HEAD > /tmp/iterator-source/revision.txt
          git archive --format=tar.gz HEAD AGENTS.md README.md Cargo.toml Cargo.lock crates .beads docs/plans .github/workflows .cargo > /tmp/iterator-source/source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: iterator-source
          path: /tmp/iterator-source
          retention-days: 2
          if-no-files-found: error

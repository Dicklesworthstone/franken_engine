name: RegExp Unicode Property Live Probe

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/reconcile-engine-object-id-migration.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: nightly
      CARGO_INCREMENTAL: 0
      CARGO_BUILD_JOBS: 1
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: regexp-unicode-probe
      - name: Probe HybridRouter Unicode-property behavior
        shell: bash
        run: |
          set -euo pipefail
          cat > crates/franken-engine/tests/regexp_unicode_live_probe.rs <<'RS'
          use frankenengine_engine::HybridRouter;

          fn eval(source: &str) -> String {
              let mut engine = HybridRouter::default();
              match engine.eval(source) {
                  Ok(outcome) => outcome.value,
                  Err(error) => format!("ERR:{error}"),
              }
          }

          #[test]
          fn print_live_unicode_property_results() {
              let cases = [
                  ("letter-short", r#"/\p{L}+/u.test("é")"#),
                  ("uppercase-short", r#"/\p{Lu}+/u.test("A")"#),
                  ("general-category", r#"/\p{General_Category=Uppercase_Letter}+/u.test("A")"#),
                  ("script", r#"/\p{Script=Greek}+/u.test("Ω")"#),
                  ("script-extensions", r#"/\p{Script_Extensions=Hiragana}+/u.test("あ")"#),
                  ("binary-ascii", r#"/\p{ASCII}+/u.test("ABC")"#),
                  ("binary-whitespace", r#"/\p{White_Space}+/u.test(" ")"#),
                  ("negated-letter", r#"/\P{L}+/u.test("123")"#),
                  ("legacy-without-u-on-A", r#"/\p{L}/.test("A")"#),
                  ("legacy-without-u-literal", r#"/\p{L}/.test("p{L}")"#),
              ];
              for (name, source) in cases {
                  println!("PROBE {name} => {}", eval(source));
              }
          }
          RS
          cargo test --no-default-features -p frankenengine-engine --test regexp_unicode_live_probe -- --nocapture

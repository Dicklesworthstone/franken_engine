name: Red-Team Corpus Contract Digest Reconciliation

on:
  push:
    branches:
      - main
    paths:
      - scripts/maintenance/reconcile_red_team_contract_digest.py
      - .github/workflows/reconcile-red-team-contract-digest.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: red-team-contract-digest-reconciliation
  cancel-in-progress: false

jobs:
  reconcile:
    name: Patch, validate, and publish digest-bound Rust surfaces
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: nightly
      CARGO_INCREMENTAL: 0
      CARGO_BUILD_JOBS: 1
    steps:
      - name: Checkout full main history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: red-team-contract-digest-reconciliation

      - name: Reconcile latest main with bounded fast-forward retries
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "franken-engine-evidence-bot"
          git config user.email "35050222+Dicklesworthstone@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main

            python3 -m py_compile \
              scripts/maintenance/reconcile_red_team_contract_digest.py \
              scripts/red_team_scenario_corpus_contract.py \
              scripts/red_team_compromise_rate_corpus.py \
              scripts/annotate_red_team_harness_semantics.py \
              scripts/red_team_scenario_corpus_harness.py \
              scripts/e2e/red_team_scenario_corpus_scope_smoke.py
            python3 scripts/maintenance/reconcile_red_team_contract_digest.py --write
            python3 scripts/maintenance/reconcile_red_team_contract_digest.py --check
            python3 scripts/e2e/red_team_scenario_corpus_scope_smoke.py
            rustfmt --check --edition 2024 \
              crates/franken-engine/src/bin/franken_red_team_harness_gate.rs \
              crates/franken-engine/tests/red_team_harness_gate_cli.rs
            cargo test --no-default-features -p frankenengine-engine \
              --bin franken_red_team_harness_gate
            cargo test --no-default-features -p frankenengine-engine \
              --test red_team_harness_gate_cli
            git diff --check

            if git diff --quiet; then
              echo "corpus digest binding was already reconciled"
              exit 0
            fi

            git add \
              crates/franken-engine/src/bin/franken_red_team_harness_gate.rs \
              crates/franken-engine/tests/red_team_harness_gate_cli.rs \
              scripts/e2e/red_team_scenario_corpus_scope_smoke.py
            git commit -m "feat(evidence): bind corpus digest through Rust verdict gate (bd-1vwza)"

            if git push origin HEAD:main; then
              exit 0
            fi
            echo "main advanced during digest reconciliation attempt ${attempt}; retrying" >&2
          done

          echo "unable to publish corpus digest reconciliation after bounded retries" >&2
          exit 1

name: Red-Team Scenario-Corpus Stability Gate

on:
  push:
    branches:
      - main
    paths:
      - docs/red_team_scenario_corpus_v2.json
      - crates/franken-engine/src/bin/franken_red_team_harness_gate.rs
      - crates/franken-engine/src/red_team_compromise_rate_metric_gate.rs
      - crates/franken-engine/tests/red_team_harness_gate_cli.rs
      - crates/franken-engine/tests/fixtures/red_team_harness_output_v1.json
      - crates/franken-engine/tests/red_team_scenarios/**
      - scripts/red_team_compromise_rate_metric.py
      - scripts/red_team_scenario_corpus_contract.py
      - scripts/red_team_compromise_rate_corpus.py
      - scripts/red_team_trial_common.py
      - scripts/red_team_trial_reader.py
      - scripts/aggregate_red_team_trials.py
      - scripts/annotate_red_team_harness_semantics.py
      - scripts/red_team_scenario_corpus_harness.py
      - scripts/run_bd_28otw_attacker_harness.sh
      - scripts/e2e/red_team_repeated_trial_harness_smoke.sh
      - scripts/e2e/red_team_scenario_corpus_scope_smoke.py
      - .github/workflows/red-team-repeated-trial-gate.yml
  pull_request:
    paths:
      - docs/red_team_scenario_corpus_v2.json
      - crates/franken-engine/src/bin/franken_red_team_harness_gate.rs
      - crates/franken-engine/src/red_team_compromise_rate_metric_gate.rs
      - crates/franken-engine/tests/red_team_harness_gate_cli.rs
      - crates/franken-engine/tests/fixtures/red_team_harness_output_v1.json
      - crates/franken-engine/tests/red_team_scenarios/**
      - scripts/red_team_compromise_rate_metric.py
      - scripts/red_team_scenario_corpus_contract.py
      - scripts/red_team_compromise_rate_corpus.py
      - scripts/red_team_trial_common.py
      - scripts/red_team_trial_reader.py
      - scripts/aggregate_red_team_trials.py
      - scripts/annotate_red_team_harness_semantics.py
      - scripts/red_team_scenario_corpus_harness.py
      - scripts/run_bd_28otw_attacker_harness.sh
      - scripts/e2e/red_team_repeated_trial_harness_smoke.sh
      - scripts/e2e/red_team_scenario_corpus_scope_smoke.py
      - .github/workflows/red-team-repeated-trial-gate.yml

permissions:
  contents: read

concurrency:
  group: red-team-scenario-corpus-stability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  producer-contract:
    name: Corpus, receipt, and semantic producer contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile Python producers and drills
        run: |
          python3 -m py_compile \
            scripts/red_team_compromise_rate_metric.py \
            scripts/red_team_scenario_corpus_contract.py \
            scripts/red_team_compromise_rate_corpus.py \
            scripts/red_team_trial_common.py \
            scripts/red_team_trial_reader.py \
            scripts/aggregate_red_team_trials.py \
            scripts/annotate_red_team_harness_semantics.py \
            scripts/red_team_scenario_corpus_harness.py \
            scripts/e2e/red_team_scenario_corpus_scope_smoke.py

      - name: Load authoritative corpus contract
        run: |
          python3 - <<'PY'
          import sys
          sys.path.insert(0, "scripts")
          from red_team_scenario_corpus_contract import CONTRACT
          assert len(CONTRACT.scenarios) == 10
          assert CONTRACT.runtime_scenario_pair_count == 30
          assert CONTRACT.required_stability_repetitions_per_runtime_scenario == 100
          print(f"corpus_contract={CONTRACT.corpus_id}")
          PY

      - name: Parse shell runners
        run: |
          bash -n scripts/run_bd_28otw_attacker_harness.sh
          bash -n scripts/e2e/red_team_repeated_trial_harness_smoke.sh

      - name: Execute proof-class and scope drills
        run: python3 scripts/e2e/red_team_scenario_corpus_scope_smoke.py

      - name: Execute hermetic receipt, replay, and tamper drills
        run: bash scripts/e2e/red_team_repeated_trial_harness_smoke.sh

  rust-gate:
    name: Rust scenario-corpus conversion and decision gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: nightly
      CARGO_INCREMENTAL: 0
      CARGO_BUILD_JOBS: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: red-team-scenario-corpus-stability-gate

      - name: Check focused formatting
        run: |
          rustfmt --check --edition 2024 \
            crates/franken-engine/src/bin/franken_red_team_harness_gate.rs \
            crates/franken-engine/tests/red_team_harness_gate_cli.rs

      - name: Test binary unit contract
        run: >-
          cargo test --no-default-features -p frankenengine-engine
          --bin franken_red_team_harness_gate

      - name: Test CLI integration contract
        run: >-
          cargo test --no-default-features -p frankenengine-engine
          --test red_team_harness_gate_cli

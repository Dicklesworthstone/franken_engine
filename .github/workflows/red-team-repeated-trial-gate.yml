name: Red-Team Repeated-Trial Gate

on:
  push:
    branches:
      - main
    paths:
      - crates/franken-engine/src/bin/franken_red_team_harness_gate.rs
      - crates/franken-engine/src/red_team_compromise_rate_metric_gate.rs
      - crates/franken-engine/tests/red_team_harness_gate_cli.rs
      - crates/franken-engine/tests/fixtures/red_team_harness_output_v1.json
      - .github/workflows/red-team-repeated-trial-gate.yml
  pull_request:
    paths:
      - crates/franken-engine/src/bin/franken_red_team_harness_gate.rs
      - crates/franken-engine/src/red_team_compromise_rate_metric_gate.rs
      - crates/franken-engine/tests/red_team_harness_gate_cli.rs
      - crates/franken-engine/tests/fixtures/red_team_harness_output_v1.json
      - .github/workflows/red-team-repeated-trial-gate.yml

permissions:
  contents: read

concurrency:
  group: red-team-repeated-trial-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-gate:
    name: Rust harness conversion and decision gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: nightly
      CARGO_INCREMENTAL: 0
      CARGO_BUILD_JOBS: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: red-team-repeated-trial-gate

      - name: Check focused formatting
        run: |
          rustfmt --check --edition 2024 \
            crates/franken-engine/src/bin/franken_red_team_harness_gate.rs \
            crates/franken-engine/tests/red_team_harness_gate_cli.rs

      - name: Test binary unit contract
        run: >-
          cargo test --no-default-features -p frankenengine-engine
          --bin franken_red_team_harness_gate

      - name: Test CLI integration contract
        run: >-
          cargo test --no-default-features -p frankenengine-engine
          --test red_team_harness_gate_cli

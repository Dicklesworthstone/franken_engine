[workspace]
members = [
  "crates/franken-engine",
  "crates/franken-engine-test-support",
  "crates/franken-extension-host",
  "crates/franken-metamorphic",
]
# NOTE: crates/franken-core is an in-progress modularization effort. Its
# standalone manifest is compileable, but the crate remains excluded until a
# deliberate workspace integration pass validates the extracted API boundary.
exclude = ["crates/franken-core"]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"
authors = ["Franken Engine Contributors"]
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[patch.crates-io]
fsqlite = { path = "/dp/frankensqlite/crates/fsqlite" }
fsqlite-core = { path = "/dp/frankensqlite/crates/fsqlite-core" }
fsqlite-types = { path = "/dp/frankensqlite/crates/fsqlite-types" }
fsqlite-error = { path = "/dp/frankensqlite/crates/fsqlite-error" }

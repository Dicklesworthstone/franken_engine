[workspace]
members = [
  "crates/franken-engine",
  "crates/franken-engine-test-support",
  "crates/franken-extension-host",
  "crates/franken-metamorphic",
]
# NOTE: crates/franken-core is an in-progress modularization effort (cb049273)
# that does not yet compile (missing modules: object_model, promise_model,
# profiling, control_plane, trust_zone). Temporarily excluded from the
# workspace so the rest of the tree tests green. Re-add once the extraction
# lands its follow-up fixes.
exclude = ["crates/franken-core"]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"
authors = ["Franken Engine Contributors"]
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[patch.crates-io]
fsqlite = { path = "/dp/frankensqlite/crates/fsqlite" }
fsqlite-core = { path = "/dp/frankensqlite/crates/fsqlite-core" }
fsqlite-types = { path = "/dp/frankensqlite/crates/fsqlite-types" }
fsqlite-error = { path = "/dp/frankensqlite/crates/fsqlite-error" }

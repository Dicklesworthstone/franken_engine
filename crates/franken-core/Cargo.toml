[package]
name = "frankenengine-core"
version = "0.1.0"
edition = "2024"
description = "Core runtime modules for the FrankenEngine JavaScript runtime"
license = "MIT"

[features]
default = []
asupersync-integration = []

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hmac = "0.12"
ed25519-dalek = "2.0"
rand = "0.8"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
uuid = { version = "1.16", features = ["v7", "serde"] }
toml = "0.8"
frankenengine-extension-host = { path = "../franken-extension-host" }

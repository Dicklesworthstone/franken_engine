[package]
name = "frankenengine-core"
version = "0.3.0"
edition = "2024"
description = "Core runtime modules for the FrankenEngine JavaScript runtime"
license = "LicenseRef-MIT-OpenAI-Anthropic-Rider"
repository.workspace = true

[features]
default = []
asupersync-integration = [
    "dep:franken-kernel",
    "dep:franken-decision",
    "dep:franken-evidence",
]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hmac = "0.12"
ed25519-dalek = "2.0"
rand = "0.8"
ryu-js = "1.0"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
thiserror.workspace = true
unicode-id-start = "1.4"
toml = "1"
frankenengine-extension-host = { path = "../franken-extension-host" }
franken-kernel = { version = "0.5.0", optional = true }
franken-decision = { version = "0.5.0", optional = true }
franken-evidence = { version = "0.5.0", optional = true }

[dev-dependencies]
proptest = "1.0"

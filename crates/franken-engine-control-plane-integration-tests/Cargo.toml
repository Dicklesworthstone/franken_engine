[package]
name = "frankenengine-control-plane-integration-tests"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false
autotests = false

[lib]
path = "src/lib.rs"

[features]
# Preserve the public Buffer target's original engine-default coverage.
# Standalone callers explicitly disable this forwarding feature.
default = ["engine-defaults"]
engine-defaults = ["frankenengine-engine/default"]

# Compile the moved integration tests from their original
# crate-root files. The local tests/ shims use include! for discoverability, but
# include! cannot preserve crate-root inner attributes from the source files.
[[test]]
name = "buffer_value_bd_9vouw_104"
path = "../franken-engine/tests/buffer_value_bd_9vouw_104.rs"

[[test]]
name = "cancellation_lifecycle_integration"
path = "../franken-engine/tests/cancellation_lifecycle_integration.rs"


[dev-dependencies]
# `default-features = false` keeps the /dp sibling crates out of a
# `--workspace --no-default-features` build; without it this edge re-enables
# the engine's default features and drags all nine siblings back in
# (bd-ndpm2). This crate uses no sibling-gated engine API. The asupersync
# control-plane integration is requested explicitly because these tests do
# exercise it. The fleet-quarantine target also needs the non-authoritative
# TEE simulator; enable it here, outside the engine's own dev graph. The
# package's default forwarding above adds engine defaults only when selected;
# --no-default-features retains this explicit Asupersync/mock-TEE subset.
frankenengine-engine = { path = "../franken-engine", default-features = false, features = [
    "asupersync-integration",
    "tee-test-mock",
] }
frankenengine-test-support = { path = "../franken-engine-test-support" }
chrono = { version = "0.4", features = ["serde"] }
insta = { version = "1.39", features = ["filters"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

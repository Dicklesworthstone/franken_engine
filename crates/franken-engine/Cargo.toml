[package]
name = "frankenengine-engine"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[[bin]]
name = "franken-react-sidecar"
path = "src/bin/franken_react_sidecar.rs"

[[bin]]
name = "franken-benchmark-evidence-export"
path = "src/bin/franken_benchmark_evidence_export.rs"

[features]
default = ["asupersync-integration"]
asupersync-integration = [
    "dep:franken-kernel",
    "dep:franken-decision",
    "dep:franken-evidence",
]

[dependencies]
# NOTE: frankenengine-core dependency temporarily removed — franken-core crate
# is mid-modularization (cb049273) and does not yet compile. franken-engine
# does not reference any frankenengine_core:: paths, so the dep is currently
# unused. Re-add once the extraction stabilizes.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hmac = "0.12"
ed25519-dalek = "2.0"
rand = "0.8"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
uuid = { version = "1.16", features = ["v7", "serde"] }
toml = "0.8"
clap = "4.5"
frankenengine-extension-host = { path = "../franken-extension-host" }
franken-kernel = { path = "/dp/asupersync/franken_kernel", optional = true }
franken-decision = { path = "/dp/asupersync/franken_decision", optional = true }
franken-evidence = { path = "/dp/asupersync/franken_evidence", optional = true }

[dev-dependencies]
frankenengine-test-support = { path = "../franken-engine-test-support" }
tempfile = "3"

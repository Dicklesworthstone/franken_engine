[package]
name = "frankenengine-engine"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[[bin]]
name = "franken-react-sidecar"
path = "src/bin/franken_react_sidecar.rs"

[[bin]]
name = "franken-benchmark-evidence-export"
path = "src/bin/franken_benchmark_evidence_export.rs"

[[bin]]
name = "franken-architecture-inventory"
path = "src/bin/franken_architecture_inventory.rs"

[features]
default = ["asupersync-integration"]
asupersync-integration = [
    "dep:franken-kernel",
    "dep:franken-decision",
    "dep:franken-evidence",
]
certified_rewrite_optimizer_integration = []
# Opt-in re-enable of the baseline_interpreter in-source #[cfg(test)] module
# that references a legacy lower-level API (`BaselineInterpreter::new`,
# `Ir3Instruction::CallBuiltin{,Id}`, `execute_instruction`, `set_register`,
# `test_ir3_module`, etc.). The module was broken at merge-base into main and
# is tracked by bd-2j7uk; gating it keeps the lib-test target compilable while
# the repair effort is pending. Enable with `--features legacy_lib_tests_bd_2j7uk`
# to attempt to compile the legacy tests.
legacy_lib_tests_bd_2j7uk = []

[dependencies]
# NOTE: frankenengine-core dependency temporarily removed — franken-core crate
# is mid-modularization (cb049273) and does not yet compile. franken-engine
# does not reference any frankenengine_core:: paths, so the dep is currently
# unused. Re-add once the extraction stabilizes.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
proc-macro2 = { version = "1.0", features = ["span-locations"] }
sha2 = "0.10"
subtle = "2.6"
hmac = "0.12"
ed25519-dalek = "2.0"
rand = "0.8"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
uuid = { version = "1.16", features = ["v7", "serde"] }
syn = { version = "2.0", features = ["full", "visit"] }
toml = "0.8"
clap = "4.5"
frankenengine-extension-host = { path = "../franken-extension-host" }
franken-kernel = { version = "0.3.1", optional = true }
franken-decision = { version = "0.3.1", optional = true }
franken-evidence = { version = "0.3.1", optional = true }

[dev-dependencies]
frankenengine-test-support = { path = "../franken-engine-test-support" }
tempfile = "3"
proptest = "1.6"
regex = "1.0"

[features]
default = [
    "asupersync-integration",
    "sibling-persistence",
    "sibling-service-api",
    "sibling-dataframes",
]
asupersync-integration = [
    "dep:franken-kernel",
    "dep:franken-decision",
    "dep:franken-evidence",
]
# The three features below gate every optional sibling registry dependency, so
# `--no-default-features` is a genuine no-siblings build (bd-ndpm2, bd-gw4cg).
#
# Each is ON by default: a normal `cargo build` consumes the published sibling
# crates without requiring their `/dp` source checkouts. Turning one OFF removes
# that family from the dependency graph entirely and compiles out the consuming
# surface. Nothing is stubbed or simulated — the affected API simply does not
# exist, and the one runtime path that would otherwise silently degrade (Parquet
# evidence export) fails closed with a typed error instead of emitting a lesser
# artifact under the same name.

# sqlmodel_rust typed persistence, and through it frankensqlite.
# `cargo tree -e normal -i fsqlite` shows sqlmodel-frankensqlite is the *only*
# edge that pulls fsqlite, so clearing this feature drops both families at once.
# Gates: typed_persistence_models typed-session API, storage_adapter's
# FleetTrustStateFrankensqliteBackend and FleetAuthoritySql-for-transaction impl.
sibling-persistence = [
    "dep:sqlmodel",
    "dep:sqlmodel-core",
    "dep:sqlmodel-frankensqlite",
]
# fastapi_rust service/API control surface (ADR-0002).
# Gates: policy_controller::service_endpoint_template.
sibling-service-api = ["dep:fastapi-core"]
# frankenpandas evidence-frame primitives.
# Gates: the Parquet evidence-export path in governance_hooks.
sibling-dataframes = [
    "dep:fp-io",
    "dep:fp-frame",
    "dep:fp-columnar",
    "dep:fp-index",
    "dep:fp-types",
]
certified_rewrite_optimizer_integration = []
native-capsule-fixed-probe = [
    "dep:franken-native-capsule-worker",
    "dep:frankenengine-native-capsule",
    "dep:frankenengine-native-capsule-api",
    "frankenengine-native-capsule/embedded-fixed-probe",
]
# Do not enable this feature in normal engine validation. The listed
# support-dependent integration tests are owned by the sibling
# frankenengine-control-plane-integration-tests package, which supplies
# frankenengine-test-support without making engine lib-unit tests compile it.
__moved_to_frankenengine_control_plane_integration_tests = []
# Temporary profiling feature for H4.1 deterministic_serde::encode_into phase analysis.
# Adds #[inline(never)] sentinels around encode phases for perf attribution.
# NEVER enable in production builds - measurement-only.
_h4_profile = []
# Test-only: exposes `MockTeeProvider`/`MockAttestationQuote` (the TEE
# attestation *simulator*) to cross-crate integration tests. The mock signs
# with a fixed, publicly-known HMAC-SHA256 key and attests NOTHING about a real
# TEE, so it must NEVER be enabled in production builds (bd-bg9l1.2). The
# crate's own #[cfg(test)] unit tests reach the mock without this feature; it
# exists purely so integration tests can — and those activate it via the self
# dev-dependency below (which a plain `cargo build`/`--release` does not pull).
tee-test-mock = []
# Real hardware-backed TEE quote path for `tee_live_quote`. OFF by default
# because no Intel SGX / AMD SEV / Intel TDX SDK is integrated yet. With this
# feature OFF, `TeeQuoteGenerator::generate_quote` only ever yields
# `TeeQuoteResult::SimulatedQuote` for the "TEE available" path — never
# `Success` — so a simulated quote can never be mistaken for real hardware
# attestation. With it ON, the real-SDK seam fails closed until an SDK is wired,
# so enabling it cannot fabricate a `Success` either (bd-kppha).
tee-real-sdk = []

[dependencies]
frankenengine-core = { path = "../franken-core" }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = { version = "1.0", features = ["unbounded_depth"] }
proc-macro2 = { version = "1.0", features = ["span-locations"] }
proptest = "1.6"
regex = "1.0"
ryu-js = "1.0"
url = "2.5.8"
digest = "0.10"
sha2 = "0.10"
sha1 = "0.10.6"
md-5 = "0.10.6"
hmac = "0.12"
pbkdf2 = "0.12.2"
scrypt = { version = "0.11.0", default-features = false }
salsa20 = { version = "0.10.2", default-features = false }
aes = { version = "0.8.4", features = ["zeroize"] }
aes-gcm = { version = "0.10.3", default-features = false, features = ["aes", "zeroize"] }
ghash = { version = "0.5.1", default-features = false, features = ["zeroize"] }
polyval = { version = "0.6.2", default-features = false, features = ["zeroize"] }
cbc = "0.1.2"
ctr = "0.9.2"
zeroize = "1.8"
flate2 = "1.1"
zlib-rs = { version = "0.6.3", default-features = false, features = ["std", "rust-allocator"] }
lz4_flex = "0.11"
zstd = "0.13"
brotli = "8.0"
subtle = "2.6"
ed25519-dalek = "2.0"
p256 = { version = "0.13", default-features = false, features = [
    "std",
    "ecdsa",
    "sha256",
] }
rand = "0.8"
hex = "0.4"
base64 = "0.22"
mimalloc = { version = "0.1", default-features = false }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
uuid = { version = "1.16", features = ["v7", "serde"] }
syn = { version = "2.0", features = ["full", "visit"] }
toml = "0.8"
clap = { version = "4.5", features = ["derive"] }
sqlmodel = { version = "0.3.1", optional = true }
sqlmodel-core = { version = "0.3.1", optional = true }
sqlmodel-frankensqlite = { version = "0.3.1", optional = true }
franken-engine-deterministic-trait = { path = "../franken-engine-deterministic-trait" }
franken-engine-deterministic-derive = { path = "../franken-engine-deterministic-derive" }
franken-engine-fixed-layout-derive = { path = "../franken-engine-fixed-layout-derive" }
bumpalo = { version = "3", features = ["collections"] }
unicode-normalization = "0.1"
rustix = { version = "1.1", features = ["event", "fs", "process", "time"] }
wait4 = "0.1"
wait-timeout = "0.2"
frankenengine-extension-host = { path = "../franken-extension-host" }
franken-native-capsule-worker = { git = "https://github.com/Dicklesworthstone/franken_native_capsule", rev = "7af57e2c43d42e77eff569b133b263c4e2a858f9", optional = true }
frankenengine-native-capsule = { git = "https://github.com/Dicklesworthstone/franken_native_capsule", rev = "7af57e2c43d42e77eff569b133b263c4e2a858f9", default-features = false, optional = true }
frankenengine-native-capsule-api = { git = "https://github.com/Dicklesworthstone/franken_native_capsule", rev = "7af57e2c43d42e77eff569b133b263c4e2a858f9", optional = true }
fastapi-core = { version = "0.3.1", optional = true }
franken-kernel = { version = "0.3.4", optional = true }
franken-decision = { version = "0.3.4", optional = true }
franken-evidence = { version = "0.3.4", optional = true }
fp-io = { version = "0.2.0", default-features = false, optional = true }
fp-frame = { version = "0.2.0", optional = true }
fp-columnar = { version = "0.2.0", optional = true }
fp-index = { version = "0.2.0", optional = true }
fp-types = { version = "0.2.0", optional = true }
# Bonawitz 2017 secure aggregation primitive (T.3). The QQ.2 protocol module
# (`secure_aggregation.rs`) wraps this vetted sibling crate rather than inlining
# ad-hoc cryptography.
dp = { path = "../dp" }

[dev-dependencies]
# Self dev-dependency: activates the test-only `tee-test-mock` feature for this
# crate's integration tests (e.g. fleet_quarantine_integration.rs) without
# leaking it into the default/production build. Dev-dependencies are not pulled
# by `cargo build`/`--release`, so the mock stays out of prod (bd-bg9l1.2).
#
# `default-features = false` is load-bearing (bd-ndpm2): without it this entry
# re-enables `default` during feature unification, so `cargo test
# --no-default-features` silently rebuilt every `/dp` sibling and the gate's
# standalone-test lane proved nothing. Requesting only `tee-test-mock` here
# leaves an ordinary `cargo test` unchanged — the lib target still brings
# `default` in — while letting the standalone lane actually be standalone.
frankenengine-engine = { path = ".", default-features = false, features = [
    "tee-test-mock",
] }
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3.0"
tracing = "0.1"
# insta snapshot-testing crate — adoption spike for bd-ub6x8.11. One demo
# test (`tests/insta_spike_demo.rs`) exercises `assert_snapshot!`,
# `assert_debug_snapshot!`, `Settings::add_filter`, and the bound-trait
# rendering helper to show how the project's hand-rolled golden helpers
# (~13 inline `assert_golden` copies, bd-ub6x8.3) would migrate. The
# `yaml` feature is opt-out by default; we keep the default features so
# `cargo insta review` works out of the box. The `filters` feature is
# required for `Settings::add_filter` — gated since insta 1.41 (bd-drdxa).
insta = { version = "1.39", features = ["filters"] }

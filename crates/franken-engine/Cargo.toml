[features]
default = ["asupersync-integration"]
asupersync-integration = [
    "dep:franken-kernel",
    "dep:franken-decision",
    "dep:franken-evidence",
]
certified_rewrite_optimizer_integration = []
# Do not enable this feature in normal engine validation. The listed
# support-dependent integration tests are owned by the sibling
# frankenengine-control-plane-integration-tests package, which supplies
# frankenengine-test-support without making engine lib-unit tests compile it.
__moved_to_frankenengine_control_plane_integration_tests = []
# Opt-in re-enable of the baseline_interpreter in-source #[cfg(test)] module
# that references a legacy lower-level API (`BaselineInterpreter::new`,
# `Ir3Instruction::CallBuiltin{,Id}`, `execute_instruction`, `set_register`,
# `test_ir3_module`, etc.). The module was broken at merge-base into main and
# is tracked by bd-2j7uk; gating it keeps the lib-test target compilable while
# the repair effort is pending. Enable with `--features legacy_lib_tests_bd_2j7uk`
# to attempt to compile the legacy tests.
legacy_lib_tests_bd_2j7uk = []

[dependencies]
# NOTE: frankenengine-core dependency temporarily removed — franken-core crate
# is mid-modularization (cb049273) and does not yet compile. franken-engine
# does not reference any frankenengine_core:: paths, so the dep is currently
# unused. Re-add once the extraction stabilizes.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
proc-macro2 = { version = "1.0", features = ["span-locations"] }
sha2 = "0.10"
subtle = "2.6"
hmac = "0.12"
ed25519-dalek = "2.0"
rand = "0.8"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
uuid = { version = "1.16", features = ["v7", "serde"] }
syn = { version = "2.0", features = ["full", "visit"] }
toml = "0.8"
clap = "4.5"
sqlmodel = { path = "/dp/sqlmodel_rust/crates/sqlmodel" }
sqlmodel-core = { path = "/dp/sqlmodel_rust/crates/sqlmodel-core" }
sqlmodel-frankensqlite = { path = "/dp/sqlmodel_rust/crates/sqlmodel-frankensqlite" }
franken-engine-deterministic-trait = { path = "../franken-engine-deterministic-trait" }
franken-engine-deterministic-derive = { path = "../franken-engine-deterministic-derive" }
unicode-normalization = "0.1"
rustix = { version = "1.1", features = ["event", "fs", "process", "time"] }
wait4 = "0.1"
wait-timeout = "0.2"
frankenengine-extension-host = { path = "../franken-extension-host" }
fastapi-core = { path = "/dp/fastapi_rust/crates/fastapi-core" }
franken-kernel = { version = "0.3.1", optional = true }
franken-decision = { version = "0.3.1", optional = true }
franken-evidence = { version = "0.3.1", optional = true }
fp-io = { path = "/dp/frankenpandas/crates/fp-io", default-features = false }
fp-frame = { path = "/dp/frankenpandas/crates/fp-frame" }
fp-columnar = { path = "/dp/frankenpandas/crates/fp-columnar" }
fp-index = { path = "/dp/frankenpandas/crates/fp-index" }
fp-types = { path = "/dp/frankenpandas/crates/fp-types" }

[dev-dependencies]
proptest = "1.6"
regex = "1.0"
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3.0"
tracing = "0.1"

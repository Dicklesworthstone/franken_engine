[package]
name = "frankenengine-engine-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
arbitrary = "1.4"
frankenengine-engine = { path = "..", default-features = false }
libfuzzer-sys = "0.4"
serde_json = "1.0"
tempfile = "3"

[patch.crates-io]
fsqlite = { path = "/dp/frankensqlite/crates/fsqlite" }
fsqlite-core = { path = "/dp/frankensqlite/crates/fsqlite-core" }
fsqlite-types = { path = "/dp/frankensqlite/crates/fsqlite-types" }
fsqlite-error = { path = "/dp/frankensqlite/crates/fsqlite-error" }

[[bin]]
name = "audit_markdown_parser"
path = "fuzz_targets/audit_markdown_parser.rs"
test = false
doc = false

[package]
name = "frankenengine-metamorphic"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
# Real engine, for the EngineEvalAdapter (bd-x9t1n.1): the metamorphic oracle
# must exercise frankenengine-engine, not a self-contained toy interpreter
# (bd-q90jg). One-way dep only — the engine must NOT depend on this crate.
# See bd-ndpm2: `default-features = false` stops this edge from re-enabling
# the engine's /dp sibling features in a standalone workspace build. The
# metamorphic relations drive the parser/lowering/interpreter only.
frankenengine-engine = { path = "../franken-engine", default-features = false, features = [
    "asupersync-integration",
] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
hex = "0.4"
sha2 = "0.10"
toml = "0.8"

[dev-dependencies]
anyhow = { workspace = true }

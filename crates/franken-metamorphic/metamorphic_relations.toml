[[relations]]
id = "parser_unicode_escape_equivalence"
subsystem = "parser"
description = "Unicode escaped identifiers remain semantically equivalent to plain identifiers."
oracle = "ast_equality"
budget_pairs = 1000
# DISABLED pending bd-dbosg: now that the parser oracle runs through the REAL
# engine (bd-x9t1n.2), this relation correctly diverges — CanonicalEs2020Parser
# REJECTS unicode-escaped identifiers: a name spelled with a \u-escape (e.g.
# u006e-e-t for "net") is rejected though the plain "net" parses, violating
# ES2020 §11.6 (IdentifierName may contain UnicodeEscapeSequences). Real engine
# gap surfaced by the now-real oracle, not
# a metamorphic-suite issue; re-enable once bd-dbosg lands so the relation
# provides genuine engine assurance instead of a tracked known-failure.
enabled = false


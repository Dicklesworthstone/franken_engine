cargo_command = "cargo test -p frankenengine-engine --lib composable_gate_framework"
needs_rch = true

[gates.claim_to_proof_matrix_gate]
name = "claim_to_proof_matrix_gate"
description = "Claim-language source-span and proof artifact gate"
artifact_root = "artifacts/claim_to_proof_matrix_gate"
command = "./scripts/run_claim_to_proof_matrix_gate.sh ci"
needs_rch = false
generates_manifest = true

[gates.replay_coverage_metric_gate]
name = "replay_coverage_metric_gate"
description = "Replay coverage metric artifact for security-critical decisions"
artifact_root = "artifacts/replay_coverage_metric"
command = "./scripts/run_replay_coverage_metric_gate.sh ci"

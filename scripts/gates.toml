# Gate Runner Configuration
# Bead: bd-2737p.4 - Consolidate 388 shell scripts into parameterized gate runner
#
# This configuration defines parameters for all gate runners, allowing
# the consolidation of 388+ shell scripts into a single parameterized
# runner with gate-specific configuration.

[global]
# Default settings applied to all gates unless overridden
default_mode = "ci"
default_rch_timeout_seconds = 900
default_rch_build_timeout_seconds = 1800
default_cargo_build_jobs = 2
default_target_dir_prefix = "/tmp/rch_target_franken_engine"

[gates.adversarial_campaign_gate]
name = "adversarial_campaign_gate"
description = "Adversarial campaign detection and mitigation gate"
artifact_root = "artifacts/adversarial_campaign_gate"
input_fixture = "crates/franken-engine/tests/fixtures/adversarial_campaign_gate_input_v1.json"
cargo_command = "cargo test -p frankenengine-engine --lib adversarial_campaign"
needs_rch = true
generates_gate_result = true

[gates.ambient_mock_guard]
name = "ambient_mock_guard"
description = "Ambient mock guard for production context isolation"
artifact_root = "artifacts/ambient_mock_guard"
env_bootstrap = "scripts/e2e/parser_deterministic_env.sh"
cargo_command = "cargo check -p frankenengine-engine --lib"
needs_rch = true
generates_manifest = true

[gates.allocation_elision_gate]
name = "allocation_elision_gate"
description = "Allocation elision governance gate"
artifact_root = "artifacts/allocation_elision_gate"
cargo_command = "cargo test -p frankenengine-engine --lib allocation_elision"
needs_rch = true
rch_timeout_seconds = 1200

[gates.benchmark_coverage_saturation_gate]
name = "benchmark_coverage_saturation_gate"
description = "Benchmark coverage saturation and distribution gate"
artifact_root = "artifacts/benchmark_coverage_saturation_gate"
cargo_command = "cargo test -p frankenengine-engine --lib benchmark_coverage"
needs_rch = true

[gates.native_addon_parity_gate]
name = "native_addon_parity_gate"
description = "Native addon parity, security, and throughput gate"
artifact_root = "artifacts/native_addon_parity_gate"
cargo_command = "cargo test -p frankenengine-engine --lib native_addon_parity"
needs_rch = true

[gates.test262_conformance_runner]
name = "test262_conformance_runner"
description = "Test262 JavaScript conformance testing gate"
artifact_root = "artifacts/test262_conformance"
cargo_command = "cargo test -p frankenengine-engine --lib test262_conformance"
needs_rch = true

# E2E replay gates
[gates.adversarial_campaign_replay]
name = "adversarial_campaign_replay"
description = "Adversarial campaign gate replay validation"
artifact_root = "artifacts/adversarial_campaign_gate"
is_replay = true
replay_source_gate = "adversarial_campaign_gate"

[gates.ambient_mock_guard_replay]
name = "ambient_mock_guard_replay"
description = "Ambient mock guard replay validation"
artifact_root = "artifacts/ambient_mock_guard"
is_replay = true
replay_source_gate = "ambient_mock_guard"

# Meta-configuration for script generation
[meta]
total_gates = 53
total_scripts_to_replace = 388
script_pattern_types = [
    "run_*_gate.sh",
    "run_*_suite.sh",
    "*_replay.sh",
    "check_*.sh"
]

# Common file outputs preserved across all gates
[outputs]
manifest_file = "run_manifest.json"
events_file = "events.jsonl"
commands_file = "commands.txt"
gate_result_file = "gate_result.json"
step_logs_dir = "step_logs"
rch_step_logs_dir = "rch_step_logs"
